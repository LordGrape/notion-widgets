name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository:
    name: repository (typecheck + PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:assistant
      - run: node tools/build-widget-icons.mjs --check

  studyengine:
    name: studyengine (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studyengine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studyengine/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:build
      - run: node ../tools/verify-study-engine.mjs

  worker:
    name: worker (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --passWithNoTests
      - run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/study-engine-worker
