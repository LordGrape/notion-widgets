name: Add smart timetable labels

on:
  push:
    paths:
      - tools/add-smart-timetable-labels.mjs
      - .github/workflows/add-smart-timetable-labels.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add compact labels and styled tooltips
        run: node tools/add-smart-timetable-labels.mjs
      - name: Validate timetable
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.inline=False; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='script': self.inline=not dict(attrs).get('src')
              def handle_endtag(self, tag):
                  if tag=='script': self.inline=False
              def handle_data(self, data):
                  if self.inline: self.parts.append(data)
          text=Path('timetable.html').read_text()
          assert 'compactLabel(c)' in text
          assert 'id="smartTip"' in text
          assert 'title="' not in '\n'.join(line for line in text.splitlines() if 'class="pill"' in line)
          p=Scripts(); p.feed(text); Path('/tmp/timetable.js').write_text('\n'.join(p.parts))
          PY
          node --check /tmp/timetable.js
      - name: Commit display improvements
        run: |
          if [[ -n "$(git status --porcelain timetable.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add timetable.html
            git commit -m "Improve timetable labels and tooltips"
            git push
          else
            echo "Timetable labels already current"
          fi
