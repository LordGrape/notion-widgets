name: Harden Action Blocks storage
on:
  push:
    branches: [main]
    paths:
      - 'tools/hotfix-action-blocks-storage.mjs'
      - '.github/workflows/hotfix-action-blocks-storage.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotfix-action-blocks-storage
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate
        run: |
          node tools/hotfix-action-blocks-storage.mjs
          node --check action-blocks.js
          git diff --check
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add action-blocks.js
          git commit -m 'Harden Action Blocks task sync'
          git push origin HEAD:main
