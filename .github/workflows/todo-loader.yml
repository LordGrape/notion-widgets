name: To-Do browser regression
on:
  push:
    paths: ['todo*.html', 'todo*.js', 'tools/test-todo-loader.cjs', '.github/workflows/todo-loader.yml']
  pull_request:
    paths: ['todo*.html', 'todo*.js', 'tools/test-todo-loader.cjs', '.github/workflows/todo-loader.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tools/test-todo-loader.cjs
