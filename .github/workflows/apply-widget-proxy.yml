name: Apply Stable Widget Proxy

on:
  push:
    branches: [main]
    paths:
      - 'worker/src/routes/widgets.ts'
      - 'worker/test/widgets.test.ts'
      - 'tools/apply-widget-proxy.mjs'
      - '.github/workflows/apply-widget-proxy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-widget-proxy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Apply proxy patch
        run: node tools/apply-widget-proxy.mjs
      - name: Validate Worker
        working-directory: worker
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --passWithNoTests
      - name: Commit production changes
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/auth.ts worker/src/index.ts
          git commit -m 'Serve widgets from the sync Worker'
          git push origin HEAD:main
