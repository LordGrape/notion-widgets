name: Apply Distinct Timetable Colours

on:
  push:
    branches: [main]
    paths:
      - tools/add-distinct-timetable-colors.mjs
      - tools/test-distinct-timetable-colors.mjs
      - .github/workflows/apply-distinct-timetable-colors.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply asserted palette update
        run: node tools/add-distinct-timetable-colors.mjs
      - name: Check timetable JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('timetable.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(!scripts.length)throw new Error('No inline timetable script found');
          fs.writeFileSync('/tmp/timetable-inline.js',scripts.at(-1)[1]);
          NODE
          node --check /tmp/timetable-inline.js
      - name: Run palette and persistence regressions
        run: |
          node tools/test-distinct-timetable-colors.mjs
          node tools/test-timetable-persistence.mjs
          node tools/test-action-blocks-editor-v2.mjs
      - name: Check patch formatting
        run: git diff --check
      - name: Commit production palette
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable.html
          git commit -m "Add distinct timetable colours"
          git push origin HEAD:main
