name: Fix organized widget paths
on:
  push:
    paths: [.github/workflows/fix-organized-paths.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('tools/build-athlete.mjs'); s=b.read_text()
          old="const sourceNames=['athlete.source.html','athlete.css','theme-upgrade.css','athlete-settings.css','athlete-training.css','core.js','athlete-body.js','athlete-data.js','athlete-training-data.js','athlete-render.js','athlete-flow.js','athlete-settings.js','athlete-training-ui.js','athlete-notion.js'];\nconst loaded=Object.fromEntries(await Promise.all(sourceNames.map(async name=>[name,await readFile(join(root,name),'utf8')])))"
          new="const sourcePaths={'athlete.source.html':'apps/athlete/src/index.html','athlete.css':'apps/athlete/src/styles/athlete.css','theme-upgrade.css':'packages/theme/theme-upgrade.css','athlete-settings.css':'apps/athlete/src/styles/athlete-settings.css','athlete-training.css':'apps/athlete/src/styles/athlete-training.css','core.js':'core.js',...Object.fromEntries(['athlete-body.js','athlete-data.js','athlete-training-data.js','athlete-render.js','athlete-flow.js','athlete-settings.js','athlete-training-ui.js','athlete-notion.js'].map(n=>[n,'apps/athlete/src/scripts/'+n]))};\nconst loaded=Object.fromEntries(await Promise.all(Object.entries(sourcePaths).map(async([name,path])=>[name,await readFile(join(root,path),'utf8')])))"
          assert old in s; s=s.replace(old,new)
          s=s.replace("src=[\"']core\\.js", "src=[\"'](?:\\.\\.\\/){3}core\\.js")
          s=s.replace("href=[\"']${escaped}", "href=[\"'](?:styles\\/|(?:\\.\\.\\/){3}packages\\/theme\\/)?${escaped}")
          s=s.replace("src=[\"']${escaped}", "src=[\"']scripts\\/${escaped}")
          s=s.replace("join(root,'athlete.html')", "join(root,'apps/athlete/athlete.html')")
          s=s.replace('Edit athlete.source.html or its source assets','Edit apps/athlete/src')
          b.write_text(s)
          v=Path('tools/verify-athlete.mjs'); s=v.read_text().replace("join(root,'athlete.html')","join(root,'apps/athlete/athlete.html')")
          for n in ['athlete-body.js','athlete-data.js','athlete-training-data.js']:
              s=s.replace(f"join(root,'{n}')",f"join(root,'apps/athlete/src/scripts/{n}')")
          v.write_text(s)
          w=Path('.github/workflows/build-athlete.yml'); s=w.read_text()
          a=s.index('    paths:'); z=s.index('  workflow_dispatch:',a)
          s=s[:a]+'''    paths:\n      - apps/athlete/**\n      - packages/theme/theme-upgrade.css\n      - core.js\n      - tools/build-athlete.mjs\n      - tools/verify-athlete.mjs\n      - .github/workflows/build-athlete.yml\n'''+s[z:]
          s=s.replace('git diff --quiet -- athlete.html','git diff --quiet -- apps/athlete/athlete.html').replace('git add athlete.html','git add apps/athlete/athlete.html')
          s=s.replace('https://notion-widgets-93r.pages.dev/athlete.html','https://notion-widgets-93r.pages.dev/apps/athlete/athlete.html')
          w.write_text(s)
          PY
          node tools/build-athlete.mjs
          node tools/build-athlete.mjs --check
          node tools/verify-athlete.mjs
          rm .github/workflows/fix-organized-paths.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update builds for organized widget sources"
          git push
