name: Schedule paste regression
on:
  push:
    paths:
      - 'todo*.js'
      - 'todo*.html'
      - 'tools/verify-schedule-paste.cjs'
      - '.github/workflows/schedule-paste.yml'
  pull_request:
    paths:
      - 'todo*.js'
      - 'todo*.html'
      - 'tools/verify-schedule-paste.cjs'
      - '.github/workflows/schedule-paste.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/verify-schedule-paste.cjs
