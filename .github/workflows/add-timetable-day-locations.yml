name: Add timetable day locations

on:
  push:
    paths:
      - tools/add-timetable-day-locations.mjs
      - .github/workflows/add-timetable-day-locations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add per-day locations
        run: node tools/add-timetable-day-locations.mjs
      - name: Validate timetable
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.inline=False; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag=='script': self.inline=not dict(attrs).get('src')
              def handle_endtag(self, tag):
                  if tag=='script': self.inline=False
              def handle_data(self, data):
                  if self.inline: self.parts.append(data)
          text=Path('timetable.html').read_text()
          assert 'data-f="location"' in text
          assert 'd.location||b.location' in text
          p=Scripts(); p.feed(text); Path('/tmp/timetable.js').write_text('\n'.join(p.parts))
          PY
          node --check /tmp/timetable.js
      - name: Commit location support
        run: |
          if [[ -n "$(git status --porcelain timetable.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add timetable.html
            git commit -m "Support locations per timetable day"
            git push
          else
            echo "Per-day locations already supported"
          fi
