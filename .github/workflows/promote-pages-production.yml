name: Promote Widgets to Pages Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-pages-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-widgets-pages-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare static site
        run: |
          rm -rf site
          mkdir site
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name 'quotes.json' \) -exec cp '{}' site/ \;
          cp -R assets site/assets
          cp -R studyengine site/studyengine

      - name: Set production branch and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https:""//api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API" -o /tmp/projects.json
          project=$(node -e 'const d=require("/tmp/projects.json"),x=Array.isArray(d.result)?d.result:[],m=x.find(p=>p.subdomain==="notion-widgets-93r.pages.dev");process.stdout.write(m?.name||"")')
          test -n "$project"
          curl -fsS -X PATCH "${API}/${project}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"production_branch":"main"}' -o /tmp/project-update.json
          node -e 'const d=require("/tmp/project-update.json");if(!d.success)process.exit(1)'
          npx --yes wrangler@4.84.1 pages deploy site \
            --project-name="$project" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

      - name: Verify the production URL
        run: |
          BASE="https:""//notion-widgets-93r.pages.dev"
          for attempt in $(seq 1 30); do
            if curl -fsS "${BASE}/action-blocks.js?sha=${GITHUB_SHA}" -o /tmp/action-blocks.js \
              && grep -q 'Action Blocks v1' /tmp/action-blocks.js \
              && grep -q 'isTodoWidget=false' /tmp/action-blocks.js \
              && curl -fsS "${BASE}/timetable.html?sha=${GITHUB_SHA}" | grep -q 'action-blocks.js' \
              && curl -fsS "${BASE}/todo.html?sha=${GITHUB_SHA}" | grep -q 'action-blocks.js'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Record verified production
        run: |
          mkdir -p deployments
          printf '%s\n' "$GITHUB_SHA" > deployments/pages-main.txt
          rm -f deployments/pages-last-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A deployments
          git commit -m 'Record verified Pages production'
          git push origin HEAD:main
