name: Organize repository for coding agents
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/organize-repository.yml
permissions:
  contents: write
concurrency:
  group: organize-repository-once
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-time organization
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gunzip > /tmp/organize-repository.mjs
          node /tmp/organize-repository.mjs
      - name: Commit organized repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize widget sources and agent guidance"
          git push
