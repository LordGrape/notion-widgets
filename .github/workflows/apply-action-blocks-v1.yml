name: Apply Action Blocks v1

on:
  push:
    branches: [main]
    paths:
      - 'action-blocks.js'
      - 'worker/src/routes/action-blocks.ts'
      - 'worker/test/action-blocks.test.ts'
      - 'tools/apply-action-blocks-v1.mjs'
      - '.github/workflows/apply-action-blocks-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-action-blocks-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Apply deterministic integration patch
        run: node tools/apply-action-blocks-v1.mjs
      - name: Validate browser scripts
        run: |
          node --check action-blocks.js
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          for(const file of ['timetable.html','todo.html']){
            const html=fs.readFileSync(file,'utf8');
            const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
            blocks.forEach((src,i)=>{const p=`/tmp/${file}.${i}.js`;fs.writeFileSync(p,src);cp.execFileSync('node',['--check',p],{stdio:'inherit'});});
          }
          NODE
      - name: Validate Worker
        working-directory: worker
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --passWithNoTests
      - name: Commit production changes
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'Integration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core.js timetable.html todo.html worker/src/index.ts worker/src/types.ts
          git commit -m 'Connect timetable actions to Notion and to-do'
          git push origin HEAD:main
