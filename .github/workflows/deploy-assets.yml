name: Deploy FIRAC Reader

on:
  push:
    branches: [main]
    paths:
      - 'firac-reader/**'
      - '.github/workflows/deploy-assets.yml'
  workflow_dispatch:

concurrency:
  group: deploy-firac-reader
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy firac-reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy FIRAC Reader
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: deploy --config firac-reader/wrangler.jsonc
