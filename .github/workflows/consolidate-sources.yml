# consolidation trigger
name: Consolidate widget sources
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/consolidate-sources.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: consolidate-widget-sources
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Organize application sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/athlete/src/scripts apps/athlete/src/styles apps/quotes/src packages/theme
          git mv athlete.source.html apps/athlete/src/index.html
          for f in athlete-body.js athlete-data.js athlete-training-data.js athlete-render.js athlete-flow.js athlete-settings.js athlete-training-ui.js athlete-notion.js; do git mv "$f" "apps/athlete/src/scripts/$f"; done
          for f in athlete.css athlete-settings.css athlete-training.css; do git mv "$f" "apps/athlete/src/styles/$f"; done
          git mv quotes.html apps/quotes/src/index.html
          git mv quotes.json apps/quotes/src/quotes.json
          git mv theme-upgrade.css packages/theme/theme-upgrade.css

          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/athlete/src/index.html'); s=p.read_text()
          s=s.replace('src="core.js"','src="../../../core.js"')
          s=s.replace('href="athlete.css?v=3"','href="styles/athlete.css?v=3"')
          s=s.replace('href="theme-upgrade.css?v=20260817-royal-violet"','href="../../../packages/theme/theme-upgrade.css?v=20260817-royal-violet"')
          s=s.replace('href="athlete-settings.css?v=1"','href="styles/athlete-settings.css?v=1"')
          s=s.replace('href="athlete-training.css?v=1"','href="styles/athlete-training.css?v=1"')
          for n in ['athlete-body.js','athlete-data.js','athlete-training-data.js','athlete-render.js','athlete-flow.js','athlete-settings.js','athlete-training-ui.js','athlete-notion.js']:
              s=s.replace(f'src="{n}',f'src="scripts/{n}')
          p.write_text(s)

          for p in Path('.').glob('*.html'):
              if p.name == 'athlete.html': continue
              t=p.read_text(); t=t.replace('theme-upgrade.css','packages/theme/theme-upgrade.css'); p.write_text(t)

          b=Path('tools/build-athlete.mjs'); t=b.read_text()
          t=t.replace("const root=resolve(dirname(fileURLToPath(import.meta.url)),'..');", "const root=resolve(dirname(fileURLToPath(import.meta.url)),'..');\nconst athlete=join(root,'apps/athlete/src');")
          t=t.replace("const sourceNames=['athlete.source.html','athlete.css','theme-upgrade.css','athlete-settings.css','athlete-training.css','core.js','athlete-body.js','athlete-data.js','athlete-training-data.js','athlete-render.js','athlete-flow.js','athlete-settings.js','athlete-training-ui.js','athlete-notion.js'];\nconst loaded=Object.fromEntries(await Promise.all(sourceNames.map(async name=>[name,await readFile(join(root,name),'utf8')])));", "const sourcePaths={'athlete.source.html':join(athlete,'index.html'),'athlete.css':join(athlete,'styles/athlete.css'),'theme-upgrade.css':join(root,'packages/theme/theme-upgrade.css'),'athlete-settings.css':join(athlete,'styles/athlete-settings.css'),'athlete-training.css':join(athlete,'styles/athlete-training.css'),'core.js':join(root,'core.js'),...Object.fromEntries(['athlete-body.js','athlete-data.js','athlete-training-data.js','athlete-render.js','athlete-flow.js','athlete-settings.js','athlete-training-ui.js','athlete-notion.js'].map(name=>[name,join(athlete,'scripts',name)]))};\nconst loaded=Object.fromEntries(await Promise.all(Object.entries(sourcePaths).map(async([name,path])=>[name,await readFile(path,'utf8')])));")
          t=t.replace("src=[\"']core\\.js", "src=[\"'](?:\\.\\.\\/){3}core\\.js")
          t=t.replace("href=[\"']${escaped}", "href=[\"'](?:styles\\/|(?:\\.\\.\\/){3}packages\\/theme\\/)?${escaped}")
          t=t.replace("src=[\"']${escaped}", "src=[\"']scripts\\/${escaped}")
          t=t.replace("const outputPath=join(root,'athlete.html');", "const outputPath=join(root,'apps/athlete/athlete.html');")
          t=t.replace("const banner='<!-- Generated by tools/build-athlete.mjs. Edit athlete.source.html or its source assets, not this file. -->", "const banner='<!-- Generated by tools/build-athlete.mjs. Edit apps/athlete/src, not this file. -->")
          t=t.replace("else{await writeFile(outputPath,output,'utf8');console.log(`Built athlete.html", "else{await writeFile(outputPath,output,'utf8');await writeFile(join(root,'athlete.html'),'<!doctype html>\\n<meta charset=\"utf-8\">\\n<script>location.replace(\"/apps/athlete/athlete.html\"+location.search+location.hash)</script>\\n','utf8');console.log(`Built athlete.html")
          b.write_text(t)

          v=Path('tools/verify-athlete.mjs'); t=v.read_text().replace("join(root,'athlete.html')","join(root,'apps/athlete/athlete.html')")
          for n in ['athlete-body.js','athlete-data.js','athlete-training-data.js']:
              t=t.replace(f"join(root,'{n}')",f"join(root,'apps/athlete/src/scripts/{n}')")
          v.write_text(t)
          PY

          cat > quotes.html <<'EOF'
          <!doctype html><meta charset="utf-8"><script>location.replace('/apps/quotes/src/index.html'+location.search+location.hash)</script>
          EOF
          rm -f quotes.json

          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-athlete.yml'); s=p.read_text()
          start=s.index('    paths:'); end=s.index('  workflow_dispatch:',start)
          s=s[:start]+'''    paths:\n      - apps/athlete/**\n      - packages/theme/theme-upgrade.css\n      - core.js\n      - tools/build-athlete.mjs\n      - tools/verify-athlete.mjs\n      - .github/workflows/build-athlete.yml\n'''+s[end:]
          p.write_text(s)
          PY

          find tools -maxdepth 1 -type f \( -name 'apply-*' -o -name 'add-*' -o -name 'fix-*' -o -name 'hotfix-*' -o -name 'restore-*' -o -name 'repair-*' -o -name 'test-*' -o -name '*.payload*' \) -delete
          find .github/workflows -maxdepth 1 -type f ! -name 'ci.yml' ! -name 'build-athlete.yml' ! -name 'deploy-worker.yml' ! -name 'consolidate-sources.yml' -delete
          node tools/build-athlete.mjs
          node tools/build-athlete.mjs --check
          node tools/verify-athlete.mjs
          rm .github/workflows/consolidate-sources.yml

      - name: Commit organized repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate widget sources by application"
          git push
