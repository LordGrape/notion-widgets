name: Apply to-do context menu upgrade

on:
  push:
    branches: [main]
    paths:
      - tools/apply-todo-context-menu.py
      - .github/workflows/apply-todo-context-menu.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source patch
        run: python3 tools/apply-todo-context-menu.py
      - name: Validate edited widget
        run: |
          node --check /tmp/todo-inline.js
          git diff --check
          grep -q "openComposerChooser" todo.html
          grep -q "Choose a future date" todo.html
      - name: Commit final widget and remove migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todo.html
          git rm tools/apply-todo-context-menu.py .github/workflows/apply-todo-context-menu.yml
          git commit -m "Add direct task field menus and future due dates"
          git push origin main
