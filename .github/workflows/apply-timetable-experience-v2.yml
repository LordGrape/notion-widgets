name: Apply Timetable Experience v2

on:
  push:
    branches: [main]
    paths:
      - tools/timetable-experience-v2.payload.1
      - tools/timetable-experience-v2.payload.2
      - tools/timetable-experience-v2-test.payload
      - .github/workflows/apply-timetable-experience-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decode asserted patch and test
        run: |
          cat tools/timetable-experience-v2.payload.1 tools/timetable-experience-v2.payload.2 | base64 -d | gzip -d > /tmp/apply.mjs
          base64 -d tools/timetable-experience-v2-test.payload | gzip -d > /tmp/test.mjs
          node --check /tmp/apply.mjs
          node --check /tmp/test.mjs
      - name: Apply and verify upgrade
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node /tmp/apply.mjs
            node --check action-blocks.js
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('timetable.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          if(!blocks.length)throw new Error('No inline timetable script found');
          blocks.forEach((source,index)=>new vm.Script(source,{filename:`timetable.html:inline-${index+1}`}));
          NODE
            node /tmp/test.mjs
            node tools/test-timetable-persistence.mjs
            node tools/test-action-blocks-editor-v2.mjs
            node tools/test-clear-schedule-language-v1.mjs
            node tools/test-adaptive-weekly-targets-v1.mjs
            node tools/test-distinct-timetable-colors.mjs
            git diff --check
          } 2>&1 | tee /tmp/timetable-experience-v2.log
      - name: Publish failure diagnostic
        if: steps.verify.outcome == 'failure'
        run: |
          git restore timetable.html action-blocks.js
          mkdir -p deployments
          cp /tmp/timetable-experience-v2.log deployments/timetable-experience-v2-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/timetable-experience-v2-status.txt
          git commit -m "Record timetable upgrade diagnostic"
          git push origin HEAD:main
      - name: Stop after failure
        if: steps.verify.outcome == 'failure'
        run: exit 1
      - name: Commit production upgrade
        if: steps.verify.outcome == 'success'
        run: |
          rm -f deployments/timetable-experience-v2-status.txt
          if git diff --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable.html action-blocks.js deployments/timetable-experience-v2-status.txt
          git commit -m "Streamline timetable and add calendar view"
          git push origin HEAD:main
