name: Apply Adaptive Weekly Targets v1

on:
  push:
    branches: [main]
    paths:
      - tools/apply-adaptive-weekly-targets-v1.mjs
      - tools/test-adaptive-weekly-targets-v1.mjs
      - .github/workflows/apply-adaptive-weekly-targets-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted adaptive-target patch
        run: node tools/apply-adaptive-weekly-targets-v1.mjs
      - name: Check JavaScript syntax
        run: |
          node --check action-blocks.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          for(const file of ['timetable.html','todo.html']){
            const html=fs.readFileSync(file,'utf8');
            const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
            blocks.forEach((source,index)=>new vm.Script(source,{filename:`${file}:inline-${index+1}`}));
          }
          NODE
      - name: Run adaptive and existing regressions
        run: |
          node tools/test-adaptive-weekly-targets-v1.mjs
          node tools/test-clear-schedule-language-v1.mjs
          node tools/test-seamless-planning-v1.mjs
          node tools/test-action-blocks-editor-v2.mjs
          node tools/test-timetable-persistence.mjs
          node tools/test-distinct-timetable-colors.mjs
      - name: Check patch formatting
        run: git diff --check
      - name: Commit production changes
        run: |
          if git diff --quiet; then
            echo "No production changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action-blocks.js timetable.html todo.html apps/timetable/README.md apps/todo/README.md tools/test-clear-schedule-language-v1.mjs
          git commit -m "Add adaptive weekly targets"
          git push
