name: Apply Adaptive Weekly Targets v1

on:
  push:
    branches: [main]
    paths:
      - tools/apply-adaptive-weekly-targets-v1.mjs
      - tools/test-adaptive-weekly-targets-v1.mjs
      - .github/workflows/apply-adaptive-weekly-targets-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply asserted adaptive-target patch
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/apply-adaptive-weekly-targets-v1.mjs 2>&1 | tee /tmp/adaptive-target-patch.log
      - name: Publish patch diagnostic
        if: steps.patch.outcome == 'failure'
        run: |
          git restore .
          mkdir -p deployments
          cp /tmp/adaptive-target-patch.log deployments/adaptive-target-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/adaptive-target-debug.txt
          git commit -m "Record adaptive target patch diagnostic"
          git push
      - name: Stop after patch diagnostic
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - name: Check JavaScript syntax
        if: steps.patch.outcome == 'success'
        run: |
          node --check action-blocks.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          for(const file of ['timetable.html','todo.html']){
            const html=fs.readFileSync(file,'utf8');
            const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
            blocks.forEach((source,index)=>new vm.Script(source,{filename:`${file}:inline-${index+1}`}));
          }
          NODE
      - name: Run adaptive and existing regressions
        id: tests
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            node tools/test-adaptive-weekly-targets-v1.mjs
            node tools/test-clear-schedule-language-v1.mjs
            node tools/test-seamless-planning-v1.mjs
            node tools/test-action-blocks-editor-v2.mjs
            node tools/test-timetable-persistence.mjs
            node tools/test-distinct-timetable-colors.mjs
          } 2>&1 | tee /tmp/adaptive-target-tests.log
      - name: Publish test diagnostic
        if: steps.tests.outcome == 'failure'
        run: |
          git restore .
          mkdir -p deployments
          cp /tmp/adaptive-target-tests.log deployments/adaptive-target-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/adaptive-target-debug.txt
          git commit -m "Record adaptive target test diagnostic"
          git push
      - name: Stop after test diagnostic
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Check patch formatting
        if: steps.tests.outcome == 'success'
        run: git diff --check
      - name: Commit production changes
        if: steps.tests.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo "No production changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action-blocks.js timetable.html todo.html apps/timetable/README.md apps/todo/README.md tools/test-clear-schedule-language-v1.mjs
          git commit -m "Add adaptive weekly targets"
          git push
