name: Build athlete widget

on:
  push:
    branches: [main]
    paths:
      - athlete.source.html
      - athlete.css
      - theme-upgrade.css
      - core.js
      - athlete-body.js
      - athlete-data.js
      - athlete-render.js
      - athlete-flow.js
      - tools/build-athlete.mjs
      - tools/verify-athlete.mjs
      - .github/workflows/build-athlete.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-athlete-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble and verify the single-file widget
        run: |
          node tools/build-athlete.mjs
          node tools/build-athlete.mjs --check
          node tools/verify-athlete.mjs
      - name: Commit the generated widget
        run: |
          if git diff --quiet -- athlete.html; then
            echo "athlete.html is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add athlete.html
            git commit -m "Build self-contained athlete widget"
            git push
          fi
