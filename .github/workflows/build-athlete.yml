name: Build and verify athlete widget
on:
  push:
    branches: [main]
    paths:
      - athlete.source.html
      - athlete.css
      - athlete-settings.css
      - athlete-training.css
      - theme-upgrade.css
      - core.js
      - athlete-body.js
      - athlete-data.js
      - athlete-training-data.js
      - athlete-render.js
      - athlete-flow.js
      - athlete-settings.js
      - athlete-training-ui.js
      - tools/build-athlete.mjs
      - tools/verify-athlete.mjs
      - .github/workflows/build-athlete.yml
  workflow_dispatch:
permissions:
  contents: write
env:
  ATHLETE_URL: https://notion-widgets-93r.pages.dev/athlete.html
concurrency:
  group: build-athlete-main
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble and verify
        run: |
          node tools/build-athlete.mjs
          node tools/build-athlete.mjs --check
          node tools/verify-athlete.mjs
      - name: Publish generated widget
        run: |
          if git diff --quiet -- athlete.html; then
            echo "athlete.html is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add athlete.html
            git commit -m "Build Athlete training tracker"
            git push
          fi
      - name: Verify production
        shell: bash
        run: |
          deployed=0
          for attempt in $(seq 1 30); do
            page="$(curl -fsSL --max-time 20 "${ATHLETE_URL}?athlete-training=${GITHUB_RUN_ID}-${attempt}" || true)"
            bytes="$(printf '%s' "$page" | wc -c)"
            if [[ "$page" == *'id="trainView"'* ]] \
              && [[ "$page" == *'id="workoutSheet"'* ]] \
              && [[ "$page" == *'data-athlete-inline="athlete-training-ui.js"'* ]] \
              && [[ "$page" == *'Estimated 1RM over time'* ]] \
              && [[ "$page" == *'global lexical bindings'* ]] \
              && [[ "$page" == *'window.SyncEngine = SyncEngine'* ]] \
              && [ "$bytes" -gt 265100 ]; then
              echo "Production is serving the persisted Athlete training tracker (${bytes} bytes)."
              deployed=1
              break
            fi
            echo "Waiting for Cloudflare Pages deployment (${attempt}/30)."
            sleep 10
          done
          [ "$deployed" -eq 1 ]
