name: Build and verify athlete widget
on:
  push:
    branches: [main]
    paths:
      - apps/athlete/**
      - packages/theme/theme-upgrade.css
      - core.js
      - tools/build-athlete.mjs
      - tools/verify-athlete.mjs
      - .github/workflows/build-athlete.yml
  workflow_dispatch:
permissions:
  contents: write
env:
  ATHLETE_URL: https://notion-widgets-93r.pages.dev/apps/athlete/athlete.html
concurrency:
  group: build-athlete-main
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Assemble and verify
        run: |
          node tools/build-athlete.mjs
          node tools/build-athlete.mjs --check
          node tools/verify-athlete.mjs
      - name: Publish generated widget
        run: |
          if git diff --quiet -- apps/athlete/athlete.html; then
            echo "Athlete output is current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/athlete/athlete.html
            git commit -m "Build organized Athlete widget"
            git push
          fi
      - name: Verify production
        run: |
          deployed=0
          for attempt in $(seq 1 30); do
            page="$(curl -fsSL --max-time 20 "${ATHLETE_URL}?build=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [[ "$page" == *'id="trainView"'* ]] && [[ "$page" == *'single-file-v2.3'* ]]; then deployed=1; break; fi
            sleep 10
          done
          [ "$deployed" -eq 1 ]
