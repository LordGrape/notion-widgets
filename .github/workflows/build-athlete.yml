name: Build and verify athlete widget

on:
  push:
    branches: [main]
    paths:
      - athlete.source.html
      - athlete.css
      - theme-upgrade.css
      - core.js
      - athlete-body.js
      - athlete-data.js
      - athlete-render.js
      - athlete-flow.js
      - tools/build-athlete.mjs
      - tools/verify-athlete.mjs
      - .github/workflows/build-athlete.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  ATHLETE_URL: https://notion-widgets-93r.pages.dev/athlete.html

concurrency:
  group: build-athlete-main
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source and production verification
        id: verification
        shell: bash
        run: |
          set +e
          (
            set -e
            node tools/build-athlete.mjs
            node tools/build-athlete.mjs --check
            node tools/verify-athlete.mjs

            deployed=0
            for attempt in $(seq 1 30); do
              page="$(curl -fsSL --max-time 20 "${ATHLETE_URL}?athlete-build=${GITHUB_RUN_ID}-${attempt}" || true)"
              bytes="$(printf '%s' "$page" | wc -c)"
              if printf '%s' "$page" | grep -q '<meta name="athlete-build" content="single-file-v2.2">' \
                && printf '%s' "$page" | grep -q 'data-athlete-inline="core.js"' \
                && printf '%s' "$page" | grep -q 'data-athlete-inline="athlete-flow.js"' \
                && [ "$bytes" -gt 100000 ]; then
                echo "Production is serving the self-contained athlete widget (${bytes} bytes)."
                deployed=1
                break
              fi
              echo "Waiting for Cloudflare Pages deployment (${attempt}/30)."
              sleep 10
            done
            [ "$deployed" -eq 1 ]
          ) > athlete-production-status.txt 2>&1
          status=$?
          cat athlete-production-status.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit generated output and verification status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athlete.html athlete-production-status.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Record athlete deployment verification"
            git push
          fi
      - name: Report a failed verification
        if: steps.verification.outputs.status != '0'
        run: exit 1
