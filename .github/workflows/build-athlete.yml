name: Build athlete widget

on:
  push:
    branches: [main]
    paths:
      - athlete.source.html
      - athlete.css
      - theme-upgrade.css
      - core.js
      - athlete-body.js
      - athlete-data.js
      - athlete-render.js
      - athlete-flow.js
      - tools/build-athlete.mjs
      - tools/verify-athlete.mjs
      - .github/workflows/build-athlete.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-athlete-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble and verify the single-file widget
        id: build
        shell: bash
        run: |
          set +e
          {
            node tools/build-athlete.mjs
            node tools/build-athlete.mjs --check
            node tools/verify-athlete.mjs
          } > athlete-build-status.txt 2>&1
          status=$?
          cat athlete-build-status.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit generated output and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add athlete.html athlete-build-status.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build self-contained athlete widget"
            git push
          fi
      - name: Report a failed build
        if: steps.build.outputs.status != '0'
        run: exit 1
