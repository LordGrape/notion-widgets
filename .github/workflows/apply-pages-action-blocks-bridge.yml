name: Apply Pages Action Blocks bridge
on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-pages-action-blocks-bridge.mjs'
      - '.github/workflows/apply-pages-action-blocks-bridge.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-pages-action-blocks-bridge
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate
        run: |
          node tools/apply-pages-action-blocks-bridge.mjs
          node --check functions/notion/action-blocks.js
          node --check todo-action-import.js
          git diff --check
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/notion/action-blocks.js todo-sync.html todo-v2.html todo.html
          git commit -m 'Load encrypted Action Blocks in purple To-Do'
          git push origin HEAD:main
