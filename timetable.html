<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Weekly rhythm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text-primary);background:var(--surface-0);-webkit-font-smoothing:antialiased}
:root{--surface-0:#f7f6f3;--surface-1:#fff;--surface-2:#f1f0ed;--surface-3:#e9e7e2;--border-subtle:#e8e6e1;--border-default:#dedbd4;--border-accent:#a8c7f0;--text-primary:#292826;--text-secondary:#716e68;--text-tertiary:#a09c94;--accent-primary:#287dc8;--accent-secondary:#1968ad;--accent-soft:#e7f1fb;--danger:#c94a43;--success:#39845e;--shadow:0 1px 2px rgba(25,25,24,.04),0 8px 28px rgba(25,25,24,.05);--ease:cubic-bezier(.22,.8,.3,1)}
@media(prefers-color-scheme:dark){:root{--surface-0:#191919;--surface-1:#222;--surface-2:#2b2b2a;--surface-3:#343433;--border-subtle:#30302f;--border-default:#40403e;--border-accent:#476f96;--text-primary:#f4f3f1;--text-secondary:#aaa7a1;--text-tertiary:#77746f;--accent-primary:#67a9e5;--accent-secondary:#8bbcea;--accent-soft:#21384c;--danger:#e97366;--success:#72bc8f;--shadow:0 1px 2px rgba(0,0,0,.18),0 12px 36px rgba(0,0,0,.2)}}
button,input,select{font:inherit}.app{width:min(100%,480px);min-height:100vh;margin:auto;padding:18px 16px 24px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-primary)}h1{font-size:25px;line-height:1.1;letter-spacing:-.04em;margin:4px 0 0}.top-actions{display:flex;align-items:center;gap:8px}.sync{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:11px}.sync i{width:7px;height:7px;border-radius:50%;background:var(--text-tertiary)}.sync.online i{background:var(--success)}.icon-btn{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--border-default);border-radius:12px;background:var(--surface-1);color:var(--text-primary);cursor:pointer;box-shadow:var(--shadow);transition:.2s var(--ease)}.icon-btn:hover{transform:translateY(-1px);border-color:var(--border-accent)}.icon-btn:active{transform:scale(.96)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:18px 0 12px}.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:11px;background:var(--surface-2)}.seg button{height:38px;border:0;border-radius:8px;background:transparent;color:var(--text-secondary);font-weight:650;cursor:pointer}.seg button.active{background:var(--surface-1);color:var(--text-primary);box-shadow:0 1px 4px rgba(0,0,0,.08)}.today-btn{border:1px solid var(--border-default);border-radius:11px;background:var(--surface-1);padding:0 14px;color:var(--text-secondary);font-weight:650;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-width:0;height:54px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text-secondary);cursor:pointer;transition:.2s var(--ease)}.day span,.day b{display:block}.day span{font-size:10px;text-transform:uppercase}.day b{font-size:14px;margin-top:4px}.day.today{border-color:var(--border-default)}.day.active{background:var(--text-primary);color:var(--surface-1)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{padding:11px 12px;border:1px solid var(--border-subtle);border-radius:12px;background:var(--surface-1)}.metric b{display:block;font-size:15px;letter-spacing:-.02em}.metric span{display:block;margin-top:2px;color:var(--text-tertiary);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:18px 2px 9px}.section-head h2{margin:0;font-size:14px;letter-spacing:-.01em}.section-head span{font-size:11px;color:var(--text-tertiary)}.list{display:flex;flex-direction:column;gap:8px}.event{position:relative;display:grid;grid-template-columns:64px 4px 1fr;gap:12px;align-items:center;min-height:82px;padding:12px;border:1px solid var(--border-subtle);border-radius:14px;background:var(--surface-1);box-shadow:0 1px 2px rgba(0,0,0,.025);cursor:pointer;transition:.22s var(--ease);animation:enter .35s var(--ease) both}.event:hover{border-color:var(--border-default);transform:translateY(-1px);box-shadow:var(--shadow)}.event.live{border-color:color-mix(in srgb,var(--c) 55%,var(--border-default))}.event.past{opacity:.56}.time{font-size:11px;line-height:1.55;color:var(--text-secondary);font-variant-numeric:tabular-nums}.time strong{display:block;color:var(--text-primary)}.stripe{align-self:stretch;border-radius:8px;background:var(--c)}.event-main{min-width:0}.event-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:4px;color:var(--text-secondary);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 11%,transparent);color:color-mix(in srgb,var(--c) 78%,var(--text-primary));font-size:10px;font-weight:700}.status{font-size:10px;color:var(--text-tertiary)}.progress{height:3px;margin-top:8px;border-radius:3px;background:var(--surface-2);overflow:hidden}.progress i{display:block;height:100%;background:var(--c)}
.week-list{display:flex;flex-direction:column;gap:8px}.week-day{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:start}.week-label{padding-top:10px;text-align:right;color:var(--text-tertiary);font-size:10px;font-weight:750;letter-spacing:.08em}.week-day.today .week-label{color:var(--accent-primary)}.week-track{min-height:44px;padding:6px;border:1px solid var(--border-subtle);border-radius:12px;background:var(--surface-1);display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.week-track::-webkit-scrollbar{display:none}.pill{flex:0 0 auto;max-width:160px;padding:8px 10px;border:0;border-left:4px solid var(--c);border-radius:8px;background:color-mix(in srgb,var(--c) 9%,var(--surface-2));color:var(--text-primary);text-align:left;cursor:pointer}.pill b,.pill span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill b{font-size:11px}.pill span{font-size:9px;color:var(--text-secondary);margin-top:2px}.free{padding:8px;color:var(--text-tertiary);font-size:10px}
.notice,.empty{padding:18px;border:1px dashed var(--border-default);border-radius:14px;background:var(--surface-1);text-align:center;color:var(--text-secondary);font-size:12px;line-height:1.55}.notice{margin-bottom:8px;text-align:left;border-style:solid;border-color:color-mix(in srgb,var(--danger) 30%,var(--border-default));color:var(--danger)}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(0,0,0,.28);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:.2s}.overlay.show{opacity:1;pointer-events:auto}.sheet{width:min(100%,480px);max-height:92vh;overflow:auto;border:1px solid var(--border-default);border-radius:18px;background:var(--surface-1);box-shadow:0 24px 80px rgba(0,0,0,.22);transform:translateY(20px);transition:.28s var(--ease)}.overlay.show .sheet{transform:none}.sheet-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border-subtle);background:color-mix(in srgb,var(--surface-1) 92%,transparent);backdrop-filter:blur(14px)}.sheet-head h2{margin:0;font-size:17px}.form{display:grid;gap:13px;padding:16px}.field label{display:block;margin-bottom:6px;color:var(--text-secondary);font-size:11px;font-weight:700}.input{width:100%;height:44px;padding:0 12px;border:1px solid var(--border-default);border-radius:10px;outline:0;background:var(--surface-0);color:var(--text-primary)}.input:focus{border-color:var(--accent-primary);box-shadow:0 0 0 3px var(--accent-soft)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.day-chips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day-chip{height:36px;border:1px solid var(--border-default);border-radius:9px;background:var(--surface-0);color:var(--text-secondary);cursor:pointer;font-size:10px;font-weight:750}.day-chip.on{background:var(--text-primary);color:var(--surface-1)}.colours{display:flex;gap:8px;flex-wrap:wrap}.colour{width:32px;height:32px;border:3px solid var(--surface-1);border-radius:9px;background:var(--c);box-shadow:0 0 0 1px var(--border-default);cursor:pointer}.colour.on{box-shadow:0 0 0 2px var(--text-primary)}.error{min-height:16px;color:var(--danger);font-size:11px}.actions{display:flex;gap:8px}.btn{min-height:44px;padding:0 15px;border:1px solid var(--border-default);border-radius:10px;background:var(--surface-1);color:var(--text-primary);font-weight:700;cursor:pointer}.btn.primary{flex:1;border-color:var(--accent-secondary);background:var(--accent-secondary);color:white}.btn.danger{color:var(--danger)}.saved{padding:0 16px 16px}.saved-item{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border-subtle)}.saved-item i{height:36px;border-radius:4px;background:var(--c)}.saved-item b{display:block;font-size:12px}.saved-item span{display:block;margin-top:3px;color:var(--text-tertiary);font-size:10px}.saved-item button{border:0;background:transparent;color:var(--accent-primary);cursor:pointer;font-size:11px;font-weight:700}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}:focus-visible{outline:3px solid var(--border-accent);outline-offset:2px}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:380px){.app{padding:14px 12px}.sync span{display:none}.metric{padding:9px}.event{grid-template-columns:57px 4px 1fr;gap:9px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="eyebrow">Weekly rhythm</div><h1 id="title">Today</h1></div><div class="top-actions"><div class="sync" id="sync"><i></i><span>Local</span></div><button class="icon-btn" id="add" aria-label="Add schedule block">＋</button></div></header>
<div class="toolbar"><div class="seg" role="tablist"><button class="active" data-view="day">Day</button><button data-view="week">Week</button></div><button class="today-btn" id="goToday">Today</button></div>
<nav class="days" id="days" aria-label="Choose day"></nav>
<section class="summary"><div class="metric"><b id="mBlocks">0</b><span>Blocks</span></div><div class="metric"><b id="mLoad">0h</b><span>Planned</span></div><div class="metric"><b id="mOpen">24h</b><span>Open</span></div></section>
<div id="content"></div>
</div>
<div class="overlay" id="overlay" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header class="sheet-head"><h2 id="sheetTitle">Add a weekly block</h2><button class="icon-btn" id="close" aria-label="Close">×</button></header><form class="form" id="form">
<div class="field"><label for="name">Name</label><input class="input" id="name" autocomplete="off" placeholder="Constitutional law, ruck, meal prep"></div>
<div class="grid2"><div class="field"><label for="category">Category</label><select class="input" id="category"><option>Law school</option><option>Study</option><option>Fitness</option><option>Military</option><option>Personal</option><option>Recovery</option></select></div><div class="field"><label for="location">Location</label><input class="input" id="location" placeholder="Optional"></div></div>
<div class="field"><label for="description">Notes</label><input class="input" id="description" placeholder="Reading, workout intent, preparation"></div>
<div class="field"><label>Repeats every</label><div class="day-chips" id="dayChips"></div></div>
<div class="grid2"><div class="field"><label for="start">Starts</label><input class="input" type="time" id="start" value="09:00"></div><div class="field"><label for="end">Ends</label><input class="input" type="time" id="end" value="10:00"></div></div>
<div class="field"><label>Colour</label><div class="colours" id="colours"></div></div><div class="error" id="error" role="alert"></div>
<div class="actions"><button type="button" class="btn danger" id="remove" hidden>Delete</button><button type="button" class="btn" id="duplicate" hidden>Duplicate</button><button class="btn primary">Save block</button></div></form><div class="saved" id="saved"></div></section></div>
<script src="core.js"></script>
<script>
(function(){'use strict';
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],COLOURS=['#5e9fe8','#bf8eda','#72bc8f','#de9255','#df84a8','#4fb9c9','#e97366','#7d8aa5'];
var schedule=[],selected=new Date().getDay(),view='day',editing=null,selectedDays={},selectedColour=COLOURS[0],timer=null;
function $(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function min(t){var p=String(t||'0:00').split(':');return(+p[0]||0)*60+(+p[1]||0)}function fmt(t){var p=t.split(':'),h=+p[0],a=h>=12?'PM':'AM';return(h%12||12)+':'+p[1]+' '+a}function duration(a,b){var d=Math.max(0,min(b)-min(a)),h=Math.floor(d/60),m=d%60;return(h?h+'h ':'')+(m?m+'m':h?'':'0m')}function id(){return'b_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function sfx(n){try{if(typeof Core!=='undefined'&&Core.audio&&Core.audio[n])Core.audio[n]()}catch(e){}}
function normalise(raw){if(!Array.isArray(raw))return[];return raw.map(function(x){var ds=Array.isArray(x.days)?x.days:[{day:+x.day||0,start:x.start||'09:00',end:x.end||'10:00'}];return{id:x.id||id(),name:x.name||'Untitled',category:x.category||guessCategory(x.name),description:x.description||x.prof||'',location:x.location||x.room||'',colour:x.colour||x.color||COLOURS[0],days:ds.filter(function(d){return d&&d.start&&d.end}).map(function(d){return{day:+d.day,start:d.start,end:d.end}})}}).filter(function(x){return x.days.length})}function guessCategory(n){n=String(n||'').toLowerCase();if(/run|ruck|lift|workout|zone|fitness/.test(n))return'Fitness';if(/law|class|lecture|seminar/.test(n))return'Law school';if(/study|read|review/.test(n))return'Study';return'Personal'}
function load(){var raw=null;try{raw=SyncEngine.get('timetable','courses')}catch(e){}if(!raw)try{raw=JSON.parse(localStorage.getItem('timetable_courses')||'null')}catch(e){}return normalise(raw)}function save(next){schedule=next;try{localStorage.setItem('timetable_courses',JSON.stringify(next))}catch(e){}try{SyncEngine.set('timetable','courses',next)}catch(e){}setSync();render()}function flat(day){var out=[];schedule.forEach(function(b){b.days.forEach(function(d){if(d.day===day)out.push(Object.assign({},b,d))})});return out.sort(function(a,b){return min(a.start)-min(b.start)})}function now(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function setSync(){var el=$('sync'),online=false;try{online=!!SyncEngine.isOnline()}catch(e){}el.classList.toggle('online',online);el.querySelector('span').textContent=online?'Synced':'Local'}
function buildDays(){var d=new Date(),today=d.getDay(),date=d.getDate();$('days').innerHTML=SHORT.map(function(label,i){var delta=i-today,n=new Date(d);n.setDate(date+delta);return'<button class="day'+(i===today?' today':'')+(i===selected?' active':'')+'" data-day="'+i+'" aria-label="'+DAYS[i]+'"><span>'+label+'</span><b>'+n.getDate()+'</b></button>'}).join('');$('days').querySelectorAll('button').forEach(function(b){b.onclick=function(){selected=+b.dataset.day;view='day';sfx('click');render()}})}
function stats(items){var total=items.reduce(function(s,x){return s+Math.max(0,min(x.end)-min(x.start))},0),start=items.length?Math.min.apply(null,items.map(function(x){return min(x.start)})):0,end=items.length?Math.max.apply(null,items.map(function(x){return min(x.end)})):0,open=items.length?Math.max(0,(end-start)-total):0;$('mBlocks').textContent=items.length;$('mLoad').textContent=(total/60).toFixed(total%60?1:0)+'h';$('mOpen').textContent=items.length?(open/60).toFixed(open%60?1:0)+'h':'24h'}
function conflict(items){for(var i=1;i<items.length;i++)if(min(items[i].start)<min(items[i-1].end))return true;return false}function status(x,isToday){if(!isToday)return duration(x.start,x.end);var n=now(),s=min(x.start),e=min(x.end);if(n>=s&&n<e)return(e-n)+' min left';if(n>=e)return'Complete';var d=s-n;return d<60?'In '+d+' min':'In '+Math.floor(d/60)+'h '+d%60+'m'}
function renderDay(){var items=flat(selected),isToday=selected===new Date().getDay();$('title').textContent=isToday?'Today':DAYS[selected];stats(items);var html='<div class="section-head"><h2>'+(isToday?'Your flow':DAYS[selected]+' rhythm')+'</h2><span>'+items.length+' scheduled</span></div>';if(conflict(items))html+='<div class="notice">Two blocks overlap. Edit one to protect realistic capacity.</div>';if(!items.length)html+='<div class="empty">This day is open. Add a class, study block, training session, or recovery period.</div>';else{html+='<div class="list">';items.forEach(function(x,i){var n=now(),live=isToday&&n>=min(x.start)&&n<min(x.end),past=isToday&&n>=min(x.end),pct=live?Math.round((n-min(x.start))/(min(x.end)-min(x.start))*100):0;html+='<article class="event'+(live?' live':'')+(past?' past':'')+'" data-id="'+x.id+'" style="--c:'+esc(x.colour)+';animation-delay:'+(i*35)+'ms"><div class="time"><strong>'+fmt(x.start)+'</strong>'+fmt(x.end)+'</div><div class="stripe"></div><div class="event-main"><div class="event-name">'+esc(x.name)+'</div><div class="meta">'+esc([x.location,x.description].filter(Boolean).join(' · ')||'No added details')+'</div><div class="row"><span class="tag">'+esc(x.category)+'</span><span class="status">'+status(x,isToday)+'</span></div>'+(live?'<div class="progress"><i style="width:'+pct+'%"></i></div>':'')+'</div></article>'});html+='</div>'}$('content').innerHTML=html;$('content').querySelectorAll('.event').forEach(function(e){e.onclick=function(){open(e.dataset.id)}})}
function renderWeek(){var all=[];for(var i=0;i<7;i++)all=all.concat(flat(i));$('title').textContent='This week';stats(all);var html='<div class="section-head"><h2>Weekly map</h2><span>Tap a block to edit</span></div><div class="week-list">';[1,2,3,4,5,6,0].forEach(function(d){var items=flat(d);html+='<div class="week-day'+(d===new Date().getDay()?' today':'')+'"><div class="week-label">'+SHORT[d].toUpperCase()+'</div><div class="week-track">'+(items.length?items.map(function(x){return'<button class="pill" data-id="'+x.id+'" style="--c:'+esc(x.colour)+'"><b>'+esc(x.name)+'</b><span>'+fmt(x.start)+' · '+esc(x.category)+'</span></button>'}).join(''):'<span class="free">Open day</span>')+'</div></div>'});html+='</div>';$('content').innerHTML=html;$('content').querySelectorAll('.pill').forEach(function(p){p.onclick=function(){open(p.dataset.id)}})}
function render(){buildDays();document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===view)});view==='week'?renderWeek():renderDay()}
function drawForm(){$('dayChips').innerHTML=SHORT.map(function(x,i){return'<button type="button" class="day-chip'+(selectedDays[i]?' on':'')+'" data-d="'+i+'">'+x.slice(0,2)+'</button>'}).join('');$('dayChips').querySelectorAll('button').forEach(function(b){b.onclick=function(){selectedDays[+b.dataset.d]=!selectedDays[+b.dataset.d];drawForm()}});$('colours').innerHTML=COLOURS.map(function(c){return'<button type="button" class="colour'+(c===selectedColour?' on':'')+'" style="--c:'+c+'" data-c="'+c+'" aria-label="Choose colour"></button>'}).join('');$('colours').querySelectorAll('button').forEach(function(b){b.onclick=function(){selectedColour=b.dataset.c;drawForm()}})}
function drawSaved(){$('saved').innerHTML='<div class="section-head"><h2>Saved blocks</h2><span>'+schedule.length+' routines</span></div>'+schedule.map(function(x){return'<div class="saved-item" style="--c:'+esc(x.colour)+'"><i></i><div><b>'+esc(x.name)+'</b><span>'+x.days.map(function(d){return SHORT[d.day]+' '+fmt(d.start)}).join(' · ')+'</span></div><button data-id="'+x.id+'">Edit</button></div>'}).join('');$('saved').querySelectorAll('button').forEach(function(b){b.onclick=function(){open(b.dataset.id)}})}
function open(editId,asCopy){editing=asCopy?null:editId||null;var x=editId?schedule.find(function(b){return b.id===editId}):null;selectedDays={};if(x)x.days.forEach(function(d){selectedDays[d.day]=true});else selectedDays[selected]=true;selectedColour=x?x.colour:COLOURS[0];$('name').value=x?x.name:'';$('category').value=x?x.category:'Law school';$('location').value=x?x.location:'';$('description').value=x?x.description:'';$('start').value=x?x.days[0].start:'09:00';$('end').value=x?x.days[0].end:'10:00';$('sheetTitle').textContent=asCopy?'Duplicate block':editing?'Edit weekly block':'Add a weekly block';$('remove').hidden=!editing;$('duplicate').hidden=!editing;$('error').textContent='';drawForm();drawSaved();$('overlay').classList.add('show');$('overlay').setAttribute('aria-hidden','false');setTimeout(function(){$('name').focus()},200)}function close(){$('overlay').classList.remove('show');$('overlay').setAttribute('aria-hidden','true');editing=null}
$('form').onsubmit=function(e){e.preventDefault();var name=$('name').value.trim(),start=$('start').value,end=$('end').value,days=Object.keys(selectedDays).filter(function(k){return selectedDays[k]}).map(Number);if(!name)return $('error').textContent='Add a clear block name.';if(!days.length)return $('error').textContent='Choose at least one day.';if(min(end)<=min(start))return $('error').textContent='End time must be after start time.';var block={id:editing||id(),name:name,category:$('category').value,location:$('location').value.trim(),description:$('description').value.trim(),colour:selectedColour,color:selectedColour,days:days.map(function(d){return{day:d,start:start,end:end}})};save(editing?schedule.map(function(x){return x.id===editing?block:x}):schedule.concat(block));sfx('start');close()};$('remove').onclick=function(){if(editing&&confirm('Delete this weekly block?')){save(schedule.filter(function(x){return x.id!==editing}));close()}};$('duplicate').onclick=function(){var copy=editing;open(copy,true)};$('close').onclick=close;$('overlay').onclick=function(e){if(e.target===this)close()};$('add').onclick=function(){open()};$('goToday').onclick=function(){selected=new Date().getDay();view='day';render()};document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){view=b.dataset.view;render()}});document.addEventListener('keydown',function(e){if(e.key==='Escape')close();if((e.key==='n'||e.key==='N')&&!/input|select|textarea/i.test(e.target.tagName)){e.preventDefault();open()}if((e.key==='w'||e.key==='W')&&!/input|select|textarea/i.test(e.target.tagName)){view='week';render()}});
function boot(){schedule=load();setSync();render();try{if(SyncEngine.subscribe)SyncEngine.subscribe('timetable','courses',function(value){var next=normalise(value);if(JSON.stringify(next)!==JSON.stringify(schedule)){schedule=next;render()}});if(SyncEngine.onSyncStatus)SyncEngine.onSyncStatus(setSync)}catch(e){}timer=setInterval(function(){if(view==='day'&&selected===new Date().getDay())renderDay();setSync()},30000)}
var done=false;function once(){if(done)return;done=true;boot()}try{SyncEngine.init({worker:'https://widget-sync.lordgrape-widgets.workers.dev',namespaces:['timetable','todo','clock','fitness','study','user']}).then(once).catch(once);setTimeout(once,2600)}catch(e){once()}
})();
