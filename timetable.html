<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fbf9ff;--card:rgba(255,255,255,.82);--card2:rgba(255,255,255,.62);--line:rgba(109,40,217,.18);--line2:rgba(109,40,217,.28);--text:#21182f;--muted:rgba(33,24,47,.58);--soft:rgba(109,40,217,.08);--accent:#7c3aed;--accent2:#c084fc;--shadow:0 24px 70px rgba(76,29,149,.16);--glow:0 0 60px rgba(124,58,237,.18);--good:#10b981;--warn:#f59e0b;--danger:#ef4444}
@media(prefers-color-scheme:dark){:root{--bg:#08050f;--card:rgba(22,16,34,.78);--card2:rgba(31,22,48,.62);--line:rgba(196,181,253,.18);--line2:rgba(196,181,253,.32);--text:rgba(255,255,255,.9);--muted:rgba(226,216,255,.58);--soft:rgba(167,139,250,.1);--accent:#a78bfa;--accent2:#e9d5ff;--shadow:0 26px 80px rgba(0,0,0,.46);--glow:0 0 80px rgba(167,139,250,.2)}}
body{min-height:100vh;height:100vh;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 18% 0%,rgba(168,85,247,.24),transparent 32%),radial-gradient(circle at 90% 18%,rgba(124,58,237,.18),transparent 34%),linear-gradient(135deg,var(--bg),color-mix(in srgb,var(--bg) 82%,#7c3aed 18%));font-family:Inter,sans-serif;color:var(--text)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(124,58,237,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.05) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(circle at center,black,transparent 75%)}
.container{position:relative;width:min(94vw,470px);max-height:96vh;overflow:auto;padding:18px;border-radius:30px;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line2);box-shadow:var(--shadow),var(--glow),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(28px) saturate(1.4)}
.container::-webkit-scrollbar{width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.kicker{font-size:10px;font-weight:800;letter-spacing:2.8px;text-transform:uppercase;color:var(--accent)}h1{font-size:24px;letter-spacing:-1px;line-height:1;background:linear-gradient(135deg,var(--text),var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:3px}.sub{font-size:11px;color:var(--muted);margin-top:7px}.actions{display:flex;gap:7px;align-items:center}.seg{display:flex;padding:3px;border:1px solid var(--line);background:var(--soft);border-radius:999px}.seg button,.iconBtn{border:0;background:transparent;color:var(--muted);font:800 9px Inter;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:999px}.seg button{padding:7px 10px}.seg button.active{background:linear-gradient(135deg,var(--accent),#9333ea);color:white;box-shadow:0 8px 24px rgba(124,58,237,.28)}.iconBtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--soft);font-size:15px;color:var(--accent)}
.daybar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.day{height:38px;border:1px solid var(--line);background:rgba(255,255,255,.24);color:var(--muted);border-radius:15px;font-weight:800;font-size:10px;cursor:pointer;position:relative}.day.today:after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}.day.active{background:linear-gradient(135deg,var(--accent),#6d28d9);color:white;box-shadow:0 12px 30px rgba(124,58,237,.3)}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}.stat{padding:10px;border-radius:18px;border:1px solid var(--line);background:var(--soft)}.stat b{display:block;font:800 16px JetBrains Mono;color:var(--text)}.stat span{font-size:8px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}.block{display:grid;grid-template-columns:4px 76px 1fr;gap:11px;align-items:stretch;padding:12px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,transparent),rgba(255,255,255,.16));box-shadow:0 10px 30px rgba(0,0,0,.06);cursor:pointer}.block:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--c) 65%,var(--line));box-shadow:0 18px 44px color-mix(in srgb,var(--c) 24%,transparent)}.bar{border-radius:999px;background:var(--c)}.time{display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);padding-right:10px}.time strong{font:800 12px JetBrains Mono;color:var(--text)}.time span{font:700 9px JetBrains Mono;color:var(--muted);margin-top:3px}.name{font-weight:800;font-size:13px;letter-spacing:-.2px}.meta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35}.badge{display:inline-flex;margin-top:8px;padding:4px 8px;border-radius:999px;font-size:8px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}.block.live{border-color:color-mix(in srgb,var(--c) 78%,white);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 28%,transparent),0 20px 55px color-mix(in srgb,var(--c) 24%,transparent)}.block.past{opacity:.48}.progress{height:4px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--accent2));border-radius:999px}.empty{min-height:190px;display:grid;place-items:center;text-align:center;border:1px dashed var(--line2);background:var(--soft);border-radius:24px;padding:20px}.empty .emoji{font-size:36px}.empty h2{font-size:15px;margin:8px 0 4px}.empty p{font-size:11px;color:var(--muted);line-height:1.45}.cta{margin-top:13px;border:0;border-radius:999px;padding:10px 16px;background:linear-gradient(135deg,var(--accent),#9333ea);color:#fff;font-weight:800;font-size:11px;cursor:pointer}
.week{display:flex;flex-direction:column;gap:9px}.weekRow{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center}.weekDay{font-size:10px;font-weight:900;letter-spacing:1.5px;color:var(--muted);text-align:right}.weekDay.today{color:var(--accent)}.track{position:relative;height:42px;border:1px solid var(--line);border-radius:17px;background:var(--soft);overflow:hidden}.pill{position:absolute;top:6px;bottom:6px;min-width:22px;border-radius:12px;background:var(--c);box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent);display:flex;align-items:center;justify-content:center;color:white;font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 7px;cursor:pointer}.now{position:absolute;top:0;bottom:0;width:3px;background:var(--accent2);box-shadow:0 0 14px var(--accent2)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;padding:16px;z-index:5;backdrop-filter:blur(10px)}.overlay.show{display:flex}.panel{width:min(94vw,430px);max-height:88vh;overflow:auto;border:1px solid var(--line2);border-radius:28px;background:linear-gradient(145deg,var(--card),var(--card2));box-shadow:var(--shadow);padding:18px}.panelHead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.panel h2{font-size:18px}.hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}.close{border:0;background:var(--soft);color:var(--accent);width:32px;height:32px;border-radius:50%;cursor:pointer}.saved{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.savedItem{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:17px;background:var(--soft)}.savedItem .mini{font-size:9px;color:var(--muted);margin-top:3px}.savedItem button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px}.form{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.08)}label{font-size:9px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}input{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--bg) 78%,transparent);color:var(--text);padding:10px;font:600 12px Inter;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.12)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:999px;padding:8px 10px;font-size:10px;font-weight:900;cursor:pointer}.chip.on{background:linear-gradient(135deg,var(--accent),#9333ea);color:#fff}.dayTimes{display:flex;flex-direction:column;gap:7px}.timeRow{display:grid;grid-template-columns:42px 1fr 1fr;gap:7px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--soft)}.timeRow span{font-size:10px;font-weight:900;color:var(--accent)}.swatches{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.sw{width:25px;height:25px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--text);box-shadow:0 0 0 3px rgba(124,58,237,.16)}.formActions{display:flex;gap:8px}.btn{flex:1;border:1px solid var(--line);border-radius:15px;padding:11px 8px;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:var(--soft);color:var(--muted)}.primary{background:linear-gradient(135deg,var(--accent),#9333ea);color:white;border:0}.danger{color:var(--danger);border-color:rgba(239,68,68,.28)}@media(max-width:390px){.container{padding:14px;border-radius:24px}.top{align-items:flex-start}.seg button{padding:7px 8px}.block{grid-template-columns:4px 68px 1fr;padding:10px}.summary{gap:6px}.stat{padding:8px}}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div><div class="kicker">Schedule</div><h1 id="title">Today</h1><div class="sub" id="subtitle">Consistent weekly blocks, synced across your widgets.</div></div>
    <div class="actions"><div class="seg"><button id="todayBtn" class="active">Today</button><button id="weekBtn">Week</button></div><button class="iconBtn" id="settingsBtn" title="Edit schedule">+</button></div>
  </div>
  <div class="daybar" id="daybar"></div>
  <div class="summary"><div class="stat"><b id="statBlocks">0</b><span>Blocks</span></div><div class="stat"><b id="statHours">0h</b><span>Total</span></div><div class="stat"><b id="statNext">Free</b><span>Next</span></div></div>
  <main id="main"></main>
</div>
<div class="overlay" id="overlay"><div class="panel"><div class="panelHead"><div><h2>Weekly consistencies</h2><div class="hint">Add things that repeat every week, like Thursday drill, class, gym, work, or study blocks. This widget stores them and shows the right day automatically.</div></div><button class="close" id="closeBtn">×</button></div><div class="saved" id="saved"></div><div class="form"><label>Block name<input id="name" placeholder="Thursday Parade Night"></label><div class="grid2"><label>Details<input id="desc" placeholder="Optional"></label><label>Location<input id="loc" placeholder="Optional"></label></div><div><label>Repeats on</label><div class="chips" id="chips"></div></div><div class="dayTimes" id="dayTimes"></div><div><label>Colour</label><div class="swatches" id="swatches"></div></div><div class="formActions"><button class="btn" id="clearBtn">Clear</button><button class="btn primary" id="saveBtn">Save block</button></div></div></div></div>
<script src="core.js"></script>
<script>
var DAY_LABELS=['S','M','T','W','T','F','S'],DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],DAY_SHORT=['SUN','MON','TUE','WED','THU','FRI','SAT'];
var COLORS=['#8b5cf6','#a855f7','#c084fc','#6366f1','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#84cc16'];
var schedule=[],today=new Date().getDay(),selectedDay=today,view='today',editing=null,selectedDays={},selectedColor=COLORS[0];
function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function mins(t){var p=(t||'00:00').split(':');return (+p[0])*60+(+p[1])}
function fmt(t){var p=t.split(':'),h=+p[0],m=p[1],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m+' '+ap}
function dur(a,b){var d=mins(b)-mins(a),h=Math.floor(d/60),m=d%60;return h?(h+'h'+(m?' '+m+'m':'')):m+'m'}
function loadBlocks(){var raw=[];try{raw=SyncEngine.get('timetable','courses')||[]}catch(e){try{raw=JSON.parse(localStorage.getItem('timetable_courses')||'[]')}catch(x){raw=[]}}return (Array.isArray(raw)?raw:[]).map(function(c){if(c.days)return c;return{id:c.id||genId(),name:c.name||'Untitled',description:c.description||c.prof||'',location:c.location||c.room||'',color:c.color||COLORS[0],days:[{day:+c.day||0,start:c.start||'09:00',end:c.end||'10:00'}]}})}
function saveBlocks(arr){schedule=arr;try{SyncEngine.set('timetable','courses',arr)}catch(e){localStorage.setItem('timetable_courses',JSON.stringify(arr))}}
function flatFor(day){var out=[];schedule.forEach(function(b){(b.days||[]).forEach(function(d){if(+d.day===day)out.push({id:b.id,name:b.name,description:b.description,location:b.location,color:b.color||COLORS[0],day:+d.day,start:d.start,end:d.end})})});return out.sort(function(a,b){return mins(a.start)-mins(b.start)})}
function allFlat(){var out=[];schedule.forEach(function(b){(b.days||[]).forEach(function(d){out.push({id:b.id,name:b.name,description:b.description,location:b.location,color:b.color||COLORS[0],day:+d.day,start:d.start,end:d.end})})});return out}
function buildDays(){var el=$('daybar');el.innerHTML='';DAY_LABELS.forEach(function(l,i){var b=document.createElement('button');b.className='day'+(i===today?' today':'')+(i===selectedDay?' active':'');b.textContent=l;b.onclick=function(){selectedDay=i;view='today';render()};el.appendChild(b)})}
function updateStats(items){var total=items.reduce(function(s,c){return s+(mins(c.end)-mins(c.start))},0),now=new Date(),nm=now.getHours()*60+now.getMinutes(),next='Free';items.forEach(function(c){if(selectedDay===today&&mins(c.start)>nm&&next==='Free')next=fmt(c.start)});$('statBlocks').textContent=items.length;$('statHours').textContent=(total/60).toFixed(total%60?1:0)+'h';$('statNext').textContent=next}
function renderToday(){var items=flatFor(selectedDay),main=$('main'),now=new Date(),nm=now.getHours()*60+now.getMinutes();$('title').textContent=selectedDay===today?'Today':DAY_NAMES[selectedDay];$('subtitle').textContent=selectedDay===today?'Your day-to-day schedule, live and clean.':'Weekly recurring blocks for '+DAY_NAMES[selectedDay]+'.';updateStats(items);if(!items.length){main.innerHTML='<div class="empty"><div><div class="emoji">📅</div><h2>No recurring blocks</h2><p>Add a consistency once, like every Thursday, and it will show up every week.</p><button class="cta" id="emptyAdd">Add consistency</button></div></div>';$('emptyAdd').onclick=openPanel;return}main.innerHTML='<div class="list">'+items.map(function(c){var state='',badge='Upcoming';if(selectedDay===today){if(nm>=mins(c.start)&&nm<mins(c.end)){state=' live';badge=(mins(c.end)-nm)+'m left'}else if(nm>=mins(c.end)){state=' past';badge='Done'}}var prog=selectedDay===today&&state===' live'?'<div class="progress"><i style="width:'+Math.max(0,Math.min(100,(nm-mins(c.start))/(mins(c.end)-mins(c.start))*100))+'%"></i></div>':'';return '<article class="block'+state+'" style="--c:'+esc(c.color)+'"><div class="bar"></div><div class="time"><strong>'+fmt(c.start)+'</strong><span>'+fmt(c.end)+'</span></div><div><div class="name">'+esc(c.name)+'</div><div class="meta">'+[esc(c.description),esc(c.location)].filter(Boolean).join(' · ')+'</div>'+prog+'<span class="badge">'+badge+' · '+dur(c.start,c.end)+'</span></div></article>'}).join('')+'</div>'}
function renderWeek(){var f=allFlat(),main=$('main');$('title').textContent='Weekly Overview';$('subtitle').textContent='Your recurring consistencies mapped week to week.';updateStats(f);if(!f.length){main.innerHTML='<div class="empty"><div><div class="emoji">🗓️</div><h2>No week set yet</h2><p>Add weekly consistencies and this becomes your clean Notion calendar-style overview.</p><button class="cta" id="emptyAdd">Add consistency</button></div></div>';$('emptyAdd').onclick=openPanel;return}var starts=f.map(function(x){return mins(x.start)}),ends=f.map(function(x){return mins(x.end)}),gs=Math.max(0,Math.min.apply(null,starts)-30),ge=Math.min(1440,Math.max.apply(null,ends)+30),span=Math.max(60,ge-gs),now=new Date(),nm=now.getHours()*60+now.getMinutes();main.innerHTML='<div class="week">'+[1,2,3,4,5,6,0].map(function(d){var items=flatFor(d);return '<div class="weekRow"><div class="weekDay '+(d===today?'today':'')+'">'+DAY_SHORT[d]+'</div><div class="track">'+(d===today&&nm>=gs&&nm<=ge?'<div class="now" style="left:'+((nm-gs)/span*100)+'%"></div>':'')+(items.length?items.map(function(c){return '<div class="pill" title="'+esc(c.name)+' '+fmt(c.start)+'-'+fmt(c.end)+'" style="--c:'+esc(c.color)+';left:'+((mins(c.start)-gs)/span*100)+'%;width:'+Math.max(7,(mins(c.end)-mins(c.start))/span*100)+'%">'+esc(c.name.replace(/\s+/g,' ').slice(0,18))+'</div>'}).join(''):'<div style="display:grid;place-items:center;height:100%;font-size:10px;color:var(--muted)">free</div>')+'</div></div>'}).join('')+'</div>'}
function render(){buildDays();$('todayBtn').classList.toggle('active',view==='today');$('weekBtn').classList.toggle('active',view==='week');view==='week'?renderWeek():renderToday()}
function openPanel(){editing=null;selectedDays={};selectedColor=COLORS[0];$('overlay').classList.add('show');drawPanel()}
function editBlock(id){var b=schedule.find(function(x){return x.id===id});if(!b)return;editing=id;selectedColor=b.color||COLORS[0];selectedDays={};(b.days||[]).forEach(function(d){selectedDays[d.day]={start:d.start,end:d.end}});$('overlay').classList.add('show');drawPanel();$('name').value=b.name||'';$('desc').value=b.description||'';$('loc').value=b.location||''}
function closePanel(){$('overlay').classList.remove('show')}
function drawPanel(){drawSaved();drawChips();drawTimes();drawSwatches();$('name').value='';$('desc').value='';$('loc').value=''}
function drawSaved(){var el=$('saved');el.innerHTML=schedule.length?schedule.map(function(b){var ds=(b.days||[]).map(function(d){return DAY_SHORT[d.day]+' '+fmt(d.start)+'-'+fmt(d.end)}).join(' · ');return '<div class="savedItem"><div class="bar" style="background:'+esc(b.color||COLORS[0])+';height:100%"></div><div><b>'+esc(b.name)+'</b><div class="mini">'+esc(ds)+'</div></div><div><button onclick="editBlock(\''+b.id+'\')">Edit</button><button onclick="removeBlock(\''+b.id+'\')">Delete</button></div></div>'}).join(''):'<div class="empty" style="min-height:90px"><div><h2>No saved blocks</h2><p>Add your first weekly consistency below.</p></div></div>'}
function drawChips(){var el=$('chips');el.innerHTML=DAY_SHORT.map(function(d,i){return '<button class="chip '+(selectedDays[i]?'on':'')+'" data-day="'+i+'">'+d+'</button>'}).join('');el.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){var d=+b.dataset.day;if(selectedDays[d])delete selectedDays[d];else{var first=Object.keys(selectedDays)[0];selectedDays[d]=first?{start:selectedDays[first].start,end:selectedDays[first].end}:{start:'09:00',end:'10:00'}}drawChips();drawTimes()}})}
function drawTimes(){var el=$('dayTimes'),keys=Object.keys(selectedDays).map(Number).sort(function(a,b){return(a||7)-(b||7)});el.innerHTML=keys.map(function(d){return '<div class="timeRow"><span>'+DAY_SHORT[d]+'</span><input type="time" data-day="'+d+'" data-f="start" value="'+selectedDays[d].start+'"><input type="time" data-day="'+d+'" data-f="end" value="'+selectedDays[d].end+'"></div>'}).join('');el.querySelectorAll('input').forEach(function(i){i.onchange=function(){selectedDays[+i.dataset.day][i.dataset.f]=i.value}})}
function drawSwatches(){var el=$('swatches');el.innerHTML=COLORS.map(function(c){return '<button class="sw '+(c===selectedColor?'on':'')+'" style="background:'+c+'" data-c="'+c+'"></button>'}).join('');el.querySelectorAll('.sw').forEach(function(s){s.onclick=function(){selectedColor=s.dataset.c;drawSwatches()}})}
function removeBlock(id){if(!confirm('Delete this schedule block?'))return;saveBlocks(schedule.filter(function(b){return b.id!==id}));drawSaved();render()}
function saveFromForm(){var name=$('name').value.trim(),desc=$('desc').value.trim(),loc=$('loc').value.trim(),keys=Object.keys(selectedDays);if(!name||!keys.length)return alert('Add a name and at least one repeat day.');var days=keys.map(function(k){return{day:+k,start:selectedDays[k].start,end:selectedDays[k].end}});for(var i=0;i<days.length;i++){if(mins(days[i].end)<=mins(days[i].start))return alert('End time must be after start time.')}var block={id:editing||genId(),name:name,description:desc,location:loc,color:selectedColor,days:days};if(editing)saveBlocks(schedule.map(function(b){return b.id===editing?block:b}));else saveBlocks(schedule.concat(block));editing=null;drawPanel();render()}
$('todayBtn').onclick=function(){view='today';render()};$('weekBtn').onclick=function(){view='week';render()};$('settingsBtn').onclick=openPanel;$('closeBtn').onclick=closePanel;$('overlay').onclick=function(e){if(e.target===$('overlay'))closePanel()};$('clearBtn').onclick=function(){editing=null;selectedDays={};selectedColor=COLORS[0];drawPanel()};$('saveBtn').onclick=saveFromForm;document.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel()});
function boot(){schedule=loadBlocks();saveBlocks(schedule);render();try{initBackground('bg',{orbCount:0});Core.tooltip&&Core.tooltip.init&&Core.tooltip.init()}catch(e){}}
if(window.SyncEngine&&SyncEngine.init){SyncEngine.init({worker:'https://widget-sync.lordgrape-widgets.workers.dev',namespaces:['timetable']}).then(boot).catch(boot)}else boot();
</script>
