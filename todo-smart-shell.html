<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-Do</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}iframe{display:block;width:100%;height:100%;border:0;background:transparent}#error{padding:16px;color:var(--text-primary,#9379c7);font:14px/1.5 system-ui}#error[hidden]{display:none}</style></head>
<body><iframe id="shell" title="To-Do widget"></iframe><p id="error" role="alert" hidden>To-Do could not load. Your saved tasks have not been changed. Refresh to retry.</p>
<script>
(async function(){
  'use strict';
  const frame=document.getElementById('shell'),revision='20260909-schedule-v4';
  async function text(path){const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw new Error('Widget asset unavailable');return response.text();}
  function once(source,oldText,newText){if(source.split(oldText).length!==2)throw new Error('Widget compatibility check failed');return source.replace(oldText,newText);}
  try{
    // Preserve the existing v2 upgrades without nesting three asynchronous iframes.
    const [wrapper,original]=await Promise.all([text('todo-v2.html'),text('todo.html')]);
    const match=wrapper.match(/var payload=`([\s\S]*?)`/);
    if(!match)throw new Error('Upgrade payload unavailable');
    const bytes=Uint8Array.from(atob(match[1].replace(/\s/g,'')),c=>c.charCodeAt(0));
    const decoded=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const patches=JSON.parse(decoded);
    let source=original;
    for(const pair of patches)source=once(source,pair[0],pair[1]);
    source=once(source,'function poll() {',"window.addEventListener('schedule-paste:refresh', poll);\n  function poll() {");
    const base=new URL('./',location.href).href;
    source=once(source,'<head>','<head><base href="'+base+'">');
    const files=['todo-seamless-sync.js','todo-completion-sync.js','todo-multi-add.js','todo-auto.js','todo-single-time-smart.js','todo-smart.js','todo-schedule-import.js','todo-custom.js','todo-polish.js'];
    const tags=files.map(file=>'<script src="'+file+'?v='+revision+'"><'+'/script>').join('\n');
    source=once(source,'</body>',tags+'\n</body>');
    frame.srcdoc=source;
  }catch(error){frame.hidden=true;document.getElementById('error').hidden=false;}
})();
</script></body></html>
