<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>To-Do</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}iframe{display:block;width:100%;height:100%;border:0;background:transparent}.error{display:none;margin:16px;padding:12px;border:1px solid rgba(239,68,68,.3);border-radius:12px;color:#dc2626;font:600 13px/1.4 system-ui,sans-serif}.error.show{display:block}</style>
</head>
<body>
<iframe id="shell" title="To-Do widget"></iframe>
<div class="error" id="error">The To-Do enhancements could not load. Refresh the widget.</div>
<script>
(function(){
  "use strict";
  var shell=document.getElementById("shell"),attempts=0;
  shell.src="todo-sync.html?source=20260907-smart-shell-v1"+(location.hash||"");
  function innerWindow(){try{var first=shell.contentDocument&&shell.contentDocument.getElementById("todo"),second=first&&first.contentDocument&&first.contentDocument.getElementById("app");return second&&second.contentWindow&&second.contentWindow.document?second.contentWindow:null}catch(error){return null}}
  function add(win,src){return new Promise(function(resolve,reject){if(win.document.querySelector('script[data-shell-src="'+src+'"]')){resolve();return}var script=win.document.createElement("script");script.src=src;script.dataset.shellSrc=src;script.onload=resolve;script.onerror=reject;win.document.head.appendChild(script)})}
  function install(){var win=innerWindow();if(!win){if(++attempts<80)setTimeout(install,150);else document.getElementById("error").classList.add("show");return}add(win,"todo-smart.js?v=20260907-smart-shell-v2").then(function(){return add(win,"todo-auto.js?v=20260907-automatic-v1")}).then(function(){return add(win,"todo-custom.js?v=20260907-hold-custom-v2")}).then(function(){return add(win,"todo-polish.js?v=20260907-minimal-editor-v2")}).catch(function(){document.getElementById("error").classList.add("show")})}
  shell.addEventListener("load",function(){attempts=0;setTimeout(install,250)});install();
})();
</script>
</body>
</html>
