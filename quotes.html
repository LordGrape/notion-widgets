<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Meditation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light dark;
  --surface-0:#f8f7fc;--surface-1:rgba(255,255,255,.88);--surface-2:#f3f0ff;
  --border-subtle:rgba(124,58,237,.08);--border-default:rgba(124,58,237,.18);--border-accent:rgba(124,58,237,.34);
  --text-primary:#24182f;--text-secondary:#6b6680;--text-tertiary:#8d879c;
  --accent-primary:#7c3aed;--accent-secondary:#8b5cf6;
  --shadow:0 10px 34px rgba(37,28,55,.09),0 0 38px rgba(124,58,237,.08)
}
@media(prefers-color-scheme:dark){:root{
  --surface-0:#191919;--surface-1:rgba(32,32,38,.92);--surface-2:#292732;
  --border-subtle:rgba(255,255,255,.08);--border-default:rgba(167,139,250,.2);--border-accent:rgba(167,139,250,.38);
  --text-primary:#fff;--text-secondary:rgba(255,255,255,.68);--text-tertiary:rgba(255,255,255,.46);
  --accent-primary:#c4b5fd;--accent-secondary:#a78bfa;
  --shadow:0 14px 44px rgba(0,0,0,.34),0 0 42px rgba(167,139,250,.1)
}}
html,body{width:100%;height:100%;overflow:hidden}
body{
  display:grid;place-items:center;padding:8px;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(75% 90% at 88% 0%,rgba(139,92,246,.14),transparent 62%),
    radial-gradient(70% 90% at 8% 100%,rgba(196,181,253,.12),transparent 60%),
    var(--surface-0);
  color:var(--text-primary)
}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.container{
  position:relative;z-index:1;width:min(98%,1000px);min-height:112px;
  display:grid;place-items:center;text-align:center;
  padding:16px 40px 14px;border:1px solid var(--border-default);border-radius:18px;
  background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 42%),var(--surface-1);
  box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(1.25);
  -webkit-backdrop-filter:blur(24px) saturate(1.25);overflow:hidden
}
.container::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.18),transparent 34%,rgba(139,92,246,.06));opacity:.7}
.content{position:relative;z-index:1;width:100%;transition:opacity .32s ease,transform .32s ease}
.content.changing{opacity:0;transform:translateY(4px)}
.label{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:7px}
.quote{max-width:900px;margin:auto;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(18px,2.35vw,28px);font-style:italic;font-weight:600;line-height:1.25;text-wrap:balance}
.quote.compact{font-size:clamp(16px,1.9vw,22px);line-height:1.2}
.quote-text{background:linear-gradient(135deg,var(--text-primary),var(--accent-primary) 48%,var(--accent-secondary) 68%,var(--text-primary));background-size:220% 220%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.attribution{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:7px;font-size:11px;color:var(--text-secondary)}
.author{font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;font-style:italic;font-weight:600;color:var(--text-primary)}
.separator{color:var(--text-tertiary)}
.source{color:var(--text-tertiary);text-decoration:none;letter-spacing:.06em;text-transform:uppercase;border-radius:4px}
.source:hover{color:var(--accent-primary);text-decoration:underline;text-underline-offset:3px}
.source:focus-visible{outline:2px solid var(--accent-primary);outline-offset:3px}
@media(max-width:600px){body{padding:6px}.container{width:100%;padding:12px 16px 11px;min-height:120px}.quote{font-size:clamp(17px,5.2vw,23px)}.quote.compact{font-size:15.5px;line-height:1.17}.attribution{gap:5px}.source{font-size:9px}}
@media(prefers-reduced-motion:no-preference){.container{animation:enter .55s cubic-bezier(.22,1,.36,1)}.quote-text{animation:gradient 9s ease infinite}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes gradient{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="container">
  <section class="content" id="content" aria-live="polite" aria-atomic="true">
    <div class="label" id="label">Daily Meditation</div>
    <blockquote class="quote"><span class="quote-text" id="quote">Loading today’s meditation…</span></blockquote>
    <div class="attribution" id="attribution" hidden>
      <span class="author" id="author"></span><span class="separator" aria-hidden="true">·</span>
      <a class="source" id="source" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </section>
</main>
<script src="core.js"></script>
<script>
(function(){
  'use strict';
  var FALLBACK_QUOTES=[
    {text:'A man then must stand erect, not be kept erect by others.',author:'Marcus Aurelius',book:'Meditations 3.5, trans. George Long',source:'https://lexundria.com/m_aur_med/3.5/lg'},
    {text:'No longer talk about the kind of man that a good man ought to be, but be such.',author:'Marcus Aurelius',book:'Meditations 10.16, trans. George Long',source:'https://lexundria.com/m_aur_med/10.16/lg'},
    {text:'If it is not right, do not do it: if it is not true, do not say it.',author:'Marcus Aurelius',book:'Meditations 12.17, trans. George Long',source:'https://lexundria.com/m_aur_med/12.17/lg'}
  ];
  var quotes=FALLBACK_QUOTES.slice();
  var displayedDay='';
  var transitionTimer=0;
  var midnightTimer=0;
  var watchTimer=0;

  function localDayKey(date){
    var d=date||new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function localDaySerial(date){
    var d=date||new Date();
    return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
  }
  function quoteIndex(date){
    if(!quotes.length)return 0;
    return ((localDaySerial(date)%quotes.length)+quotes.length)%quotes.length;
  }
  function isValidQuote(q){
    return q&&typeof q.text==='string'&&q.text.trim()&&typeof q.author==='string'&&q.author.trim()&&
      typeof q.book==='string'&&q.book.trim()&&typeof q.source==='string'&&/^https:\/\//.test(q.source);
  }
  function renderQuote(animate){
    var q=quotes[quoteIndex(new Date())]||FALLBACK_QUOTES[0];
    var content=document.getElementById('content');
    function apply(){
      document.getElementById('quote').textContent=q.text;
      document.querySelector('.quote').classList.toggle('compact',q.text.length>170);
      document.getElementById('author').textContent=q.author;
      var source=document.getElementById('source');
      source.textContent=q.book;
      source.href=q.source;
      document.getElementById('attribution').hidden=false;
      displayedDay=localDayKey();
      content.classList.remove('changing');
    }
    clearTimeout(transitionTimer);
    if(animate){content.classList.add('changing');transitionTimer=setTimeout(apply,320)}else{apply()}
  }
  function checkDay(){if(localDayKey()!==displayedDay)renderQuote(true)}
  function scheduleMidnight(){
    clearTimeout(midnightTimer);
    var now=new Date();
    var next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,1,0);
    midnightTimer=setTimeout(function(){checkDay();scheduleMidnight()},Math.max(1000,next.getTime()-now.getTime()));
  }
  function loadQuotes(){
    return fetch('quotes.json?v=20260901',{cache:'no-store'})
      .then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.json()})
      .then(function(data){
        if(!Array.isArray(data)||data.length<2||!data.every(isValidQuote))throw new Error('Invalid quote catalogue');
        quotes=data;
      })
      .catch(function(error){
        console.warn('[daily-meditation] Using verified fallback quotes:',error);
      })
      .then(function(){renderQuote(false);scheduleMidnight()});
  }

  document.addEventListener('visibilitychange',function(){if(!document.hidden){checkDay();scheduleMidnight()}});
  window.addEventListener('focus',function(){checkDay();scheduleMidnight()});
  watchTimer=setInterval(checkDay,60000);
  window.addEventListener('pagehide',function(){clearInterval(watchTimer);clearTimeout(midnightTimer);clearTimeout(transitionTimer)});

  loadQuotes();
  try{if(window.Core&&Core.tooltip&&typeof Core.tooltip.init==='function')Core.tooltip.init()}catch(error){}
  try{if(typeof initBackground==='function')initBackground('bg',{orbCount:2,orbRadius:[60,100],orbSpeed:.15,hueRange:[250,40],mouseTracking:true})}catch(error){}
})();
</script>
</body>
</html>
