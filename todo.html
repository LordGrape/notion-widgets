<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
:root{
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --bg0:#f4f2fb;--bg1:#eae6f7;
  --card:rgba(255,255,255,0.72);--card-brd:rgba(124,92,246,0.18);
  --ink:#26203a;--ink-soft:#6b6482;
  --accent:#7c5cf6;--accent-2:#a78bfa;--accent-ink:#ffffff;
  --chip:rgba(124,92,246,0.10);--chip-ink:#5b4bd6;
  --good:#22c55e;--must:#ef4444;--should:#f59e0b;--could:#38bdf8;
  --shadow:0 20px 60px rgba(76,52,160,0.18);--radius:20px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg0:#0f0e17;--bg1:#171528;
    --card:rgba(28,25,45,0.66);--card-brd:rgba(167,139,250,0.22);
    --ink:#ece9f7;--ink-soft:#a49fbd;
    --accent:#a78bfa;--accent-2:#c4b5fd;--accent-ink:#1a1530;
    --chip:rgba(167,139,250,0.14);--chip-ink:#c9bcff;
    --shadow:0 24px 70px rgba(0,0,0,0.5);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,var(--bg0),var(--bg1));min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:22px 16px 40px;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:100%;max-width:560px}
.card{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);padding:clamp(18px,3vw,26px);transform-style:preserve-3d}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.title{font-size:clamp(1.15rem,3.4vw,1.5rem);font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:9px}
.title .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 14px var(--accent)}
.sync{font-size:0.72rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px;user-select:none}
.sync .led{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);transition:background .3s}
.sync.ok .led{background:var(--good);box-shadow:0 0 8px var(--good)}
.sync.off .led{background:var(--should)}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:14px;width:max-content}
.tab{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:600;font-size:0.85rem;padding:6px 15px;border-radius:9px;cursor:pointer;transition:.2s}
.tab.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(124,92,246,0.4)}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input{flex:1;font:inherit;font-size:0.95rem;color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:none;transition:.2s}
.add input:focus{border-color:var(--accent);background:transparent}
.add input::placeholder{color:var(--ink-soft)}
.add button{border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font:inherit;font-weight:800;font-size:1.2rem;width:46px;border-radius:12px;cursor:pointer;transition:.15s;box-shadow:0 6px 18px rgba(124,92,246,0.4)}
.add button:active{transform:scale(.92)}
.composer{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--card-brd);background:var(--chip);color:var(--chip-ink);font:inherit;font-size:0.74rem;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.chip:active{transform:scale(.94)}
.chip .k{opacity:.6;font-size:0.66rem;text-transform:uppercase;letter-spacing:.04em}
.chip.set{color:var(--accent-ink);border-color:transparent}
.chip.p-must.set{background:var(--must)}
.chip.p-should.set{background:var(--should)}
.chip.p-could.set{background:var(--could)}
.chip.t.set{background:var(--accent)}
.chip.d.set{background:var(--accent-2)}
.bar{height:7px;border-radius:99px;background:var(--chip);overflow:hidden;margin-bottom:8px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.count{font-size:0.75rem;color:var(--ink-soft);margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;color:var(--ink-soft);font-size:0.9rem;padding:26px 10px}
.empty .big{font-size:1.8rem;margin-bottom:6px}
.item{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border-radius:14px;background:var(--chip);border:1px solid transparent;transition:.2s;position:relative}
.item:hover{border-color:var(--card-brd)}
.box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--accent);cursor:pointer;display:grid;place-items:center;transition:.15s;margin-top:1px}
.box:hover{background:var(--chip)}
.box.on{background:var(--accent);border-color:var(--accent)}
.box svg{width:13px;height:13px;stroke:var(--accent-ink);stroke-width:3.4;fill:none;opacity:0;transition:.15s}
.box.on svg{opacity:1}
.body{flex:1;min-width:0}
.txt{font-size:0.94rem;line-height:1.35;word-break:break-word;cursor:text}
.item.done .txt{text-decoration:line-through;color:var(--ink-soft)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card);border:1px solid var(--card-brd);color:var(--ink-soft)}
.tag.must{color:#fff;background:var(--must);border-color:transparent}
.tag.should{color:#fff;background:var(--should);border-color:transparent}
.tag.could{color:#fff;background:var(--could);border-color:transparent}
.tag.today{color:var(--accent-ink);background:var(--accent);border-color:transparent}
.tag.tmrw{color:var(--chip-ink)}
.del{flex:none;border:0;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:1rem;line-height:1;opacity:0;transition:.15s;padding:4px;border-radius:8px}
.item:hover .del{opacity:.7}
.del:hover{opacity:1;color:var(--must)}
.section{margin-top:20px}
.section h3{font-size:0.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:8px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.section h3 .arw{transition:.2s;display:inline-block}
.section.closed h3 .arw{transform:rotate(-90deg)}
.section.closed .list{display:none}
.edit{width:100%;font:inherit;font-size:0.94rem;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--accent);outline:none;padding:0 0 3px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <div class="card" id="card">
    <div class="head">
      <div class="title"><span class="dot"></span><span id="greet">To-Do</span></div>
      <div class="sync" id="sync"><span class="led"></span><span id="synctxt">Syncing</span></div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="today">Today</button>
      <button class="tab" data-tab="all">All</button>
    </div>
    <div class="add">
      <input id="inp" type="text" placeholder="Add a task and press Enter" autocomplete="off">
      <button id="addbtn" title="Add">+</button>
    </div>
    <div class="composer">
      <button class="chip p-could" id="cPri"><span class="k">Priority</span><span id="cPriL">Set</span></button>
      <button class="chip t" id="cTime"><span class="k">Time</span><span id="cTimeL">Set</span></button>
      <button class="chip d" id="cDue"><span class="k">Due</span><span id="cDueL">None</span></button>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
    <div class="section closed" id="doneSec">
      <h3 id="doneToggle"><span class="arw">&#9662;</span> Done (<span id="doneN">0</span>)</h3>
      <div class="list" id="doneList"></div>
    </div>
  </div>
</div>
<script src="core.js"></script>
<script>
/* Compiled from src/todo.ts - edit the .ts and recompile (strip types) to change logic. */
(function () {
  "use strict";
  var NS = "todo", KEY = "tasks";
  var WORKER = "https://widget-sync.lordgrape-widgets.workers.dev";
  var PRI = [null, "must", "should", "could"];
  var PRIL = { must: "Must", should: "Should", could: "Could" };
  var TIME = [null, "quick", "m30", "m60", "deep"];
  var TIMEL = { quick: "Quick", m30: "~30m", m60: "~60m", deep: "Deep" };
  var DUE = [null, "today", "tomorrow"];
  var DUEL = { today: "Today", tomorrow: "Tomorrow" };
  var tasks = [];
  var tab = "today";
  var comp = { pri: 0, time: 0, due: 0 };
  var lastRaw = "";

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function todayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function tmrwKey() { var d = new Date(); d.setDate(d.getDate() + 1); return todayKey(d); }
  function isToday(t) {
    if (t.done) return false;
    if (t.due === "today") return true;
    if (t.dueKey && t.dueKey === todayKey()) return true;
    return !t.due && !t.dueKey;
  }

  function load() {
    var raw = SyncEngine.get(NS, KEY);
    if (raw == null) { seed(); return; }
    lastRaw = raw;
    try { tasks = JSON.parse(raw) || []; } catch (e) { tasks = []; }
    rollover();
  }
  function seed() {
    tasks = [{
      id: uid(),
      text: "Open Student Line of Credit for Law School (Potentially after OSAP)",
      pri: "could", time: "m30", due: null, dueKey: null, setKey: todayKey(),
      done: false, doneAt: null, created: Date.now()
    }];
    save();
  }
  function rollover() {
    var tk = todayKey(); var changed = false;
    tasks.forEach(function (t) {
      if (!t.done && t.due === "tomorrow" && t.setKey && t.setKey !== tk) { t.due = "today"; t.setKey = tk; changed = true; }
    });
    if (changed) save();
  }
  function save() {
    var raw = JSON.stringify(tasks);
    lastRaw = raw;
    SyncEngine.set(NS, KEY, raw);
    render();
  }

  function poll() {
    var raw = SyncEngine.get(NS, KEY);
    if (raw != null && raw !== lastRaw) {
      lastRaw = raw;
      try { tasks = JSON.parse(raw) || []; } catch (e) {}
      render();
    }
    setSync();
  }
  function setSync() {
    var el = document.getElementById("sync");
    var txt = document.getElementById("synctxt");
    var on = SyncEngine.isOnline && SyncEngine.isOnline();
    el.className = "sync " + (on ? "ok" : "off");
    txt.textContent = on ? "Synced" : "Offline";
  }

  function add() {
    var inp = document.getElementById("inp");
    var v = inp.value.trim();
    if (!v) return;
    var due = DUE[comp.due];
    tasks.unshift({
      id: uid(), text: v, pri: PRI[comp.pri], time: TIME[comp.time], due: due,
      dueKey: due === "tomorrow" ? tmrwKey() : (due === "today" ? todayKey() : null),
      setKey: todayKey(), done: false, doneAt: null, created: Date.now()
    });
    inp.value = "";
    comp = { pri: 0, time: 0, due: 0 };
    syncComposer();
    if (window.playClick) playClick();
    save();
  }

  function toggle(id) {
    var t = tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    if (t.done && window.playChime) playChime();
    else if (window.playClick) playClick();
    save();
    if (t.done) {
      var openCount = tasks.filter(function (x) { return isToday(x); }).length;
      if (openCount === 0 && window.launchConfetti) launchConfetti("bg");
    }
  }
  function remove(id) {
    tasks = tasks.filter(function (x) { return x.id !== id; });
    if (window.playClick) playClick();
    save();
  }
  function editStart(id, node) {
    var t = tasks.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    var i = document.createElement("input");
    i.className = "edit"; i.value = t.text;
    node.replaceWith(i); i.focus();
    function fin() { t.text = i.value.trim() || t.text; save(); }
    i.addEventListener("blur", fin);
    i.addEventListener("keydown", function (e) { if (e.key === "Enter") i.blur(); if (e.key === "Escape") { i.value = t.text; i.blur(); } });
  }

  var CHECK = '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"></polyline></svg>';
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  function tagHtml(t) {
    var h = "";
    if (t.pri) h += '<span class="tag ' + t.pri + '">' + PRIL[t.pri] + "</span>";
    if (t.time) h += '<span class="tag">' + TIMEL[t.time] + "</span>";
    if (!t.done) {
      if (t.due === "today" || t.dueKey === todayKey()) h += '<span class="tag today">Today</span>';
      else if (t.due === "tomorrow") h += '<span class="tag tmrw">Tomorrow</span>';
    }
    return h;
  }
  function priRank(t) { var o = { must: 0, should: 1, could: 2 }; return (t.pri in o) ? o[t.pri] : 3; }

  function itemNode(t) {
    var el = document.createElement("div");
    el.className = "item" + (t.done ? " done" : "");
    var meta = tagHtml(t);
    el.innerHTML =
      '<div class="box' + (t.done ? " on" : "") + '">' + CHECK + "</div>" +
      '<div class="body"><div class="txt">' + esc(t.text) + "</div>" +
      (meta ? '<div class="meta">' + meta + "</div>" : "") + "</div>" +
      '<button class="del" title="Delete">&#10005;</button>';
    el.querySelector(".box").addEventListener("click", function () { toggle(t.id); });
    el.querySelector(".del").addEventListener("click", function () { remove(t.id); });
    el.querySelector(".txt").addEventListener("click", function () { if (!t.done) editStart(t.id, this); });
    return el;
  }

  function render() {
    var listEl = document.getElementById("list");
    var doneEl = document.getElementById("doneList");
    listEl.innerHTML = ""; doneEl.innerHTML = "";
    var open = tasks.filter(function (t) { return !t.done; });
    var visible = tab === "today" ? open.filter(isToday) : open;
    visible.sort(function (a, b) { return priRank(a) - priRank(b) || a.created - b.created; });
    var done = tasks.filter(function (t) { return t.done; }).sort(function (a, b) { return b.doneAt - a.doneAt; });

    if (visible.length === 0) {
      listEl.innerHTML = '<div class="empty"><div class="big">&#10024;</div>' + (tab === "today" ? "Nothing left for today. Nice work." : "No open tasks. Add one above.") + "</div>";
    } else {
      visible.forEach(function (t) { listEl.appendChild(itemNode(t)); });
    }
    done.forEach(function (t) { doneEl.appendChild(itemNode(t)); });
    document.getElementById("doneN").textContent = done.length;
    document.getElementById("doneSec").style.display = done.length ? "" : "none";

    var doneToday = done.filter(function (t) { return t.doneAt && todayKey(new Date(t.doneAt)) === todayKey(); }).length;
    var totalToday = open.filter(isToday).length + doneToday;
    var pct = totalToday ? Math.round(doneToday / totalToday * 100) : 0;
    document.getElementById("bar").style.width = pct + "%";
    document.getElementById("count").textContent = tab === "today"
      ? (doneToday + " of " + totalToday + " done today")
      : (open.length + " open, " + done.length + " done");
  }

  function syncComposer() {
    var p = PRI[comp.pri], t = TIME[comp.time], d = DUE[comp.due];
    document.getElementById("cPri").className = "chip " + (p ? "p-" + p + " set" : "p-could");
    document.getElementById("cPriL").textContent = p ? PRIL[p] : "Set";
    document.getElementById("cTime").className = "chip t" + (t ? " set" : "");
    document.getElementById("cTimeL").textContent = t ? TIMEL[t] : "Set";
    document.getElementById("cDue").className = "chip d" + (d ? " set" : "");
    document.getElementById("cDueL").textContent = d ? DUEL[d] : "None";
  }

  function wire() {
    document.getElementById("addbtn").addEventListener("click", add);
    document.getElementById("inp").addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
    document.getElementById("cPri").addEventListener("click", function () { comp.pri = (comp.pri + 1) % PRI.length; syncComposer(); });
    document.getElementById("cTime").addEventListener("click", function () { comp.time = (comp.time + 1) % TIME.length; syncComposer(); });
    document.getElementById("cDue").addEventListener("click", function () { comp.due = (comp.due + 1) % DUE.length; syncComposer(); });
    [].forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.addEventListener("click", function () {
        tab = b.getAttribute("data-tab");
        [].forEach.call(document.querySelectorAll(".tab"), function (x) { x.classList.remove("on"); });
        b.classList.add("on"); render();
      });
    });
    document.getElementById("doneToggle").addEventListener("click", function () { document.getElementById("doneSec").classList.toggle("closed"); });
    var h = new Date().getHours();
    document.getElementById("greet").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  }

  function boot() {
    wire(); syncComposer();
    if (window.initBackground) try { initBackground("bg", {}); } catch (e) {}
    if (window.initTilt) try { initTilt("#card", { max: 4 }); } catch (e) {}
    SyncEngine.init({ worker: WORKER });
    SyncEngine.onReady(function () { load(); render(); setSync(); setInterval(poll, 12000); });
  }
  if (document.readyState !== "loading") boot();
  else document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
</html>
