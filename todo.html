<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--text-primary);
  background:
    radial-gradient(120% 90% at 100% 0%, var(--accent-glow) 0%, transparent 55%),
    linear-gradient(165deg, var(--surface-0), var(--surface-1));
  min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;
  padding:18px 14px 34px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:100%;max-width:480px}
.card{
  position:relative;
  background:var(--surface-1);
  border:1px solid var(--border-default);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md), var(--shadow-glow);
  backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);
  padding:clamp(16px,3.2vw,24px);
  transform-style:preserve-3d;
  overflow:hidden;
}

/* Header */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.head-l{min-width:0}
.title{font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:750;letter-spacing:-0.02em;display:flex;align-items:center;gap:9px;line-height:1.15}
.title .dot{width:10px;height:10px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));box-shadow:0 0 12px var(--accent-glow-strong)}
.date{margin-top:4px;font-size:0.8rem;color:var(--text-secondary);font-weight:500;padding-left:19px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--text-tertiary);background:var(--surface-2);border:1px solid var(--border-subtle);padding:5px 10px;border-radius:999px;user-select:none;white-space:nowrap;flex:none}
.sync .led{width:7px;height:7px;border-radius:50%;background:var(--text-tertiary);transition:background .3s,box-shadow .3s}
.sync.ok .led{background:var(--success);box-shadow:0 0 8px var(--success)}
.sync.off .led{background:var(--warning)}

/* Stats band */
.stats{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border-subtle);border-radius:var(--radius-md)}
.ring-wrap{position:relative;width:52px;height:52px;flex:none}
.ring{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border-default);stroke-width:5}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-pct{position:absolute;inset:0;display:grid;place-items:center;font-size:0.76rem;font-weight:700;color:var(--text-primary)}
.stats-txt{min-width:0}
.stats-num{font-size:1.05rem;font-weight:750;letter-spacing:-0.01em;color:var(--text-primary)}
.stats-label{font-size:0.78rem;color:var(--text-secondary);margin-top:2px}
.stats-sub{font-size:0.72rem;color:var(--text-tertiary);margin-top:3px;font-weight:500;display:none}
.stats-sub.show{display:block}
.stats-sub.warn{color:var(--warning)}
.stats-sub.over{color:var(--danger)}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border-subtle);padding:4px;border-radius:var(--radius-md);margin-top:16px;width:max-content}
.tab{border:0;background:transparent;color:var(--text-secondary);font:inherit;font-weight:600;font-size:0.85rem;padding:7px 16px;border-radius:calc(var(--radius-md) - 4px);cursor:pointer;transition:color var(--transition-fast),background var(--transition-fast)}
.tab:hover{color:var(--text-primary)}
.tab.on{background:var(--accent-secondary);color:#fff;box-shadow:0 4px 14px var(--accent-glow-strong)}
.tab:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}

/* Add */
.add{display:flex;gap:8px;margin-top:16px}
.add input{flex:1;min-width:0;font:inherit;font-size:0.95rem;color:var(--text-primary);background:var(--surface-0);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:12px 14px;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.add input:focus{border-color:var(--accent-primary);box-shadow:0 0 0 3px var(--accent-glow)}
.add input::placeholder{color:var(--text-tertiary)}
.add button{flex:none;border:0;background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:#fff;font:inherit;font-weight:700;font-size:1.4rem;width:46px;height:46px;border-radius:var(--radius-md);cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 18px var(--accent-glow-strong);transition:transform var(--transition-fast)}
.add button:hover{transform:translateY(-1px)}
.add button:active{transform:scale(.94)}
.add button:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}

/* Composer */
.composer{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--border-default);background:var(--surface-0);color:var(--text-secondary);font:inherit;font-size:0.75rem;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color var(--transition-fast),transform var(--transition-fast),background var(--transition-fast)}
.chip:hover{border-color:var(--border-accent)}
.chip:active{transform:scale(.95)}
.chip:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}
.chip .k{opacity:.55;font-size:0.66rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.chip.set{color:#fff;border-color:transparent}
.chip.p-must.set{background:var(--danger)}
.chip.p-should.set{background:var(--warning)}
.chip.p-could.set{background:var(--accent-secondary)}
.chip.t.set{background:var(--accent-secondary)}
.chip.d.set{background:var(--accent-primary)}

/* List */
.list{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.empty{text-align:center;color:var(--text-secondary);font-size:0.92rem;font-weight:600;padding:30px 12px}
.empty svg{width:38px;height:38px;margin:0 auto 12px;display:block;color:var(--accent-primary);opacity:.9}
.empty .sub{font-size:0.78rem;color:var(--text-tertiary);margin-top:4px;font-weight:500}
.item{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border-subtle);transition:border-color var(--transition-fast),background var(--transition-fast),box-shadow var(--transition-fast);position:relative}
.item:hover{border-color:var(--border-default)}
.item.is-must{border-color:color-mix(in srgb, var(--danger) 32%, var(--border-subtle))}
.item.dragging{opacity:.5;box-shadow:var(--shadow-md)}
.item.editing{border-color:var(--border-accent);background:var(--surface-1)}
.box{flex:none;width:24px;height:24px;padding:0;border-radius:7px;border:2px solid var(--accent-primary);background:transparent;cursor:pointer;display:grid;place-items:center;transition:background var(--transition-fast),border-color var(--transition-fast);margin-top:1px}
.box:hover{background:var(--accent-glow)}
.box.on{background:var(--accent-secondary);border-color:var(--accent-secondary)}
.box svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity var(--transition-fast)}
.box.on svg{opacity:1}
.box:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}
.body{flex:1;min-width:0}
.txt{font-size:0.94rem;line-height:1.4;word-break:break-word;cursor:text;color:var(--text-primary)}
.txt:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px;border-radius:4px}
.item.done .txt{text-decoration:line-through;color:var(--text-tertiary)}
.plan-line{margin-top:5px;font-size:0.78rem;font-style:italic;color:var(--text-tertiary);display:flex;gap:6px;align-items:baseline;line-height:1.4}
.plan-line .pl-k{font-style:normal;font-size:0.6rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-primary);opacity:.8;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-0);border:1px solid var(--border-subtle);color:var(--text-secondary)}
.tag.must{color:#fff;background:var(--danger);border-color:transparent}
.tag.should{color:#fff;background:var(--warning);border-color:transparent}
.tag.could{color:#fff;background:var(--accent-secondary);border-color:transparent}
.tag.today{color:#fff;background:var(--accent-primary);border-color:transparent}
.tag.tmrw{color:var(--text-secondary)}
.tag.overdue{color:#fff;background:var(--danger);border-color:transparent}
.tag.note{display:inline-flex;align-items:center;gap:4px;color:var(--text-secondary);cursor:pointer}
.tag.note:hover{color:var(--accent-primary);border-color:var(--border-accent)}
.tag.note:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}
.tag.note svg{width:11px;height:11px}

/* Item action buttons */
.acts{flex:none;display:flex;align-items:flex-start;gap:2px;margin-top:-2px}
.acts button,.acts .grip{border:0;background:transparent;color:var(--text-tertiary);cursor:pointer;padding:6px;border-radius:8px;line-height:0;opacity:0;display:inline-flex;transition:opacity var(--transition-fast),color var(--transition-fast),background var(--transition-fast)}
.grip{cursor:grab}
.item.dragging .grip,.grip:active{cursor:grabbing}
.grip svg,.manage svg{width:15px;height:15px;display:block}
.del{font-size:1rem;line-height:1;padding:5px 6px}
.item:hover .acts button,.item:hover .acts .grip,.acts button:focus-visible{opacity:.72}
.grip:hover,.manage:hover{opacity:1;color:var(--accent-primary)}
.manage[aria-expanded="true"]{opacity:1;color:var(--accent-primary)}
.del:hover{opacity:1;color:var(--danger)}
@media (hover:none){.acts button,.acts .grip{opacity:.6}}

/* Manage / edit panel */
.editor{margin-top:11px;padding-top:11px;border-top:1px dashed var(--border-default);display:flex;flex-direction:column;gap:9px}
.e-title{width:100%;font:inherit;font-size:0.9rem;color:var(--text-primary);background:var(--surface-0);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px 10px;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.e-title:focus{border-color:var(--accent-primary);box-shadow:0 0 0 3px var(--accent-glow)}
.e-plan{border-style:dashed;border-color:var(--border-accent)}
.erow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.elab{font-size:0.64rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--text-tertiary);width:52px;flex:none}
.eopts{display:flex;flex-wrap:wrap;gap:4px}
.eopt{border:1px solid var(--border-default);background:var(--surface-0);color:var(--text-secondary);font:inherit;font-size:0.72rem;font-weight:600;padding:4px 10px;border-radius:999px;cursor:pointer;transition:border-color var(--transition-fast),background var(--transition-fast),color var(--transition-fast)}
.eopt:hover{border-color:var(--border-accent)}
.eopt.on{background:var(--accent-secondary);color:#fff;border-color:transparent}
.e-notes{width:100%;min-height:52px;resize:vertical;font:inherit;font-size:0.85rem;line-height:1.4;color:var(--text-primary);background:var(--surface-0);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px 10px;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.e-notes:focus{border-color:var(--accent-primary);box-shadow:0 0 0 3px var(--accent-glow)}
.eactions{display:flex;align-items:center;gap:6px}
.emove{border:1px solid var(--border-default);background:var(--surface-0);color:var(--text-secondary);font:inherit;font-size:0.9rem;font-weight:700;width:32px;height:30px;border-radius:var(--radius-sm);cursor:pointer;transition:border-color var(--transition-fast),color var(--transition-fast)}
.emove:hover{border-color:var(--border-accent);color:var(--accent-primary)}
.emove.tbox-toggle[aria-expanded="true"]{border-color:var(--border-accent);color:var(--accent-primary)}
.espacer{flex:1}
.edone{border:0;background:var(--accent-secondary);color:#fff;font:inherit;font-size:0.78rem;font-weight:700;padding:8px 18px;border-radius:var(--radius-sm);cursor:pointer;transition:transform var(--transition-fast)}
.edone:hover{transform:translateY(-1px)}
.eopt:focus-visible,.emove:focus-visible,.edone:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}

/* Sub-steps (evidence: task decomposition) */
.subs{display:flex;flex-direction:column;gap:4px}
.sub-row{display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--text-primary)}
.sub-box{flex:none;width:17px;height:17px;padding:0;border-radius:5px;border:1.5px solid var(--accent-primary);background:transparent;cursor:pointer;display:grid;place-items:center;transition:background var(--transition-fast)}
.sub-box svg{width:9px;height:9px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.sub-box.on{background:var(--accent-secondary);border-color:var(--accent-secondary)}
.sub-box.on svg{opacity:1}
.sub-box:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}
.sub-row.done .sub-txt{text-decoration:line-through;color:var(--text-tertiary)}
.sub-txt{flex:1;min-width:0;word-break:break-word}
.sub-del{border:0;background:transparent;color:var(--text-tertiary);cursor:pointer;font-size:0.8rem;padding:2px 5px;border-radius:5px;opacity:0;transition:opacity var(--transition-fast);line-height:1}
.sub-row:hover .sub-del,.sub-del:focus-visible{opacity:.7}
.sub-del:hover{color:var(--danger)}
.sub-add{width:100%;font:inherit;font-size:0.82rem;color:var(--text-primary);background:transparent;border:1px dashed var(--border-default);border-radius:var(--radius-sm);padding:7px 10px;outline:none;transition:border-color var(--transition-fast)}
.sub-add:focus{border-color:var(--accent-primary)}
.sub-add::placeholder{color:var(--text-tertiary)}

/* Timebox bridge */
.tbox{display:none;align-items:center;gap:6px;flex-wrap:wrap;padding-top:9px;border-top:1px dashed var(--border-default)}
.tbox.open{display:flex}
.tbox select,.tbox input{font:inherit;font-size:0.78rem;font-weight:600;color:var(--text-primary);background:var(--surface-0);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:6px 8px;outline:none;transition:border-color var(--transition-fast)}
.tbox select:focus,.tbox input:focus{border-color:var(--accent-primary)}
.tbox-go{border:0;background:var(--accent-secondary);color:#fff;font:inherit;font-size:0.72rem;font-weight:700;padding:7px 13px;border-radius:var(--radius-sm);cursor:pointer;transition:transform var(--transition-fast)}
.tbox-go:hover{transform:translateY(-1px)}
.tbox-hint{width:100%;font-size:0.66rem;color:var(--text-tertiary)}

/* Tomorrow preview and completion calibration */
.tomorrow{margin-top:14px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--surface-2);overflow:hidden}.tomorrow summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;cursor:pointer;color:var(--text-secondary);font-size:.72rem;font-weight:750;letter-spacing:.06em;text-transform:uppercase}.tomorrow summary::-webkit-details-marker{display:none}.tomorrow summary:after{content:'+';font-size:1rem;color:var(--accent-primary);transition:transform var(--transition-fast)}.tomorrow[open] summary:after{transform:rotate(45deg)}.tomorrow-list{display:flex;flex-direction:column;gap:6px;padding:0 9px 9px;border-top:1px solid var(--border-subtle)}.tomorrow-row{display:grid;grid-template-columns:7px 1fr auto;gap:8px;align-items:center;padding:8px 4px;font-size:.79rem;color:var(--text-primary)}.tomorrow-row i{width:7px;height:7px;border-radius:50%;background:var(--accent-primary)}.tomorrow-row small{font-size:.68rem;color:var(--text-tertiary)}.calibration{position:fixed;z-index:10040;left:50%;bottom:72px;transform:translateX(-50%);width:min(390px,calc(100vw - 24px));padding:13px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-3);box-shadow:var(--shadow-md);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass)}.calibration b{display:block;font-size:.84rem}.calibration p{margin-top:3px;font-size:.72rem;color:var(--text-secondary)}.calibration-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.calibration-actions button{flex:1;min-width:72px;border:1px solid var(--border-default);border-radius:999px;background:var(--surface-1);color:var(--text-secondary);padding:7px 8px;font:650 .68rem var(--font);cursor:pointer}.calibration-actions button:hover{border-color:var(--border-accent);color:var(--accent-primary)}.e-outcome{border-style:dashed;border-color:var(--border-accent)}

/* Done section */
.section{margin-top:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.section h3{font-size:0.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-tertiary);cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-weight:700;background:none;border:0;padding:0;font-family:inherit}
.section h3:focus-visible{outline:2px solid var(--accent-primary);outline-offset:3px;border-radius:4px}
.section h3 .arw{transition:transform var(--transition-fast);display:inline-block}
.section.closed h3 .arw{transform:rotate(-90deg)}
.section.closed .list{display:none}
.clear{border:0;background:transparent;color:var(--text-tertiary);font:inherit;font-size:0.72rem;font-weight:600;cursor:pointer;padding:3px 6px;border-radius:6px;transition:color var(--transition-fast)}
.clear:hover{color:var(--danger)}
.clear:focus-visible{outline:2px solid var(--accent-primary);outline-offset:2px}
.edit{width:100%;font:inherit;font-size:0.94rem;color:var(--text-primary);background:transparent;border:0;border-bottom:2px solid var(--accent-primary);outline:none;padding:0 0 3px}

/* Undo toast */
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:12px;background:var(--surface-3);border:1px solid var(--border-default);color:var(--text-primary);font-size:0.82rem;font-weight:600;padding:9px 10px 9px 14px;border-radius:var(--radius-md);box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;max-width:calc(100% - 28px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--accent-primary);font:inherit;font-weight:700;cursor:pointer;font-size:0.82rem;padding:3px 6px;border-radius:6px}
.toast button:hover{background:var(--accent-glow)}

/* Note preview bubble (self-contained, smart-flip, never clipped in short embeds) */
.notepop{position:fixed;z-index:9999;max-width:min(260px,calc(100vw - 16px));background:var(--surface-3);color:var(--text-primary);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:9px 12px;font-size:0.8rem;font-weight:500;line-height:1.45;white-space:pre-wrap;word-break:break-word;text-align:left;opacity:0;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease;pointer-events:none}
.notepop.show{opacity:1;transform:translateY(0)}
.notepop::after{content:"";position:absolute;left:var(--arrowx,50%);width:9px;height:9px;background:var(--surface-3);transform:translateX(-50%) rotate(45deg)}
.notepop.above::after{bottom:-5px;border-right:1px solid var(--border-default);border-bottom:1px solid var(--border-default)}
.notepop.below::after{top:-5px;border-left:1px solid var(--border-default);border-top:1px solid var(--border-default)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

html,body{

  background:

  function tboxHtml(t){var opts="",now=new Date(),nh=(now.getHours()+1)%24,defStart=("0"+nh).slice(-2)+":00";for(var i=0;i<7;i++){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),key=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2),lbl=i===0?"Today":i===1?"Tomorrow":d.toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"});opts+='<option value="'+key+'">'+lbl+"</option>"}return'<div class="tbox"><select class="tbox-day" aria-label="Date">'+opts+'</select><input class="tbox-time" type="time" value="'+defStart+'" aria-label="Start time"><select class="tbox-repeat" aria-label="Repeat"><option value="once">This week only</option><option value="weekly">Repeat weekly</option></select><button class="tbox-go">Block '+(TIMEM[t.time]||60)+'m</button><span class="tbox-hint">One occurrence by default. Weekly repetition is always explicit.</span></div>'}

  function editorHtml(t){var pri=[{v:"",l:"None"},{v:"must",l:"Must"},{v:"should",l:"Should"},{v:"could",l:"Could"}],time=[{v:"",l:"None"},{v:"quick",l:"Quick"},{v:"m30",l:"~30m"},{v:"m60",l:"~60m"},{v:"deep",l:"Deep"}],due=[{v:"",l:"None"},{v:"today",l:"Today"},{v:"tomorrow",l:"Tomorrow"}];return'<div class="editor"><input class="e-title e-title-main" aria-label="Task title" value="'+esc(t.text)+'"><input class="e-title e-outcome" aria-label=\"Finish line\" placeholder="Finish line (optional)" value="'+esc(t.outcomeGoal||"")+'">'+eoptRow("Priority","pri",pri,t.pri)+(t.pri==="must"?'<input class="e-title e-plan" aria-label="Plan: when and where" placeholder="Plan: after ___ , at ___" value="'+esc(t.plan||"")+'">':"")+eoptRow("Time","time",time,t.time)+eoptRow("Due","due",due,t.due)+subsHtml(t)+'<textarea class="e-notes" placeholder="Notes (optional)" aria-label="Notes">'+esc(t.notes||"")+'</textarea><div class="eactions"><button class="emove" data-dir="-1" aria-label="Move up" title="Move up">↑</button><button class="emove" data-dir="1" aria-label="Move down" title="Move down">↓</button><button class="emove tbox-toggle" aria-label="Timebox into schedule" aria-expanded="false" title="Timebox into schedule">⏱</button><span class="espacer"></span><button class="edone">Done</button></div>'+tboxHtml(t)+"</div>"}

  function itemNode(t) {
    var isEditing = (t.id === editingId) && !t.done;
    var el = document.createElement("div");
    el.className = "item" + (t.done ? " done" : "") + (isEditing ? " editing" : "") + (t.pri === "must" && !t.done ? " is-must" : "");
    el.setAttribute("role", "listitem");
    el.setAttribute("data-id", t.id);
    var meta = tagHtml(t);
    var planHtml = "";
    if (t.outcomeGoal && t.outcomeGoal.trim() && !t.done) planHtml = '<div class="plan-line"><span class="pl-k">Finish</span><span>' + esc(t.outcomeGoal) + "</span></div>";
    else if (t.plan && t.plan.trim() && !t.done) planHtml = '<div class="plan-line"><span class="pl-k">Plan</span><span>' + esc(t.plan) + "</span></div>";
    var acts = "";
    if (!t.done) acts += '<span class="grip" aria-hidden="true" title="Drag to reorder">' + GRIP + "</span>";
    acts += '<button class="manage" aria-label="Edit task" aria-expanded="' + (isEditing ? "true" : "false") + '" title="Edit">' + PENCIL + "</button>";
    acts += '<button class="del" aria-label="Delete task" title="Delete">&#10005;</button>';
    el.innerHTML =
      '<button class="box' + (t.done ? " on" : "") + '" aria-pressed="' + (t.done ? "true" : "false") + '" aria-label="' + (t.done ? "Mark as not done" : "Mark complete") + '">' + CHECK + "</button>" +
      '<div class="body"><div class="txt" role="button" tabindex="0">' + esc(t.text) + "</div>" +
      planHtml +
      (meta ? '<div class="meta">' + meta + "</div>" : "") +
      (isEditing ? editorHtml(t) : "") +
      "</div>" +
      '<div class="acts">' + acts + "</div>";

    el.querySelector(".box").addEventListener("click", function () { toggle(t.id); });
    el.querySelector(".del").addEventListener("click", function () { remove(t.id); });
    el.querySelector(".manage").addEventListener("click", function () { toggleManage(t.id); });
    var txt = el.querySelector(".txt");
    txt.addEventListener("click", function () { if (!t.done) editStart(t.id, this); });
    txt.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && !t.done) { e.preventDefault(); editStart(t.id, this); } });

    var noteChip = el.querySelector(".tag.note");
    if (noteChip) {
      noteChip.setAttribute("tabindex", "0");
      noteChip.setAttribute("role", "button");
      noteChip.setAttribute("aria-label", "View or edit note");
      noteChip.addEventListener("click", function (e) { e.stopPropagation(); toggleManage(t.id); });
      noteChip.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleManage(t.id); } });
      /* Preview shows only when hovering/focusing the Note chip, anchored just above the chip. */
      noteChip.addEventListener("mouseenter", function () { scheduleNote(noteChip, t.notes || ""); });
      noteChip.addEventListener("mouseleave", hideNote);
      noteChip.addEventListener("focus", function () { showNote(noteChip, t.notes || ""); });
      noteChip.addEventListener("blur", hideNote);
    }

    if (!t.done && !isEditing) {
      el.setAttribute("draggable", "true");
      el.addEventListener("dragstart", function (e) {
        el.classList.add("dragging");
        try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.id); } catch (_) {}
      });
      el.addEventListener("dragend", function () {
        el.classList.remove("dragging");
        commitOrder();
      });
    }

    if (isEditing) {
      var titleI = el.querySelector(".e-title-main");
      titleI.addEventListener("input", function () { t.text = this.value; });
      titleI.addEventListener("blur", function () { t.text = this.value.trim() || t.text; save(); });
      titleI.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); this.blur(); } });
      var outcomeI = el.querySelector(".e-outcome");
      if (outcomeI) { outcomeI.addEventListener("input", function () { t.outcomeGoal = this.value; }); outcomeI.addEventListener("blur", function () { t.outcomeGoal = this.value.trim(); save(); }); outcomeI.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); this.blur(); } }); }
      var planI = el.querySelector(".e-plan");
      if (planI) {
        planI.addEventListener("input", function () { t.plan = this.value; });
        planI.addEventListener("blur", function () { t.plan = this.value.trim(); save(); });
        planI.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); this.blur(); } });
      }
      var notesI = el.querySelector(".e-notes");
      notesI.addEventListener("input", function () { t.notes = this.value; });
      notesI.addEventListener("blur", function () { t.notes = this.value; save(); });
      [].forEach.call(el.querySelectorAll(".eopt"), function (b) {
        b.addEventListener("click", function () { setField(t, this.parentNode.getAttribute("data-field"), this.getAttribute("data-v")); });
      });
      [].forEach.call(el.querySelectorAll(".emove[data-dir]"), function (b) {
        b.addEventListener("click", function () { moveItem(t.id, parseInt(this.getAttribute("data-dir"), 10)); });
      });
      [].forEach.call(el.querySelectorAll(".sub-box"), function (b) {
        b.addEventListener("click", function () {
          var sid = this.parentNode.getAttribute("data-sid");
          (t.subs || []).forEach(function (s) { if (s.id === sid) s.done = !s.done; });
          snd("playClick");
          save();
        });
      });
      [].forEach.call(el.querySelectorAll(".sub-del"), function (b) {
        b.addEventListener("click", function () {
          var sid = this.parentNode.getAttribute("data-sid");
          t.subs = (t.subs || []).filter(function (s) { return s.id !== sid; });
          snd("playClick");
          save();
        });
      });
      var subAdd = el.querySelector(".sub-add");
      if (subAdd) subAdd.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        var v = this.value.trim();
        if (!v) return;
        t.subs = t.subs || [];
        t.subs.push({ id: uid(), text: v, done: false });
        snd("playClick");
        save();
        setTimeout(function () { var n = document.querySelector(".item.editing .sub-add"); if (n) n.focus(); }, 0);
      });
      var tbToggle = el.querySelector(".tbox-toggle");
      if (tbToggle) tbToggle.addEventListener("click", function () {
        var row = el.querySelector(".tbox");
        if (!row) return;
        var open = row.classList.toggle("open");
        this.setAttribute("aria-expanded", open ? "true" : "false");
        snd("playClick");
      });
      var tbGo = el.querySelector(".tbox-go");
      if (tbGo) tbGo.addEventListener("click", function () {
        var daySel = el.querySelector(".tbox-day");
        var timeI = el.querySelector(".tbox-time");
        var repeatSel = el.querySelector(".tbox-repeat");
        timeboxTask(t, daySel.value, timeI.value || "14:00", repeatSel ? repeatSel.value : "once");
      });
      el.querySelector(".edone").addEventListener("click", function () { editingId = null; snd("playClose"); save(); });
    }
    return el;
  }

  /* Drag reorder helpers */
  function dragAfter(container, y) {
    var els = [].slice.call(container.querySelectorAll(".item:not(.dragging)"));
    var closest = { offset: -Infinity, el: null };
    els.forEach(function (child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) closest = { offset: offset, el: child };
    });
    return closest.el;
  }
  function onListDragOver(e) {
    e.preventDefault();
    var listEl = $("list");
    var dragging = listEl.querySelector(".item.dragging");
    if (!dragging) return;
    var after = dragAfter(listEl, e.clientY);
    if (after == null) listEl.appendChild(dragging);
    else listEl.insertBefore(dragging, after);
  }
  function commitOrder() {
    var listEl = $("list");
    var nodes = [].slice.call(listEl.querySelectorAll(".item"));
    nodes.forEach(function (n, i) { var t = byId(n.getAttribute("data-id")); if (t) t.order = i; });
    snd("playClick");
    save();
  }

  function tomorrowTasks(){return tasks.filter(function(t){return!t.done&&(t.due==="tomorrow"||keyNum(t.dueKey)===keyNum(tmrwKey()))}).sort(function(a,b){return Date.parse(a.scheduledStart||0)-Date.parse(b.scheduledStart||0)||orderOf(a)-orderOf(b)})}
  function renderTomorrow(){var section=$("tomorrowSec"),list=$("tomorrowList"),items=tomorrowTasks();if(!section||!list)return;section.style.display=tab==="today"&&items.length?"":"none";$("tomorrowN").textContent=items.length;list.innerHTML=items.map(function(t){var time=t.scheduledStart?new Date(t.scheduledStart).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):(t.time?TIMEL[t.time]:"Flexible");return'<div class="tomorrow-row"><i></i><span>'+esc(t.text)+'</span><small>'+esc(time)+'</small></div>'}).join("")}
  function showCalibration(task){var old=document.querySelector(".calibration");if(old)old.remove();clearTimeout(calibrationTimer);var panel=document.createElement("div");panel.className="calibration";panel.setAttribute("role","dialog");panel.innerHTML='<b>How did the block go?</b><p>'+esc(task.text)+'</p><div class="calibration-actions"><button data-fit="as-planned">As planned</button><button data-fit="shorter">Shorter</button><button data-fit="longer">Longer</button><button data-fit="partial">Partial</button></div>';panel.addEventListener("click",function(e){var fit=e.target&&e.target.getAttribute("data-fit");if(!fit)return;var current=byId(task.id);if(current){current.completionFit=fit;if(fit==="as-planned")current.actualMinutes=scheduledMinutes(current);current.updatedAt=Date.now();save()}panel.remove();showToast("Completion feedback saved.")});document.body.appendChild(panel);calibrationTimer=setTimeout(function(){if(panel.parentNode)panel.remove()},12000)}

  function emptyHtml(which) {
    var icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>';
    var title = which === "today" ? "Nothing left for today" : "No open tasks";
    var sub = which === "today" ? "Enjoy the win, or plan ahead." : "Add one above to get started.";
    return '<div class="empty">' + icon + "<div>" + title + '</div><div class="sub">' + sub + "</div></div>";
  }

  function setRing(pct) {
    var fg = $("ringFg");
    if (fg) fg.style.strokeDashoffset = String(RING_C * (1 - pct / 100));
    var pe = $("ringPct");
    if (pe) pe.textContent = pct + "%";
  }

  function visibleOpen() {
    var open = tasks.filter(function (t) { return !t.done; });
    var visible = tab === "today" ? open.filter(isToday) : open;
    visible.sort(function (a, b) { return priRank(a) - priRank(b) || orderOf(a) - orderOf(b); });
    return visible;
  }

  function render() {
    hideNote();
    var listEl = $("list"), doneEl = $("doneList");
    listEl.innerHTML = ""; doneEl.innerHTML = "";
    var open = tasks.filter(function (t) { return !t.done; });
    var visible = visibleOpen();
    var done = tasks.filter(function (t) { return t.done; }).sort(function (a, b) { return b.doneAt - a.doneAt; });

    if (visible.length === 0) listEl.innerHTML = emptyHtml(tab);
    else visible.forEach(function (t) { listEl.appendChild(itemNode(t)); });
    done.forEach(function (t) { doneEl.appendChild(itemNode(t)); });

    $("doneN").textContent = done.length;
    $("doneSec").style.display = done.length ? "" : "none";

    var doneToday = done.filter(function (t) { return t.doneAt && todayKey(new Date(t.doneAt)) === todayKey(); }).length;
    var totalToday = open.filter(isToday).length + doneToday;
    var pct = totalToday ? Math.round(doneToday / totalToday * 100) : 0;
    setRing(pct);
    if (tab === "today") {
      $("statsNum").textContent = doneToday + " / " + totalToday;
      $("statsLabel").textContent = totalToday ? (doneToday === totalToday ? "All done for today \uD83C\uDF89" : "done today") : "Nothing scheduled today";
    } else {
      $("statsNum").textContent = open.length + (open.length === 1 ? " open task" : " open tasks");
      $("statsLabel").textContent = done.length + " completed";
    }
    updateCapLine();
    renderTomorrow();
  }

  function syncComposer() {
    var p = PRI[comp.pri], t = TIME[comp.time], d = DUE[comp.due];
    $("cPri").className = "chip " + (p ? "p-" + p + " set" : "p-could");
    $("cPriL").textContent = p ? PRIL[p] : "Set";
    $("cTime").className = "chip t" + (t ? " set" : "");
    $("cTimeL").textContent = t ? TIMEL[t] : "Set";
    $("cDue").className = "chip d" + (d ? " set" : "");
    $("cDueL").textContent = d ? DUEL[d] : "None";
  }

  function wire() {
    $("addbtn").addEventListener("click", add);
    $("inp").addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
    $("cPri").addEventListener("click", function () { comp.pri = (comp.pri + 1) % PRI.length; syncComposer(); snd("playClick"); });
    $("cTime").addEventListener("click", function () { comp.time = (comp.time + 1) % TIME.length; syncComposer(); snd("playClick"); });
    $("cDue").addEventListener("click", function () { comp.due = (comp.due + 1) % DUE.length; syncComposer(); snd("playClick"); });
    [].forEach.call(document.querySelectorAll(".tab"), function (b) {
      b.addEventListener("click", function () {
        tab = b.getAttribute("data-tab");
        [].forEach.call(document.querySelectorAll(".tab"), function (x) { x.classList.remove("on"); x.setAttribute("aria-selected", "false"); });
        b.classList.add("on"); b.setAttribute("aria-selected", "true");
        render(); snd("playClick");
      });
    });
    var dt = $("doneToggle");
    function toggleDone() {
      var closed = $("doneSec").classList.toggle("closed");
      dt.setAttribute("aria-expanded", closed ? "false" : "true");
      snd(closed ? "playClose" : "playOpen");
    }
    dt.addEventListener("click", toggleDone);
    dt.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleDone(); } });
    $("clearBtn").addEventListener("click", clearCompleted);
    $("undoBtn").addEventListener("click", doUndo);

    var listEl = $("list");
    listEl.addEventListener("dragover", onListDragOver);
    listEl.addEventListener("drop", function (e) { e.preventDefault(); });

    var h = new Date().getHours();
    $("greet").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    try { $("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }); } catch (e) {}
  }

  function boot() {
    wire(); syncComposer();
    var fg = $("ringFg");
    if (fg) { fg.style.strokeDasharray = String(RING_C); fg.style.strokeDashoffset = String(RING_C); }
    /* Static schedule-matched backdrop replaces the continuous texture animation. */
    if (window.initTilt) try { initTilt("#card", { maxDeg: 3 }); } catch (e) {}
    try { if (window.Core && Core.magneticHover) Core.magneticHover($("addbtn"), { radius: 60, strength: 0.25 }); } catch (e) {}
    window.addEventListener("scroll", hideNote, true);
    window.addEventListener("resize", hideNote);
    SyncEngine.init({ worker: WORKER, namespaces: ["todo", "dragon", "clock", "user", "timetable"] });
    SyncEngine.onReady(function () { load(); render(); setSync(); setInterval(poll, 12000); });
  }
  if (document.readyState !== "loading") boot();
  else document.addEventListener("DOMContentLoaded", boot);
})();
</script>
