<!doctype html>
<html lang="en-CA">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,viewport-fit=cover"
		/>
		<meta name="theme-color" content="#faf9fd" />
		<meta
			name="description"
			content="Your tasks, your day, and room to focus."
		/>
		<link rel="manifest" href="./manifest.webmanifest" />
		<script type="importmap">
			{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
		</script>
		<link rel="icon" href="./icon.svg" type="image/svg+xml" />
		<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
		<script>
			try {
				document.documentElement.dataset.theme =
					localStorage.getItem("command-centre-theme-v1") ||
					(matchMedia("(prefers-color-scheme:light)").matches
						? "light"
						: "dark");
			} catch (e) {
				document.documentElement.dataset.theme = "light";
			}
		</script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
	<link rel="preload" as="image" href="./broadcast-run.webp?v=hd" fetchpriority="high" />
	<link rel="stylesheet" href="./styles.css?v=20261003-logo-hd" />
		<title>Command Centre</title>
	<link rel="stylesheet" href="../../reading-estimates.css?v=20261002-class-anchored-tasks">
</head>
	<body class="locked">
		<div class="lock-screen" id="lockScreen">
			<form class="lock-card" id="unlockForm">
				<span class="brand-mark" aria-hidden="true"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="lgat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--lg-tileA)"/><stop offset="1" style="stop-color:var(--lg-tileB)"/></linearGradient><linearGradient id="lgab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--lg-tvA)"/><stop offset="1" style="stop-color:var(--lg-tvB)"/></linearGradient><radialGradient id="lgas" cx=".5" cy=".4" r=".8"><stop offset="0" style="stop-color:var(--lg-scrA)"/><stop offset="1" style="stop-color:var(--lg-scrB)"/></radialGradient></defs><rect width="64" height="64" rx="18" fill="url(#lgat)"/><g class="lg-ant"><path d="M32 18 22 6M32 18 42 7" style="stroke:var(--lg-ant)" stroke-width="3.2" stroke-linecap="round" fill="none"/><circle class="lg-orb" cx="22" cy="5.6" r="3.2" style="fill:var(--lg-orb)"/><circle class="lg-orb lg-orb2" cx="42" cy="6.6" r="3.2" style="fill:var(--lg-orb)"/></g><rect x="6" y="17" width="52" height="41" rx="12" fill="url(#lgab)"/><rect x="6.5" y="17.5" width="51" height="40" rx="11.5" fill="none" style="stroke:var(--lg-rim)" stroke-opacity=".5"/><path d="M11.5 27c0-5 3.5-9 8.5-9h14" stroke="#fff" stroke-opacity=".38" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="12" y="23" width="35" height="29" rx="8" fill="url(#lgas)"/><g class="lg-m" fill="none" stroke-linejoin="round" stroke-linecap="round"><path class="lg-glow" d="M19 44V29.5l10.5 10 10.5-10V44" style="stroke:var(--lg-glow)" stroke-width="9" stroke-opacity=".35"/><path class="lg-cyan" d="M19 44V29.5l10.5 10 10.5-10V44" stroke="#33e1ff" stroke-width="5.6"/><path class="lg-magenta" d="M19 44V29.5l10.5 10 10.5-10V44" stroke="#ff4fd0" stroke-width="5.6"/><path class="lg-main" d="M19 44V29.5l10.5 10 10.5-10V44" style="stroke:var(--lg-m)" stroke-width="5.6"/></g><circle class="lg-knob" cx="52.5" cy="32" r="2.4" style="fill:var(--lg-knob)"/><circle class="lg-knob lg-knob2" cx="52.5" cy="41" r="2.4" style="fill:var(--lg-knob)"/></svg></span>
				<p class="eyebrow">Private workspace</p>
				<h1>Command Centre</h1>
				<p class="lock-copy">Your tasks, your day, and room to focus.</p>
				<label for="accessKey">Access key</label>
				<div class="unlock-row">
					<input
						id="accessKey"
						type="password"
						autocomplete="current-password"
						required
						placeholder="Enter your private key"
					/><button class="primary" type="submit">Unlock</button>
				</div>
				<p id="unlockStatus" role="status">Remembered only on this device.</p>
			</form>
		</div>
		<div class="app" id="appShell" aria-hidden="true">
			<header class="app-header">
				<a class="identity" href="./" aria-label="Command Centre home"
					><span class="brand-mark" aria-hidden="true"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="lgbt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--lg-tileA)"/><stop offset="1" style="stop-color:var(--lg-tileB)"/></linearGradient><linearGradient id="lgbb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--lg-tvA)"/><stop offset="1" style="stop-color:var(--lg-tvB)"/></linearGradient><radialGradient id="lgbs" cx=".5" cy=".4" r=".8"><stop offset="0" style="stop-color:var(--lg-scrA)"/><stop offset="1" style="stop-color:var(--lg-scrB)"/></radialGradient></defs><rect width="64" height="64" rx="18" fill="url(#lgbt)"/><g class="lg-ant"><path d="M32 18 22 6M32 18 42 7" style="stroke:var(--lg-ant)" stroke-width="3.2" stroke-linecap="round" fill="none"/><circle class="lg-orb" cx="22" cy="5.6" r="3.2" style="fill:var(--lg-orb)"/><circle class="lg-orb lg-orb2" cx="42" cy="6.6" r="3.2" style="fill:var(--lg-orb)"/></g><rect x="6" y="17" width="52" height="41" rx="12" fill="url(#lgbb)"/><rect x="6.5" y="17.5" width="51" height="40" rx="11.5" fill="none" style="stroke:var(--lg-rim)" stroke-opacity=".5"/><path d="M11.5 27c0-5 3.5-9 8.5-9h14" stroke="#fff" stroke-opacity=".38" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="12" y="23" width="35" height="29" rx="8" fill="url(#lgbs)"/><g class="lg-m" fill="none" stroke-linejoin="round" stroke-linecap="round"><path class="lg-glow" d="M19 44V29.5l10.5 10 10.5-10V44" style="stroke:var(--lg-glow)" stroke-width="9" stroke-opacity=".35"/><path class="lg-cyan" d="M19 44V29.5l10.5 10 10.5-10V44" stroke="#33e1ff" stroke-width="5.6"/><path class="lg-magenta" d="M19 44V29.5l10.5 10 10.5-10V44" stroke="#ff4fd0" stroke-width="5.6"/><path class="lg-main" d="M19 44V29.5l10.5 10 10.5-10V44" style="stroke:var(--lg-m)" stroke-width="5.6"/></g><circle class="lg-knob" cx="52.5" cy="32" r="2.4" style="fill:var(--lg-knob)"/><circle class="lg-knob lg-knob2" cx="52.5" cy="41" r="2.4" style="fill:var(--lg-knob)"/></svg></span>
					<h1>Command Centre</h1></a
				>
				<nav class="view-tabs" aria-label="Workspace view">
					<button data-view="today" aria-current="page">Today</button
					><button data-view="plan">Plan</button
					><button data-view="focus">Focus</button
					><button data-view="docket">Docket</button>
				</nav>
				<div class="header-actions">
					<button id="searchButton" class="search-trigger">
						<span data-icon="search"></span><span>Search tasks or actions…</span
						><kbd data-shortcut="K">Ctrl + K</kbd></button
					><span class="sync-state" id="syncState" role="status"
						><i></i><span>Connecting…</span></span
					><button
						id="themeToggle"
						class="icon-button"
						aria-label="Change theme"
						aria-keyshortcuts="Control+Alt+L"
					>
						<span data-icon="sun"></span></button
					><button
						id="settingsButton"
						class="icon-button"
						aria-label="Open workspace settings"
					>
						<span data-icon="settings"></span>
					</button>
				</div>
			</header>
			<main id="workspace" aria-label="Command Centre workspace">
				<div class="loading-state"><span class="broadcast-run" aria-hidden="true"></span><span>Loading your workspace…</span></div>
			</main>
			<footer id="focusDock" class="focus-dock" hidden></footer>
			<p id="announcement" class="sr-only" aria-live="polite"></p>
			<div class="toast" id="toast" role="status" hidden>
				<span id="toastText"></span><button id="toastAction" hidden></button><button id="undoButton" hidden>Undo</button
				><button
					class="icon-button"
					id="toastClose"
					aria-label="Dismiss notification"
				>
					×
				</button>
			</div>
		</div>
		<dialog id="editorDialog" aria-labelledby="editorTitle"></dialog>
		<dialog
			id="searchDialog"
			class="command-dialog"
			aria-label="Search tasks and actions"
		></dialog>
		<dialog id="settingsDialog" aria-labelledby="settingsTitle"></dialog>
		<div class="widget-engines" aria-hidden="true" inert>
			<iframe id="todoFrame" title="To-Do widget engine" tabindex="-1"></iframe
			><iframe
				id="timetableFrame"
				title="Timetable widget engine"
				tabindex="-1"
			></iframe
			><iframe
				id="clockFrame"
				title="Clock widget engine"
				tabindex="-1"
				allow="notifications"
			></iframe>
		</div>
		<script src="../../widget-platform.js?v=20261002-class-anchored-tasks"></script>
		<script src="./remember.js"></script>
		<script defer src="./notion-sync.js?v=20261002-class-anchored-tasks"></script>
		<script src="../../widget-icons.js?v=20261001-duotone-b"></script>
		<script type="module" src="./app.js?v=20261003-logo-hd"></script>
	</body>
</html>
