<!doctype html>
<html lang="en-CA">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,viewport-fit=cover"
		/>
		<meta name="theme-color" content="#faf9fd" />
		<meta
			name="description"
			content="Your tasks, your day, and room to focus."
		/>
		<link rel="manifest" href="./manifest.webmanifest" />
		<link rel="icon" href="./icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="./icon.svg" />
		<script>
			try {
				document.documentElement.dataset.theme =
					localStorage.getItem("command-centre-theme-v1") ||
					(matchMedia("(prefers-color-scheme:light)").matches
						? "light"
						: "dark");
			} catch (e) {
				document.documentElement.dataset.theme = "light";
			}
		</script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
	<link rel="stylesheet" href="./styles.css?v=20261002-split" />
		<title>Command Centre</title>
	<link rel="stylesheet" href="../../reading-estimates.css?v=20261002-class-anchored-tasks">
</head>
	<body class="locked">
		<div class="lock-screen" id="lockScreen">
			<form class="lock-card" id="unlockForm">
				<span class="brand-mark" data-widget-icon="logo" aria-hidden="true"></span>
				<p class="eyebrow">Private workspace</p>
				<h1>Command Centre</h1>
				<p class="lock-copy">Your tasks, your day, and room to focus.</p>
				<label for="accessKey">Access key</label>
				<div class="unlock-row">
					<input
						id="accessKey"
						type="password"
						autocomplete="current-password"
						required
						placeholder="Enter your private key"
					/><button class="primary" type="submit">Unlock</button>
				</div>
				<p id="unlockStatus" role="status">Remembered only on this device.</p>
			</form>
		</div>
		<div class="app" id="appShell" aria-hidden="true">
			<header class="app-header">
				<a class="identity" href="./" aria-label="Command Centre home"
					><span class="brand-mark" data-widget-icon="logo" aria-hidden="true"></span>
					<h1>Command Centre</h1></a
				>
				<nav class="view-tabs" aria-label="Workspace view">
					<button data-view="today" aria-current="page">Today</button
					><button data-view="plan">Plan</button
					><button data-view="focus">Focus</button
					><button data-view="docket">Docket</button>
				</nav>
				<div class="header-actions">
					<button id="searchButton" class="search-trigger">
						<span data-icon="search"></span><span>Search tasks or actions…</span
						><kbd data-shortcut="K">Ctrl + K</kbd></button
					><span class="sync-state" id="syncState" role="status"
						><i></i><span>Connecting…</span></span
					><button
						id="themeToggle"
						class="icon-button"
						aria-label="Change theme"
						aria-keyshortcuts="Control+Alt+L"
					>
						<span data-icon="sun"></span></button
					><button
						id="settingsButton"
						class="icon-button"
						aria-label="Open workspace settings"
					>
						<span data-icon="settings"></span>
					</button>
				</div>
			</header>
			<main id="workspace" aria-label="Command Centre workspace">
				<div class="loading-state">Loading your workspace…</div>
			</main>
			<footer id="focusDock" class="focus-dock" hidden></footer>
			<p id="announcement" class="sr-only" aria-live="polite"></p>
			<div class="toast" id="toast" role="status" hidden>
				<span id="toastText"></span><button id="toastAction" hidden></button><button id="undoButton" hidden>Undo</button
				><button
					class="icon-button"
					id="toastClose"
					aria-label="Dismiss notification"
				>
					×
				</button>
			</div>
		</div>
		<dialog id="editorDialog" aria-labelledby="editorTitle"></dialog>
		<dialog
			id="searchDialog"
			class="command-dialog"
			aria-label="Search tasks and actions"
		></dialog>
		<dialog id="settingsDialog" aria-labelledby="settingsTitle"></dialog>
		<div class="widget-engines" aria-hidden="true" inert>
			<iframe id="todoFrame" title="To-Do widget engine" tabindex="-1"></iframe
			><iframe
				id="timetableFrame"
				title="Timetable widget engine"
				tabindex="-1"
			></iframe
			><iframe
				id="clockFrame"
				title="Clock widget engine"
				tabindex="-1"
				allow="notifications"
			></iframe>
		</div>
		<script src="../../widget-platform.js?v=20261002-class-anchored-tasks"></script>
		<script src="./remember.js"></script>
		<script defer src="./notion-sync.js?v=20261002-class-anchored-tasks"></script>
		<script src="../../widget-icons.js?v=20261001-duotone-b"></script>
		<script type="module" src="./app.js?v=20261002-split"></script>
	</body>
</html>
