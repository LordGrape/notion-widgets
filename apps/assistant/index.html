<!doctype html>
<html lang="en-CA">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,viewport-fit=cover"
		/>
		<meta name="theme-color" content="#faf9fd" />
		<meta
			name="description"
			content="Your tasks, your day, and room to focus."
		/>
		<link rel="manifest" href="./manifest.webmanifest" />
		<script type="importmap">
			{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
		</script>
		<link rel="icon" href="./icon.svg" type="image/svg+xml" />
		<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
		<script>
			try {
				document.documentElement.dataset.theme =
					localStorage.getItem("command-centre-theme-v1") ||
					(matchMedia("(prefers-color-scheme:light)").matches
						? "light"
						: "dark");
			} catch (e) {
				document.documentElement.dataset.theme = "light";
			}
		</script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
	<link rel="preload" as="image" href="./broadcast-run.webp?v=hd" fetchpriority="high" />
	<link rel="stylesheet" href="./styles.css?v=20261003-logo-anim" />
		<title>Command Centre</title>
	<link rel="stylesheet" href="../../reading-estimates.css?v=20261002-class-anchored-tasks">
</head>
	<body class="locked">
		<div class="lock-screen" id="lockScreen">
			<form class="lock-card" id="unlockForm">
				<span class="brand-mark" aria-hidden="true"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="18" fill="#17131d"/><g class="lg-ant"><path d="M32 17 25 8M32 17l8-8" stroke="#bfa4ff" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle class="lg-orb" cx="25" cy="8" r="2.3" fill="#e8dcff"/><circle class="lg-orb lg-orb2" cx="40" cy="9" r="2.3" fill="#e8dcff"/></g><rect x="9" y="17" width="46" height="37" rx="10" fill="#3b3650"/><rect x="14" y="22" width="31" height="27" rx="7" fill="#22123f"/><g class="lg-m" fill="none" stroke-linejoin="round" stroke-linecap="round"><path class="lg-glow" d="M20 43V30l9.5 9L39 30v13" stroke="#bfa4ff" stroke-width="7"/><path class="lg-cyan" d="M20 43V30l9.5 9L39 30v13" stroke="#33e1ff" stroke-width="4"/><path class="lg-magenta" d="M20 43V30l9.5 9L39 30v13" stroke="#ff4fd0" stroke-width="4"/><path class="lg-main" d="M20 43V30l9.5 9L39 30v13" stroke="#f1ebff" stroke-width="4"/></g><circle class="lg-knob" cx="50" cy="32" r="1.9" fill="#bfa4ff"/><circle class="lg-knob lg-knob2" cx="50" cy="39" r="1.9" fill="#bfa4ff"/></svg></span>
				<p class="eyebrow">Private workspace</p>
				<h1>Command Centre</h1>
				<p class="lock-copy">Your tasks, your day, and room to focus.</p>
				<label for="accessKey">Access key</label>
				<div class="unlock-row">
					<input
						id="accessKey"
						type="password"
						autocomplete="current-password"
						required
						placeholder="Enter your private key"
					/><button class="primary" type="submit">Unlock</button>
				</div>
				<p id="unlockStatus" role="status">Remembered only on this device.</p>
			</form>
		</div>
		<div class="app" id="appShell" aria-hidden="true">
			<header class="app-header">
				<a class="identity" href="./" aria-label="Command Centre home"
					><span class="brand-mark" aria-hidden="true"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="18" fill="#17131d"/><g class="lg-ant"><path d="M32 17 25 8M32 17l8-8" stroke="#bfa4ff" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle class="lg-orb" cx="25" cy="8" r="2.3" fill="#e8dcff"/><circle class="lg-orb lg-orb2" cx="40" cy="9" r="2.3" fill="#e8dcff"/></g><rect x="9" y="17" width="46" height="37" rx="10" fill="#3b3650"/><rect x="14" y="22" width="31" height="27" rx="7" fill="#22123f"/><g class="lg-m" fill="none" stroke-linejoin="round" stroke-linecap="round"><path class="lg-glow" d="M20 43V30l9.5 9L39 30v13" stroke="#bfa4ff" stroke-width="7"/><path class="lg-cyan" d="M20 43V30l9.5 9L39 30v13" stroke="#33e1ff" stroke-width="4"/><path class="lg-magenta" d="M20 43V30l9.5 9L39 30v13" stroke="#ff4fd0" stroke-width="4"/><path class="lg-main" d="M20 43V30l9.5 9L39 30v13" stroke="#f1ebff" stroke-width="4"/></g><circle class="lg-knob" cx="50" cy="32" r="1.9" fill="#bfa4ff"/><circle class="lg-knob lg-knob2" cx="50" cy="39" r="1.9" fill="#bfa4ff"/></svg></span>
					<h1>Command Centre</h1></a
				>
				<nav class="view-tabs" aria-label="Workspace view">
					<button data-view="today" aria-current="page">Today</button
					><button data-view="plan">Plan</button
					><button data-view="focus">Focus</button
					><button data-view="docket">Docket</button>
				</nav>
				<div class="header-actions">
					<button id="searchButton" class="search-trigger">
						<span data-icon="search"></span><span>Search tasks or actions…</span
						><kbd data-shortcut="K">Ctrl + K</kbd></button
					><span class="sync-state" id="syncState" role="status"
						><i></i><span>Connecting…</span></span
					><button
						id="themeToggle"
						class="icon-button"
						aria-label="Change theme"
						aria-keyshortcuts="Control+Alt+L"
					>
						<span data-icon="sun"></span></button
					><button
						id="settingsButton"
						class="icon-button"
						aria-label="Open workspace settings"
					>
						<span data-icon="settings"></span>
					</button>
				</div>
			</header>
			<main id="workspace" aria-label="Command Centre workspace">
				<div class="loading-state"><span class="broadcast-run" aria-hidden="true"></span><span>Loading your workspace…</span></div>
			</main>
			<footer id="focusDock" class="focus-dock" hidden></footer>
			<p id="announcement" class="sr-only" aria-live="polite"></p>
			<div class="toast" id="toast" role="status" hidden>
				<span id="toastText"></span><button id="toastAction" hidden></button><button id="undoButton" hidden>Undo</button
				><button
					class="icon-button"
					id="toastClose"
					aria-label="Dismiss notification"
				>
					×
				</button>
			</div>
		</div>
		<dialog id="editorDialog" aria-labelledby="editorTitle"></dialog>
		<dialog
			id="searchDialog"
			class="command-dialog"
			aria-label="Search tasks and actions"
		></dialog>
		<dialog id="settingsDialog" aria-labelledby="settingsTitle"></dialog>
		<div class="widget-engines" aria-hidden="true" inert>
			<iframe id="todoFrame" title="To-Do widget engine" tabindex="-1"></iframe
			><iframe
				id="timetableFrame"
				title="Timetable widget engine"
				tabindex="-1"
			></iframe
			><iframe
				id="clockFrame"
				title="Clock widget engine"
				tabindex="-1"
				allow="notifications"
			></iframe>
		</div>
		<script src="../../widget-platform.js?v=20261002-class-anchored-tasks"></script>
		<script src="./remember.js"></script>
		<script defer src="./notion-sync.js?v=20261002-class-anchored-tasks"></script>
		<script src="../../widget-icons.js?v=20261001-duotone-b"></script>
		<script type="module" src="./app.js?v=20261003-logo-anim"></script>
	</body>
</html>
