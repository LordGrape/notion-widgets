<!doctype html>
<html lang="en-CA">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,viewport-fit=cover"
		/>
		<meta name="theme-color" content="#faf9fd" />
		<meta
			name="description"
			content="Your tasks, your day, and room to focus."
		/>
		<link rel="manifest" href="./manifest.webmanifest?v=suitcase" />
		<script type="importmap">
			{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
		</script>
		<link rel="icon" href="./icon.svg?v=suitcase" type="image/svg+xml" />
		<link rel="icon" href="./favicon-32.png?v=suitcase" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=suitcase" />
		<script>
			try {
				document.documentElement.dataset.theme =
					localStorage.getItem("command-centre-theme-v1") ||
					(matchMedia("(prefers-color-scheme:light)").matches
						? "light"
						: "dark");
			} catch (e) {
				document.documentElement.dataset.theme = "light";
			}
			/* Broadcast does something different on each load; only that scene's sheet is fetched. */
			(function () {
				var scenes = ["run", "laptop", "meditate", "soccer", "basketball", "coffee"],
					scene = scenes[Math.floor(Math.random() * scenes.length)],
					link = document.createElement("link");
				document.documentElement.dataset.loader = scene;
				link.rel = "preload";
				link.as = "image";
				link.href = "./broadcast-" + scene + ".webp?v=scenes3";
				link.setAttribute("fetchpriority", "high");
				document.head.appendChild(link);
			})();
		</script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
	<link rel="stylesheet" href="./styles.css?v=20261004-freeslots" />
		<title>Command Centre</title>
	<link rel="stylesheet" href="../../reading-estimates.css?v=20261002-class-anchored-tasks">
</head>
	<body class="locked">
		<div class="lock-screen" id="lockScreen">
			<form class="lock-card" id="unlockForm">
				<span class="brand-mark" aria-hidden="true"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="lgat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--lg-tileA)"/><stop offset="1" style="stop-color:var(--lg-tileB)"/></linearGradient><linearGradient id="lgab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--lg-tvA)"/><stop offset="1" style="stop-color:var(--lg-tvB)"/></linearGradient><radialGradient id="lgas" cx=".5" cy=".4" r=".8"><stop offset="0" style="stop-color:var(--lg-scrA)"/><stop offset="1" style="stop-color:var(--lg-scrB)"/></radialGradient></defs><rect width="64" height="64" rx="18" fill="url(#lgat)"/><path class="lg-handle" d="M23 18V13Q23 8 28 8H36Q41 8 41 13V18" style="stroke:var(--lg-ant)" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="5" y="17" width="54" height="40" rx="7" fill="url(#lgab)"/><rect x="7" y="19" width="50" height="36" rx="5" fill="none" style="stroke:var(--lg-rim)" stroke-opacity=".6"/><rect x="13" y="26" width="38" height="25" rx="4" fill="url(#lgas)"/><path d="M14 18V23H21V18M43 18V23H50V18" style="stroke:var(--lg-rim)" stroke-width="3" fill="none" stroke-linejoin="round"/><g class="lg-m" fill="none" stroke-linejoin="round" stroke-linecap="round"><path class="lg-glow" d="M22 44V31l10 9 10-9V44" style="stroke:var(--lg-glow)" stroke-width="9" stroke-opacity=".35"/><path class="lg-cyan" d="M22 44V31l10 9 10-9V44" stroke="#33e1ff" stroke-width="5.6"/><path class="lg-magenta" d="M22 44V31l10 9 10-9V44" stroke="#ff4fd0" stroke-width="5.6"/><path class="lg-main" d="M22 44V31l10 9 10-9V44" style="stroke:var(--lg-m)" stroke-width="5.6"/></g><path d="M6 26V22Q6 18 10 18H14M50 18H54Q58 18 58 22V26M6 48V52Q6 56 10 56H14M50 56H54Q58 56 58 52V48" style="stroke:var(--lg-rim)" stroke-width="2" fill="none"/></svg></span>
				<p class="eyebrow">Private workspace</p>
				<h1>Command Centre</h1>
				<p class="lock-copy">Your tasks, your day, and room to focus.</p>
				<label for="accessKey">Access key</label>
				<div class="unlock-row">
					<input
						id="accessKey"
						type="password"
						autocomplete="current-password"
						required
						placeholder="Enter your private key"
					/><button class="primary" type="submit">Unlock</button>
				</div>
				<p id="unlockStatus" role="status">Remembered only on this device.</p>
			</form>
		</div>
		<div class="app" id="appShell" aria-hidden="true">
			<header class="app-header">
				<a class="identity" data-ctx="app" href="./" aria-label="Command Centre home"
					><span class="brand-mark" aria-hidden="true"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><linearGradient id="lgbt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--lg-tileA)"/><stop offset="1" style="stop-color:var(--lg-tileB)"/></linearGradient><linearGradient id="lgbb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--lg-tvA)"/><stop offset="1" style="stop-color:var(--lg-tvB)"/></linearGradient><radialGradient id="lgbs" cx=".5" cy=".4" r=".8"><stop offset="0" style="stop-color:var(--lg-scrA)"/><stop offset="1" style="stop-color:var(--lg-scrB)"/></radialGradient></defs><rect width="64" height="64" rx="18" fill="url(#lgbt)"/><path class="lg-handle" d="M23 18V13Q23 8 28 8H36Q41 8 41 13V18" style="stroke:var(--lg-ant)" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="5" y="17" width="54" height="40" rx="7" fill="url(#lgbb)"/><rect x="7" y="19" width="50" height="36" rx="5" fill="none" style="stroke:var(--lg-rim)" stroke-opacity=".6"/><rect x="13" y="26" width="38" height="25" rx="4" fill="url(#lgbs)"/><path d="M14 18V23H21V18M43 18V23H50V18" style="stroke:var(--lg-rim)" stroke-width="3" fill="none" stroke-linejoin="round"/><g class="lg-m" fill="none" stroke-linejoin="round" stroke-linecap="round"><path class="lg-glow" d="M22 44V31l10 9 10-9V44" style="stroke:var(--lg-glow)" stroke-width="9" stroke-opacity=".35"/><path class="lg-cyan" d="M22 44V31l10 9 10-9V44" stroke="#33e1ff" stroke-width="5.6"/><path class="lg-magenta" d="M22 44V31l10 9 10-9V44" stroke="#ff4fd0" stroke-width="5.6"/><path class="lg-main" d="M22 44V31l10 9 10-9V44" style="stroke:var(--lg-m)" stroke-width="5.6"/></g><path d="M6 26V22Q6 18 10 18H14M50 18H54Q58 18 58 22V26M6 48V52Q6 56 10 56H14M50 56H54Q58 56 58 52V48" style="stroke:var(--lg-rim)" stroke-width="2" fill="none"/></svg></span>
					<h1>Command Centre</h1></a
				>
				<nav class="view-tabs" aria-label="Workspace view">
					<button data-view="today" aria-current="page">Today</button
					><button data-view="plan">Plan</button
					><button data-view="focus">Focus</button
					><button data-view="docket">Docket</button>
				</nav>
				<div class="header-actions">
					<button id="searchButton" class="search-trigger">
						<span data-icon="search"></span><span>Search tasks or actions…</span
						><kbd data-shortcut="K">Ctrl + K</kbd></button
					><span class="sync-state" id="syncState" role="status"
						><i></i><span>Connecting…</span></span
					><button
						id="themeToggle"
						class="icon-button"
						aria-label="Change theme"
						aria-keyshortcuts="Control+Alt+L"
					>
						<span data-icon="sun"></span></button
					><button
						id="settingsButton"
						class="icon-button"
						aria-label="Open workspace settings"
					>
						<span data-icon="settings"></span>
					</button>
				</div>
			</header>
			<main id="workspace" aria-label="Command Centre workspace">
				<div class="loading-state"><span class="broadcast-run" aria-hidden="true"></span><span>Loading your workspace…</span></div>
			</main>
			<footer id="focusDock" class="focus-dock" hidden></footer>
			<p id="announcement" class="sr-only" aria-live="polite"></p>
			<aside class="checkin-card" id="checkIn" aria-label="Block check-in" hidden></aside>
			<div class="toast" id="toast" role="status" hidden>
				<span id="toastText"></span><button id="toastAction" hidden></button><button id="undoButton" hidden>Undo</button
				><button
					class="icon-button"
					id="toastClose"
					aria-label="Dismiss notification"
				>
					×
				</button>
			</div>
		</div>
		<dialog id="editorDialog" aria-labelledby="editorTitle"></dialog>
		<dialog
			id="searchDialog"
			class="command-dialog"
			aria-label="Search tasks and actions"
		></dialog>
		<dialog id="settingsDialog" aria-labelledby="settingsTitle"></dialog>
		<dialog id="choiceDialog" class="choice-dialog" aria-labelledby="choiceTitle"></dialog>
		<div class="widget-engines" aria-hidden="true" inert>
			<iframe id="todoFrame" title="To-Do widget engine" tabindex="-1"></iframe
			><iframe
				id="timetableFrame"
				title="Timetable widget engine"
				tabindex="-1"
			></iframe
			><iframe
				id="clockFrame"
				title="Clock widget engine"
				tabindex="-1"
				allow="notifications"
			></iframe>
		</div>
		<script src="../../widget-platform.js?v=20261002-class-anchored-tasks"></script>
		<script src="./remember.js"></script>
		<script defer src="./notion-sync.js?v=20261002-class-anchored-tasks"></script>
		<script src="../../widget-icons.js?v=20261001-duotone-b"></script>
		<script type="module" src="./app.js?v=20261004-freeslots"></script>
	</body>
</html>
