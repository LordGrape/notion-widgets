<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Athlete</title>
<script src="core.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
 --lg-canvas:#f7f3ff; --lg-surface:rgba(255,255,255,0.66); --lg-surface-raised:rgba(255,255,255,0.86); --lg-surface-soft:rgba(139,92,246,0.105);
 --lg-ink:#24182f; --lg-ink-muted:rgba(36,24,47,0.68); --lg-ink-faint:rgba(36,24,47,0.46);
 --lg-violet:#7c3aed; --lg-violet-2:#a855f7; --lg-violet-3:#c084fc;
 --lg-border:rgba(124,58,237,0.22); --lg-border-strong:rgba(124,58,237,0.42); --lg-glow:rgba(124,58,237,0.22);
 --lg-shadow:0 18px 54px rgba(42,23,76,0.16); --lg-radius:22px; --lg-radius-sm:12px; --lg-ease:cubic-bezier(0.22,1,0.36,1);
 --lv0:#94a3b8; --lv1:#0ea5e9; --lv2:#10b981; --lv3:#f59e0b;
}
@media (prefers-color-scheme: dark){:root{
 --lg-canvas:#0f0b15; --lg-surface:rgba(27,20,38,0.72); --lg-surface-raised:rgba(35,27,50,0.90); --lg-surface-soft:rgba(167,139,250,0.13);
 --lg-ink:rgba(255,255,255,0.94); --lg-ink-muted:rgba(255,255,255,0.68); --lg-ink-faint:rgba(255,255,255,0.46);
 --lg-violet:#c4b5fd; --lg-violet-2:#a78bfa; --lg-violet-3:#8b5cf6;
 --lg-border:rgba(196,181,253,0.24); --lg-border-strong:rgba(196,181,253,0.46); --lg-glow:rgba(167,139,250,0.24);
 --lg-shadow:0 18px 60px rgba(0,0,0,0.46);
 --lv0:#64748b; --lv1:#38bdf8; --lv2:#34d399; --lv3:#fbbf24;
}}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--lg-canvas);color:var(--lg-ink);min-height:100vh;display:flex;justify-content:center;padding:26px 12px 48px;user-select:none;-webkit-user-select:none;transition:background .3s}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--lg-glow)}50%{box-shadow:0 0 0 7px transparent}}
.container{position:relative;z-index:1;width:100%;max-width:560px;padding:20px 20px 14px;border-radius:var(--lg-radius);background:linear-gradient(180deg,var(--lg-surface-raised),var(--lg-surface));border:1px solid var(--lg-border);box-shadow:var(--lg-shadow);backdrop-filter:blur(28px) saturate(1.55);-webkit-backdrop-filter:blur(28px) saturate(1.55);animation:fadeIn .6s var(--lg-ease)}
.top{display:flex;justify-content:space-between;align-items:center}
.label{font-size:9.5px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--lg-ink-faint)}
.top-actions{display:flex;align-items:center;gap:10px}
.sync{font-size:9.5px;letter-spacing:.08em;color:var(--lg-ink-faint)}
.icon-btn{width:28px;height:28px;border-radius:9px;border:1px solid var(--lg-border);background:var(--lg-surface-soft);color:var(--lg-ink-muted);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.icon-btn:hover{color:var(--lg-ink);border-color:var(--lg-border-strong)}
.hero{display:flex;gap:16px;align-items:center;margin-top:14px}
.hero-left{flex:1;min-width:0}
.ovr-row{display:flex;align-items:baseline}
.ovr{font-size:58px;font-weight:800;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--lg-ink),var(--lg-violet) 45%,var(--lg-violet-3) 70%,var(--lg-ink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ovr-max{font-size:12px;color:var(--lg-ink-faint);margin-left:5px}
.hero-name{font-size:13px;font-weight:600;letter-spacing:.22em;color:var(--lg-ink-muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-tally{font-size:10.5px;color:var(--lg-ink-faint);margin-top:7px;line-height:1.55}
.limiter{color:var(--lg-violet);font-weight:600}
.radar{width:220px;height:220px;flex:none}
.attrs{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.attr{display:grid;grid-template-columns:42px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;background:var(--lg-surface-soft);border:1px solid var(--lg-border);border-radius:var(--lg-radius-sm)}
.attr:hover{border-color:var(--lg-border-strong)}
.attr.off{opacity:.45}
.attr-code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--lg-violet)}
.attr-name{font-size:12px;font-weight:500;color:var(--lg-ink)}
.attr-bar{height:4px;border-radius:99px;background:var(--lg-surface-soft);margin-top:5px;overflow:hidden;border:1px solid var(--lg-border)}
.attr-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lg-violet),var(--lg-violet-2));transition:width .8s var(--lg-ease)}
.attr-score{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:16px;font-weight:700;min-width:32px;text-align:right;color:var(--lg-ink);font-variant-numeric:tabular-nums}
.attr-delta{font-size:10px;min-width:36px;text-align:right;color:var(--lg-ink-faint);font-variant-numeric:tabular-nums}
.attr-delta.up{color:var(--lv2)}
.attr-delta.down{color:#f87171}
.log-btn{width:100%;margin-top:14px;padding:12px 0;border-radius:14px;border:none;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(135deg,var(--lg-violet),var(--lg-violet-2));color:#fff;font-family:inherit;box-shadow:0 10px 28px var(--lg-glow)}
.log-btn.pulse{animation:pulse 2.4s infinite}
.foot{margin-top:12px;text-align:center;font-size:9.5px;color:var(--lg-ink-faint);letter-spacing:.08em}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(15,10,25,0.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .25s ease}
.overlay[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;padding:18px;border-radius:var(--lg-radius);background:linear-gradient(180deg,var(--lg-surface-raised),var(--lg-surface));border:1px solid var(--lg-border);box-shadow:var(--lg-shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel-title{font-size:15px;font-weight:600;color:var(--lg-ink)}
.test-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.test-pick{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--lg-border);background:var(--lg-surface-soft);cursor:pointer;color:var(--lg-ink);font:inherit;font-size:12px;font-weight:500}
.test-pick small{display:block;color:var(--lg-ink-faint);font-size:9.5px;margin-top:3px;font-weight:400}
.test-pick:hover{border-color:var(--lg-border-strong)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--lg-ink-faint)}
.fld input{padding:10px 12px;border-radius:12px;border:1px solid var(--lg-border);background:var(--lg-surface-soft);color:var(--lg-ink);font:inherit;font-size:13px;outline:none;width:100%}
.fld input:focus{border-color:var(--lg-border-strong)}
.timepair{display:flex;gap:8px;align-items:center}
.timepair input{width:76px;text-align:center}
.timepair span{color:var(--lg-ink-faint);font-weight:600}
.loadrow{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--lg-border);background:var(--lg-surface-soft);cursor:pointer;font-size:11px;font-weight:600;color:var(--lg-ink-muted);font-family:inherit}
.chip.set{background:linear-gradient(135deg,var(--lg-violet),var(--lg-violet-2));color:#fff;border-color:transparent}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.form-btn{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--lg-border);cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--lg-ink-muted);font-family:inherit}
.form-btn-primary{background:linear-gradient(135deg,var(--lg-violet),var(--lg-violet-2));color:#fff;border:none}
.form-btn-danger{color:#ef4444;border-color:rgba(239,68,68,0.35)}
.form-btn-danger.armed{background:#ef4444;color:#fff;border-color:transparent}
.err{font-size:10.5px;color:#ef4444;margin-top:8px;min-height:14px}
.note{font-size:10px;color:var(--lg-ink-faint);line-height:1.5;margin-top:8px}
.lv{display:inline-block;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;font-weight:700;letter-spacing:.06em;padding:4px 7px;border-radius:6px}
.lv0{color:var(--lg-ink-faint);background:var(--lg-surface-soft)}
.lv1{color:var(--lv1);background:rgba(56,189,248,0.14)}
.lv2{color:var(--lv2);background:rgba(52,211,153,0.14)}
.lv3{color:var(--lv3);background:rgba(245,158,11,0.15)}
.d-test{border-top:1px solid var(--lg-border);padding:12px 0 6px}
.d-test:first-child{border-top:none;padding-top:2px}
.d-row{display:flex;align-items:center;gap:10px}
.d-name{flex:1;font-size:12.5px;font-weight:600;color:var(--lg-ink)}
.d-val{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--lg-ink);font-variant-numeric:tabular-nums}
.d-sub{font-size:10px;color:var(--lg-ink-faint);margin-top:3px}
.spark{width:100%;height:46px;margin-top:8px;display:block}
.entries{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.entry{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--lg-ink-muted);padding:6px 8px;border-radius:8px;background:var(--lg-surface-soft)}
.entry .e-d{color:var(--lg-ink-faint);min-width:56px}
.entry .e-v{flex:1;font-variant-numeric:tabular-nums}
.entry .e-x{border:none;background:transparent;color:var(--lg-ink-faint);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:6px;font-family:inherit}
.entry .e-x:hover{color:#ef4444}
.mini-log{margin-top:8px;width:100%;padding:8px 0;border-radius:10px;border:1px dashed var(--lg-border-strong);background:transparent;color:var(--lg-violet);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:inherit}
@media (max-width:520px){
 .hero{flex-direction:column;align-items:stretch}
 .hero-left{text-align:center}
 .ovr-row{justify-content:center}
 .radar{width:200px;height:200px;margin:0 auto}
 .ovr{font-size:48px}
 .test-grid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){.container,.overlay{animation:none}.log-btn.pulse{animation:none}}
</style>

<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<main class="container card" id="app">
 <div class="top">
  <div class="label">Athlete Rating</div>
  <div class="top-actions">
   <span class="sync" id="syncState"></span>
   <button class="icon-btn" id="settingsBtn" aria-label="Settings" data-snd>&#9881;</button>
  </div>
 </div>
 <section class="hero">
  <div class="hero-left">
   <div class="ovr-row"><span class="ovr stats-num" id="ovrNum">&#8212;</span><span class="ovr-max">/ 99</span></div>
   <div class="hero-name" id="heroName">ATHLETE</div>
   <div class="hero-tally" id="heroTally">Log your first result to generate your card.</div>
  </div>
  <canvas id="radar" class="radar" aria-label="Attribute radar chart"></canvas>
 </section>
 <section id="attrList" class="attrs"></section>
 <button class="form-btn form-btn-primary log-btn" id="logBtn" data-snd>+ Log result</button>
 <footer class="foot">Bands &middot; Entry 60 &middot; Pro 75 &middot; Elite 90 &middot; Cap 99</footer>
</main>

<div class="overlay" id="logSheet" hidden>
 <div class="card sheet" role="dialog" aria-modal="true" aria-label="Log result">
  <div class="sheet-head"><div class="panel-title" id="logTitle">Log result</div><button class="icon-btn" data-close="logSheet" aria-label="Close">&times;</button></div>
  <div id="logBody"></div>
 </div>
</div>

<div class="overlay" id="detail" hidden>
 <div class="card sheet" role="dialog" aria-modal="true" aria-label="Attribute detail">
  <div class="sheet-head"><div class="panel-title" id="detailTitle">Detail</div><button class="icon-btn" data-close="detail" aria-label="Close">&times;</button></div>
  <div id="detailBody"></div>
 </div>
</div>

<div class="overlay" id="settings" hidden>
 <div class="card sheet" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="sheet-head"><div class="panel-title">Settings</div><button class="icon-btn" data-close="settings" aria-label="Close">&times;</button></div>
  <div class="fld"><label for="setBw">Bodyweight (kg) &middot; used for relative grip</label><input id="setBw" inputmode="decimal" placeholder="e.g. 77.1"></div>
  <div class="fld"><label>Loaded march pace anchors (min/km, mm:ss)</label>
   <div class="loadrow">
    <input id="rkFloor" placeholder="Floor 14:00" style="width:84px" aria-label="Floor pace">
    <input id="rkL1" placeholder="Entry 12:30" style="width:84px" aria-label="Entry pace">
    <input id="rkL2" placeholder="Pro 11:40" style="width:84px" aria-label="Pro pace">
    <input id="rkL3" placeholder="Elite 11:00" style="width:84px" aria-label="Elite pace">
    <input id="rkCap" placeholder="Cap 9:30" style="width:84px" aria-label="Cap pace">
   </div>
   <div class="note">Custom standard. No published table ships with the widget; tune these five anchors to your own targets.</div>
  </div>
  <div class="err" id="setErr"></div>
  <div class="sheet-actions">
   <button class="form-btn form-btn-primary" id="setSave" data-snd>Save</button>
   <button class="form-btn" id="setExport" data-snd>Export</button>
   <button class="form-btn form-btn-danger" id="setReset">Reset</button>
  </div>
 </div>
</div>

<script>
'use strict';
/* ============================================================
   ATHLETE v1 - fitness rating widget
   Each logged test maps a raw result to a 0-99 score through
   five anchors (floor 25 / Entry 60 / Pro 75 / Elite 90 / cap 99),
   piecewise linear, clamped 10-99. Attributes aggregate tests;
   OVR is the mean of tested attributes. All persistent state
   lives in SyncEngine namespace 'fitness', key 'state'.
   ============================================================ */

var WORKER = 'https://widget-sync.lordgrape-widgets.workers.dev';
var NS = 'fitness';

/* ── Test catalogue. Anchors are [value, score] pairs ascending by value.
      dir 'hi': bigger is better. dir 'lo': faster is better. ── */
var TESTS = [
 { id:'run2400', name:'2400 m Run',        attr:'AEP', kind:'time',  dir:'lo', anchors:[[440,99],[480,90],[495,75],[510,60],[660,25]], lv:[510,495,480], hint:'mm:ss, fresh effort' },
 { id:'run8000', name:'8 km Run',          attr:'AEC', kind:'time',  dir:'lo', anchors:[[1800,99],[2040,90],[2100,75],[2250,60],[2880,25]], lv:[2250,2100,2040], hint:'mm:ss' },
 { id:'run400',  name:'400 m Run',         attr:'ANA', kind:'time',  dir:'lo', anchors:[[56,99],[65,90],[70,75],[75,60],[95,25]], lv:[75,70,65], hint:'mm:ss' },
 { id:'sprint40',name:'40 m Sprint',       attr:'POW', kind:'timeS', dir:'lo', anchors:[[4.9,99],[5.16,90],[5.2,75],[5.25,60],[6.2,25]], lv:[5.25,5.2,5.16], hint:'seconds, e.g. 5.08' },
 { id:'vjump',   name:'Vertical Jump',     attr:'POW', kind:'num',   dir:'hi', unit:'cm', anchors:[[30,25],[50,60],[55,75],[60,90],[75,99]], lv:[50,55,60], hint:'centimetres' },
 { id:'pullups', name:'Pull-ups (strict)', attr:'UPS', kind:'int',   dir:'hi', anchors:[[1,25],[9,60],[12,75],[14,90],[20,99]], lv:[9,12,14], hint:'max strict reps' },
 { id:'pushups', name:'Push-ups (max)',    attr:'UPS', kind:'int',   dir:'hi', anchors:[[15,25],[50,60],[53,75],[55,90],[70,99]], lv:[50,53,55], hint:'max continuous reps' },
 { id:'situps',  name:'Sit-ups (cadence)', attr:'COR', kind:'int',   dir:'hi', anchors:[[30,25],[100,60],[125,75],[148,90],[150,97]], lv:[100,125,150], hint:'reps at cadence, 6 min cap' },
 { id:'grip',    name:'Grip (relative)',   attr:'UPS', kind:'grip',  dir:'hi', anchors:[[0.6,25],[1,60],[1.1,75],[1.16,90],[1.45,99]], lv:[1,1.1,1.16], hint:'left + right kg over bodyweight' },
 { id:'bench',   name:'Bench Press AMRAP', attr:'UPS', kind:'amrap', dir:'hi', defaultLoad:65,
   loads:{ '55':[[10,25],[33,60],[35,75],[37,90],[45,99]], '65':[[5,25],[24,60],[26,75],[28,90],[38,99]], '75':[[2,25],[13,60],[15,75],[17,90],[24,99]] },
   lvPer:{ '55':[33,35,37], '65':[24,26,28], '75':[13,15,17] }, hint:'reps at chosen load' },
 { id:'squat',   name:'Back Squat AMRAP',  attr:'LWS', kind:'amrap', dir:'hi', defaultLoad:80,
   loads:{ '72':[[5,25],[18,60],[22,75],[26,90],[34,99]], '80':[[4,25],[16,60],[19,75],[22,90],[30,99]], '90':[[2,25],[9,60],[12,75],[15,90],[22,99]] },
   lvPer:{ '72':[18,22,26], '80':[16,19,22], '90':[9,12,15] }, hint:'reps at chosen load' },
 { id:'ruck',    name:'Loaded March',      attr:'RUC', kind:'ruck',  dir:'lo', custom:true, hint:'pace per km with load' }
];

var ATTRS = [
 { code:'AEP', name:'Aerobic Power',    tests:['run2400'] },
 { code:'AEC', name:'Aerobic Capacity', tests:['run8000'] },
 { code:'ANA', name:'Anaerobic',        tests:['run400'] },
 { code:'POW', name:'Power and Speed',  tests:['vjump','sprint40'] },
 { code:'UPS', name:'Upper Strength',   tests:['bench','pushups','pullups','grip'] },
 { code:'LWS', name:'Lower Strength',   tests:['squat'] },
 { code:'COR', name:'Core',             tests:['situps'] },
 { code:'RUC', name:'Rucking',          tests:['ruck'] }
];

var DEFAULT_RUCK = { floor:840, l1:750, l2:700, l3:660, cap:570 };
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── State ── */
var state = { v:1, bw:null, entries:[], ruck:{ floor:840, l1:750, l2:700, l3:660, cap:570 } };

function loadState(){
 var s = null;
 try { s = SyncEngine.get(NS, 'state'); } catch(e) {}
 if (s && typeof s === 'object') {
  state = s;
  if (!state.ruck) state.ruck = { floor:840, l1:750, l2:700, l3:660, cap:570 };
  if (!state.entries) state.entries = [];
 }
}
function save(){ try { SyncEngine.set(NS, 'state', state); } catch(e) {} }

/* ── Helpers ── */
function el(id){ return document.getElementById(id); }
function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function mean(a){ return a.reduce(function(x,y){ return x+y; }, 0) / a.length; }
function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
function testById(id){ for (var i=0;i<TESTS.length;i++) if (TESTS[i].id===id) return TESTS[i]; return null; }
function attrByCode(code){ for (var i=0;i<ATTRS.length;i++) if (ATTRS[i].code===code) return ATTRS[i]; return null; }
function snd(name){ try { if (window.Core && Core.audio && Core.audio[name]) Core.audio[name](); } catch(e) {} }
function announce(t){ try { if (window.Core && Core.a11y) Core.a11y.announce(t); } catch(e) {} }

function fmtMS(sec){
 sec = Math.round(sec * 10) / 10;
 var m = Math.floor(sec / 60), s = sec - m*60;
 var ss = (s < 10 ? '0' : '') + (Math.round(s*10)/10);
 return m + ':' + ss;
}
function fmtDate(d){
 var p = (d || '').split('-');
 if (p.length !== 3) return d || '';
 return String(parseInt(p[2],10)) + ' ' + (MONTHS[parseInt(p[1],10)-1] || '') + ' ' + p[0].slice(2);
}
function todayStr(){
 var d = new Date();
 var m = d.getMonth()+1, day = d.getDate();
 return d.getFullYear() + '-' + (m<10?'0':'')+m + '-' + (day<10?'0':'')+day;
}

/* ── Entries ── */
function entriesFor(tid, list){
 return (list || state.entries).filter(function(e){ return e.t === tid; })
  .sort(function(a,b){ return a.d === b.d ? (a.ts - b.ts) : (a.d < b.d ? -1 : 1); });
}
function latestEntry(tid){ var l = entriesFor(tid); return l.length ? l[l.length-1] : null; }
function latestEntryAmong(tids){
 var best = null;
 tids.forEach(function(id){ var e = latestEntry(id); if (e && (!best || e.d > best.d || (e.d === best.d && e.ts > best.ts))) best = e; });
 return best;
}

/* ── Scoring ── */
function anchorsFor(test, entry){
 if (test.id === 'ruck'){ var r = state.ruck || DEFAULT_RUCK; return [[r.cap,99],[r.l3,90],[r.l2,75],[r.l1,60],[r.floor,25]]; }
 if (test.kind === 'amrap'){ var L = String(entry && entry.load ? entry.load : test.defaultLoad); return test.loads[L] || test.loads[String(test.defaultLoad)]; }
 return test.anchors;
}
function levelsFor(test, entry){
 if (test.id === 'ruck'){ var r = state.ruck || DEFAULT_RUCK; return [r.l1, r.l2, r.l3]; }
 if (test.kind === 'amrap'){ var L = String(entry && entry.load ? entry.load : test.defaultLoad); return test.lvPer[L]; }
 return test.lv;
}
function lerpScore(a, v){
 var n = a.length;
 if (v <= a[0][0]) return a[0][1];
 if (v >= a[n-1][0]) return a[n-1][1];
 for (var i=0;i<n-1;i++){
  if (v >= a[i][0] && v <= a[i+1][0]){
   var t = (v - a[i][0]) / (a[i+1][0] - a[i][0]);
   return a[i][1] + t * (a[i+1][1] - a[i][1]);
  }
 }
 return a[n-1][1];
}
function scoreOf(test, v, entry){ return clamp(Math.round(lerpScore(anchorsFor(test, entry), v)), 10, 99); }
function levelOf(test, v, entry){
 var lv = levelsFor(test, entry);
 if (test.dir === 'hi'){ if (v >= lv[2]) return 3; if (v >= lv[1]) return 2; if (v >= lv[0]) return 1; return 0; }
 if (v <= lv[2]) return 3; if (v <= lv[1]) return 2; if (v <= lv[0]) return 1; return 0;
}
function levelChip(lv){ return '<span class="lv lv' + lv + '">' + (lv > 0 ? 'L' + lv : 'L0') + '</span>'; }
function bandOf(s){ if (s >= 90) return 'Elite'; if (s >= 75) return 'Pro'; if (s >= 60) return 'Entry'; return 'Below'; }

function attrScore(attr, entriesList){
 var parts = [];
 attr.tests.forEach(function(tid){
  var t = testById(tid);
  var es = entriesFor(tid, entriesList);
  if (es.length){ var e = es[es.length-1]; parts.push(scoreOf(t, e.v, e)); }
 });
 return parts.length ? Math.round(mean(parts)) : null;
}

function computeModel(){
 var attrs = ATTRS.map(function(a){
  var score = attrScore(a, state.entries);
  var tested = score !== null;
  var delta = null;
  if (tested){
   var latest = latestEntryAmong(a.tests);
   if (latest){
    var rest = state.entries.filter(function(e){ return e.id !== latest.id; });
    var prev = attrScore(a, rest);
    if (prev !== null){ var d = score - prev; if (d !== 0) delta = d; }
   }
  }
  return { code:a.code, name:a.name, tests:a.tests, score:score, tested:tested, delta:delta };
 });
 var testedAttrs = attrs.filter(function(a){ return a.tested; });
 var ovr = testedAttrs.length ? Math.round(mean(testedAttrs.map(function(a){ return a.score; }))) : null;
 return { attrs:attrs, ovr:ovr, testedCount:testedAttrs.length };
}

/* ── Render: hero ── */
function renderHero(model){
 var o = el('ovrNum');
 if (model.ovr === null){ o.textContent = '\u2014'; }
 else {
  var prev = parseInt(o.textContent, 10);
  if (window.Core && Core.smoothCounter && !Core.reducedMotion && isFinite(prev)){
   try { Core.smoothCounter(o, model.ovr, { duration:0.7 }); } catch(e){ o.textContent = String(model.ovr); }
  } else o.textContent = String(model.ovr);
 }
 var tally = el('heroTally');
 if (!model.testedCount){ tally.textContent = 'Log your first result to generate your card.'; return; }
 var counts = { Elite:0, Pro:0, Entry:0, Below:0 };
 model.attrs.forEach(function(a){ if (a.tested) counts[bandOf(a.score)]++; });
 var parts = [];
 ['Elite','Pro','Entry','Below'].forEach(function(b){ if (counts[b]) parts.push(counts[b] + ' ' + b); });
 var untested = ATTRS.length - model.testedCount;
 if (untested) parts.push(untested + ' untested');
 var worst = null;
 model.attrs.forEach(function(a){ if (a.tested && (!worst || a.score < worst.score)) worst = a; });
 tally.innerHTML = parts.join(' \u00b7 ') + (worst ? '<br>Focus: <span class="limiter">' + worst.name + ' ' + worst.score + '</span>' : '');
}

/* ── Render: attribute rows ── */
function renderAttrs(model){
 var host = el('attrList');
 host.innerHTML = '';
 model.attrs.forEach(function(a){
  var row = document.createElement('div');
  row.className = 'item attr' + (a.tested ? '' : ' off');
  row.setAttribute('data-attr', a.code);
  row.setAttribute('role', 'button');
  row.setAttribute('tabindex', '0');
  var deltaHtml = '';
  if (a.delta !== null) deltaHtml = '<div class="attr-delta ' + (a.delta > 0 ? 'up' : 'down') + '">' + (a.delta > 0 ? '\u25b2' : '\u25bc') + Math.abs(a.delta) + '</div>';
  else if (a.tested) deltaHtml = '<div class="attr-delta"></div>';
  else deltaHtml = '<div class="attr-delta">new</div>';
  row.innerHTML = '<div class="attr-code">' + a.code + '</div>' +
   '<div><div class="attr-name">' + a.name + '</div><div class="attr-bar"><i style="width:0%"></i></div></div>' +
   '<div class="attr-score stats-num">' + (a.tested ? a.score : '\u2014') + '</div>' + deltaHtml;
  row.addEventListener('click', function(){ openDetail(a.code); });
  row.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); openDetail(a.code); } });
  host.appendChild(row);
  if (a.tested){
   var fill = row.querySelector('.attr-bar i');
   setTimeout(function(f, s){ return function(){ f.style.width = s + '%'; }; }(fill, a.score), 60);
  }
 });
}

/* ── Render: radar ── */
function radarColours(){
 var dark = !!(window.Core && Core.isDark);
 var accent = '#8b5cf6';
 try {
  var v = getComputedStyle(document.documentElement).getPropertyValue('--lg-violet').trim();
  if (v) accent = v;
 } catch(e) {}
 return {
  grid:  dark ? 'rgba(196,181,253,0.13)' : 'rgba(124,58,237,0.12)',
  elite: dark ? 'rgba(196,181,253,0.30)' : 'rgba(124,58,237,0.30)',
  label: dark ? 'rgba(255,255,255,0.55)' : 'rgba(36,24,47,0.55)',
  off:   dark ? 'rgba(255,255,255,0.25)' : 'rgba(36,24,47,0.28)',
  stroke: accent,
  fill:  dark ? 'rgba(167,139,250,0.20)' : 'rgba(139,92,246,0.20)'
 };
}
function drawRadar(model, prog){
 var cv = el('radar');
 var cssW = cv.clientWidth || 220;
 var dpr = Math.min(window.devicePixelRatio || 1, 2);
 if (cv.width !== Math.round(cssW * dpr)){ cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssW * dpr); }
 var ctx = cv.getContext('2d');
 ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
 ctx.clearRect(0, 0, cssW, cssW);
 var cx = cssW/2, cy = cssW/2, R = cssW/2 - 30;
 var N = ATTRS.length;
 var c = radarColours();
 var ang = function(i){ return -Math.PI/2 + i * 2 * Math.PI / N; };
 var pt = function(i, frac){ return [cx + Math.cos(ang(i)) * R * frac, cy + Math.sin(ang(i)) * R * frac]; };
 var i, j, p;
 /* rings: Entry 60, Pro 75, Elite 90 (emphasised), cap 99 */
 var rings = [60/99, 75/99, 90/99, 1];
 for (j=0;j<rings.length;j++){
  ctx.beginPath();
  for (i=0;i<N;i++){ p = pt(i, rings[j]); if (i===0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); }
  ctx.closePath();
  ctx.strokeStyle = (j === 2) ? c.elite : c.grid;
  ctx.lineWidth = (j === 2) ? 1.4 : 1;
  ctx.stroke();
 }
 /* spokes */
 ctx.strokeStyle = c.grid; ctx.lineWidth = 1;
 for (i=0;i<N;i++){ p = pt(i, 1); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p[0], p[1]); ctx.stroke(); }
 /* value polygon */
 var pgm = (prog === null || prog === undefined) ? 1 : prog;
 ctx.beginPath();
 for (i=0;i<N;i++){
  var a = model.attrs[i];
  var f = (a.tested ? a.score : 0) / 99 * pgm;
  p = pt(i, f);
  if (i===0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
 }
 ctx.closePath();
 ctx.fillStyle = c.fill; ctx.fill();
 ctx.strokeStyle = c.stroke; ctx.lineWidth = 1.6; ctx.stroke();
 /* vertex dots */
 for (i=0;i<N;i++){
  var at = model.attrs[i];
  if (!at.tested) continue;
  var ff = at.score / 99 * pgm;
  p = pt(i, ff);
  ctx.beginPath(); ctx.arc(p[0], p[1], 2.6, 0, Math.PI*2);
  ctx.fillStyle = c.stroke; ctx.fill();
 }
 /* labels */
 ctx.font = '700 9px "JetBrains Mono", ui-monospace, monospace';
 ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
 for (i=0;i<N;i++){
  p = pt(i, 1.14);
  ctx.fillStyle = model.attrs[i].tested ? c.label : c.off;
  ctx.fillText(ATTRS[i].code, p[0], p[1]);
 }
}
function animateRadar(model){
 var done = function(){ drawRadar(model, 1); };
 if (window.Core && Core.gsapReady && !Core.reducedMotion){
  Core.gsapReady.then(function(g){
   if (!g){ done(); return; }
   var o = { p:0 };
   g.to(o, { p:1, duration:0.7, ease:'power3.out',
    onUpdate:function(){ drawRadar(model, o.p); },
    onComplete:done });
  });
 } else done();
}

function renderAll(){
 var model = computeModel();
 renderHero(model);
 renderAttrs(model);
 animateRadar(model);
 el('logBtn').classList.toggle('pulse', model.testedCount === 0);
}

/* ── Log flow ── */
var logTestId = null;

function openLog(testId){
 logTestId = testId || null;
 var body = el('logBody');
 el('logTitle').textContent = 'Log result';
 if (!testId){ body.innerHTML = buildTestGrid(); wireTestGrid(); }
 else renderLogForm(testById(testId));
 openModal('logSheet');
}
function buildTestGrid(){
 var byAttr = {};
 TESTS.forEach(function(t){ if (!byAttr[t.attr]) byAttr[t.attr] = []; byAttr[t.attr].push(t); });
 var html = '<div class="test-grid">';
 TESTS.slice().sort(function(a,b){ return a.attr < b.attr ? -1 : a.attr > b.attr ? 1 : 0; }).forEach(function(t){
  html += '<button class="test-pick" data-test="' + t.id + '">' + t.name + '<small>' + t.attr + ' \u00b7 ' + t.hint + '</small></button>';
 });
 return html + '</div>';
}
function wireTestGrid(){
 Array.prototype.forEach.call(el('logBody').querySelectorAll('[data-test]'), function(b){
  b.addEventListener('click', function(){ snd('click'); renderLogForm(testById(b.getAttribute('data-test'))); });
 });
}

function renderLogForm(test){
 el('logTitle').textContent = test.name;
 var html = '';
 if (test.kind === 'time'){
  html += '<div class="fld"><label>Time</label><div class="timepair"><input id="fMin" inputmode="numeric" placeholder="min" aria-label="Minutes"><span>:</span><input id="fSec" inputmode="decimal" placeholder="sec" aria-label="Seconds"></div></div>';
 } else if (test.kind === 'timeS'){
  html += '<div class="fld"><label>Time (seconds)</label><input id="fVal" inputmode="decimal" placeholder="5.08"></div>';
 } else if (test.kind === 'int'){
  html += '<div class="fld"><label>Reps</label><input id="fVal" inputmode="numeric" placeholder="0"></div>';
 } else if (test.kind === 'num'){
  html += '<div class="fld"><label>Result (' + (test.unit || '') + ')</label><input id="fVal" inputmode="decimal" placeholder="0"></div>';
 } else if (test.kind === 'grip'){
  html += '<div class="fld"><label>Grip strength (kg)</label><div class="timepair"><input id="fL" inputmode="decimal" placeholder="Left" aria-label="Left hand kg"><span>+</span><input id="fR" inputmode="decimal" placeholder="Right" aria-label="Right hand kg"></div></div>';
  if (!state.bw) html += '<div class="fld"><label>Bodyweight (kg) &middot; saved to settings</label><input id="fBw" inputmode="decimal" placeholder="e.g. 77.1"></div>';
 } else if (test.kind === 'amrap'){
  html += '<div class="fld"><label>Load (kg)</label><div class="loadrow" id="fLoads">';
  Object.keys(test.loads).forEach(function(L){
   html += '<button type="button" class="chip' + (Number(L) === test.defaultLoad ? ' set' : '') + '" data-load="' + L + '">' + L + '</button>';
  });
  html += '</div></div><div class="fld"><label>Reps</label><input id="fVal" inputmode="numeric" placeholder="0"></div>';
 } else if (test.kind === 'ruck'){
  html += '<div class="fld"><label>Load (kg)</label><input id="fLoad" inputmode="decimal" value="24.5"></div>';
  html += '<div class="fld"><label>Distance (km)</label><input id="fDist" inputmode="decimal" value="8"></div>';
  html += '<div class="fld"><label>Total time</label><div class="timepair"><input id="fMin" inputmode="numeric" placeholder="min" aria-label="Minutes"><span>:</span><input id="fSec" inputmode="decimal" placeholder="sec" aria-label="Seconds"></div></div>';
 }
 html += '<div class="fld"><label>Date</label><input type="date" id="fDate" value="' + todayStr() + '"></div>';
 html += '<div class="note">' + test.hint + (test.custom ? ' \u00b7 custom anchors, editable in Settings' : '') + '</div>';
 html += '<div class="err" id="fErr"></div>';
 html += '<div class="sheet-actions"><button class="form-btn form-btn-primary" id="fSave">Save result</button><button class="form-btn" id="fBack">Back</button></div>';
 el('logBody').innerHTML = html;

 Array.prototype.forEach.call(el('logBody').querySelectorAll('#fLoads .chip'), function(ch){
  ch.addEventListener('click', function(){
   Array.prototype.forEach.call(el('fLoads').querySelectorAll('.chip'), function(x){ x.classList.remove('set'); });
   ch.classList.add('set'); snd('click');
  });
 });
 el('fBack').addEventListener('click', function(){ snd('click'); openLog(null); });
 el('fSave').addEventListener('click', function(){ saveLog(test); });
 var first = el('logBody').querySelector('input');
 if (first) setTimeout(function(){ first.focus(); }, 80);
}

function fieldNum(id){ var n = parseFloat(el(id).value); return isFinite(n) ? n : null; }
function fieldErr(msg){ el('fErr').textContent = msg; }

function saveLog(test){
 var v = null, load = null, dist = null, raw = '';
 if (test.kind === 'time'){
  var m = fieldNum('fMin') || 0, s = fieldNum('fSec');
  if (s === null || (m === 0 && s === 0)){ fieldErr('Enter a time.'); return; }
  v = m * 60 + s; raw = fmtMS(v);
 } else if (test.kind === 'timeS'){
  v = fieldNum('fVal');
  if (v === null || v <= 0){ fieldErr('Enter seconds, e.g. 5.08.'); return; }
  raw = (Math.round(v*100)/100) + ' s';
 } else if (test.kind === 'int'){
  v = fieldNum('fVal');
  if (v === null || v < 0){ fieldErr('Enter reps.'); return; }
  v = Math.floor(v); raw = v + ' reps';
 } else if (test.kind === 'num'){
  v = fieldNum('fVal');
  if (v === null || v <= 0){ fieldErr('Enter a result.'); return; }
  raw = v + ' ' + (test.unit || '');
 } else if (test.kind === 'grip'){
  var L = fieldNum('fL'), R = fieldNum('fR');
  if (L === null || R === null || L <= 0 || R <= 0){ fieldErr('Enter left and right kg.'); return; }
  if (!state.bw){
   var bw = el('fBw') ? fieldNum('fBw') : null;
   if (bw === null || bw <= 0){ fieldErr('Enter bodyweight once. It is saved to settings.'); return; }
   state.bw = Math.round(bw * 10) / 10;
  }
  v = Math.round(((L + R) / state.bw) * 100) / 100;
  raw = 'L ' + L + ' + R ' + R + ' kg \u2192 ' + v.toFixed(2);
 } else if (test.kind === 'amrap'){
  var chip = el('fLoads').querySelector('.chip.set');
  load = chip ? Number(chip.getAttribute('data-load')) : test.defaultLoad;
  v = fieldNum('fVal');
  if (v === null || v < 0){ fieldErr('Enter reps.'); return; }
  v = Math.floor(v); raw = v + ' \u00d7 ' + load + ' kg';
 } else if (test.kind === 'ruck'){
  load = fieldNum('fLoad'); dist = fieldNum('fDist');
  var rm = fieldNum('fMin') || 0, rs = fieldNum('fSec');
  if (load === null || load <= 0 || dist === null || dist <= 0 || rs === null){ fieldErr('Enter load, distance and time.'); return; }
  var total = rm * 60 + rs;
  if (total <= 0){ fieldErr('Enter a time.'); return; }
  v = Math.round(total / dist);
  raw = fmtMS(v) + ' /km \u00b7 ' + load + ' kg \u00b7 ' + dist + ' km';
 }
 var d = el('fDate').value || todayStr();
 var prev = latestEntry(test.id);
 var prevLevel = prev ? levelOf(test, prev.v, prev) : -1;
 var entry = { id:uid(), t:test.id, d:d, v:v, load:load, dist:dist, raw:raw, ts:Date.now() };
 state.entries.push(entry);
 save();
 closeModal('logSheet');
 renderAll();
 var newLevel = levelOf(test, v, entry);
 announce('Saved ' + test.name + ', ' + raw + '.');
 if (prevLevel >= 0 && newLevel > prevLevel){
  try { if (window.Core && Core.confetti) Core.confetti.launch('fx'); else if (typeof launchConfetti === 'function') launchConfetti('fx'); } catch(e) {}
  snd('chime');
  announce('Level up. ' + test.name + ' is now Level ' + newLevel + '.');
 }
}

/* ── Attribute detail ── */
function openDetail(code){
 var attr = attrByCode(code);
 if (!attr) return;
 el('detailTitle').textContent = attr.name + ' (' + attr.code + ')';
 var html = '';
 attr.tests.forEach(function(tid){
  var t = testById(tid);
  var list = entriesFor(tid);
  var latest = list.length ? list[list.length-1] : null;
  html += '<div class="d-test">';
  html += '<div class="d-row"><div class="d-name">' + t.name + '</div>';
  if (latest){
   var lv = levelOf(t, latest.v, latest);
   html += '<span class="d-val">' + latest.raw + '</span>' + levelChip(lv);
  } else {
   html += '<span class="d-val" style="color:var(--lg-ink-faint)">\u2014</span>';
  }
  html += '</div>';
  html += '<div class="d-sub">';
  if (latest){
   var best = bestEntry(t, list);
   html += 'Best ' + best.raw + ' \u00b7 ' + fmtDate(best.d) + ' \u00b7 Latest ' + fmtDate(latest.d) + ' \u00b7 Score ' + scoreOf(t, latest.v, latest);
  } else {
   html += 'No results yet';
  }
  html += '</div>';
  if (list.length) html += '<canvas class="spark" id="spark-' + tid + '"></canvas>';
  if (list.length){
   html += '<div class="entries">';
   list.slice(-5).reverse().forEach(function(e){
    html += '<div class="entry"><span class="e-d">' + fmtDate(e.d) + '</span><span class="e-v">' + e.raw + '</span><button class="e-x" data-del="' + e.id + '" aria-label="Delete entry">&times;</button></div>';
   });
   html += '</div>';
  }
  html += '<button class="mini-log" data-log="' + tid + '">+ Log ' + t.name + '</button>';
  html += '</div>';
 });
 el('detailBody').innerHTML = html;
 Array.prototype.forEach.call(el('detailBody').querySelectorAll('[data-log]'), function(b){
  b.addEventListener('click', function(){ closeModal('detail'); openLog(b.getAttribute('data-log')); });
 });
 Array.prototype.forEach.call(el('detailBody').querySelectorAll('[data-del]'), function(b){
  b.addEventListener('click', function(){
   var id = b.getAttribute('data-del');
   if (b.getAttribute('data-armed') === '1'){
    state.entries = state.entries.filter(function(e){ return e.id !== id; });
    save(); renderAll(); openDetail(code); snd('click');
   } else {
    b.setAttribute('data-armed', '1'); b.textContent = 'sure?';
    setTimeout(function(){ b.removeAttribute('data-armed'); b.innerHTML = '&times;'; }, 2500);
   }
  });
 });
 openModal('detail');
 attr.tests.forEach(function(tid){
  var list = entriesFor(tid);
  if (list.length) setTimeout(function(a,b){ return function(){ drawSpark(a,b); }; }(tid, list), 40);
 });
}
function bestEntry(t, list){
 var best = list[0];
 list.forEach(function(e){
  if (t.dir === 'hi' ? e.v > best.v : e.v < best.v) best = e;
 });
 return best;
}
function drawSpark(tid, list){
 var cv = el('spark-' + tid);
 if (!cv) return;
 var t = testById(tid);
 var cssW = cv.clientWidth || 300, cssH = 46;
 var dpr = Math.min(window.devicePixelRatio || 1, 2);
 cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
 var ctx = cv.getContext('2d');
 ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
 var scores = list.map(function(e){ return scoreOf(t, e.v, e); });
 var min = Math.min.apply(null, scores), max = Math.max.apply(null, scores);
 if (min === max){ min -= 5; max += 5; }
 var padX = 8, padY = 7;
 var X = function(i){ return list.length === 1 ? cssW/2 : padX + i * (cssW - padX*2) / (list.length - 1); };
 var Y = function(s){ return cssH - padY - (s - min) / (max - min) * (cssH - padY*2); };
 var dark = !!(window.Core && Core.isDark);
 var line = dark ? 'rgba(167,139,250,0.9)' : 'rgba(124,58,237,0.9)';
 ctx.strokeStyle = line; ctx.lineWidth = 1.6; ctx.beginPath();
 scores.forEach(function(s, i){ var x = X(i), y = Y(s); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
 ctx.stroke();
 scores.forEach(function(s, i){
  ctx.beginPath(); ctx.arc(X(i), Y(s), i === scores.length-1 ? 3 : 2, 0, Math.PI*2);
  ctx.fillStyle = line; ctx.fill();
 });
}

/* ── Settings ── */
function parsePace(str){
 str = (str || '').trim();
 if (!str) return null;
 if (str.indexOf(':') >= 0){
  var p = str.split(':');
  var m = parseInt(p[0], 10), s = parseFloat(p[1]);
  if (!isFinite(m) || !isFinite(s)) return null;
  return m * 60 + s;
 }
 var n = parseFloat(str);
 if (!isFinite(n)) return null;
 return n < 30 ? n * 60 : n;
}
function openSettings(){
 el('setBw').value = state.bw || '';
 var r = state.ruck || DEFAULT_RUCK;
 el('rkFloor').value = fmtMS(r.floor); el('rkL1').value = fmtMS(r.l1); el('rkL2').value = fmtMS(r.l2); el('rkL3').value = fmtMS(r.l3); el('rkCap').value = fmtMS(r.cap);
 el('setErr').textContent = '';
 openModal('settings');
}
function saveSettings(){
 var bw = parseFloat(el('setBw').value);
 if (el('setBw').value.trim() !== '' && (!isFinite(bw) || bw <= 0)){ el('setErr').textContent = 'Bodyweight must be a positive number.'; return; }
 var r = { floor:parsePace(el('rkFloor').value), l1:parsePace(el('rkL1').value), l2:parsePace(el('rkL2').value), l3:parsePace(el('rkL3').value), cap:parsePace(el('rkCap').value) };
 for (var k in r){ if (r[k] === null || r[k] <= 0){ el('setErr').textContent = 'All five pace anchors are required (mm:ss per km).'; return; } }
 if (!(r.floor > r.l1 && r.l1 > r.l2 && r.l2 > r.l3 && r.l3 > r.cap)){ el('setErr').textContent = 'Paces must descend: floor slowest, cap fastest.'; return; }
 state.bw = (el('setBw').value.trim() === '') ? null : Math.round(bw * 10) / 10;
 state.ruck = r;
 save(); closeModal('settings'); renderAll();
 announce('Settings saved.');
}
function exportState(){
 var txt = JSON.stringify(state, null, 2);
 function done(){ announce('Backup copied to clipboard.'); var b = el('setExport'); b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Export'; }, 1600); }
 if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); }); }
 else { fallbackCopy(txt); done(); }
}
function fallbackCopy(txt){
 var ta = document.createElement('textarea');
 ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
 document.body.appendChild(ta); ta.select();
 try { document.execCommand('copy'); } catch(e) {}
 ta.remove();
}
function wireReset(){
 var b = el('setReset');
 b.addEventListener('click', function(){
  if (b.classList.contains('armed')){
   state = { v:1, bw:null, entries:[], ruck:{ floor:840, l1:750, l2:700, l3:660, cap:570 } };
   save(); b.classList.remove('armed'); b.textContent = 'Reset';
   closeModal('settings'); renderAll(); announce('All athlete data cleared.');
  } else {
   b.classList.add('armed'); b.textContent = 'Click again to wipe';
   setTimeout(function(){ b.classList.remove('armed'); b.textContent = 'Reset'; }, 3000);
  }
 });
}

/* ── Name (shared user config, never hardcoded) ── */
function renderName(){
 var n = null;
 try { n = SyncEngine.get('user', 'name'); } catch(e) {}
 el('heroName').textContent = (n && typeof n === 'string' ? n : 'Athlete').toUpperCase();
}

/* ── Sync status ── */
function setSync(t){ el('syncState').textContent = t; }

/* ── Boot ── */
function boot(){
 loadState();
 renderName();
 renderAll();
 try { if (window.SyncEngine) SyncEngine.onReady(function(){ setSync(SyncEngine.isOnline() ? 'Synced' : 'Local'); }); } catch(e) {}
 setTimeout(function(){ if (!el('syncState').textContent) setSync(SyncEngine.isOnline && SyncEngine.isOnline() ? 'Synced' : 'Local'); }, 2500);
}

el('logBtn').addEventListener('click', function(){ openLog(null); });
el('settingsBtn').addEventListener('click', function(){ openSettings(); });
el('setSave').addEventListener('click', saveSettings);
el('setExport').addEventListener('click', exportState);
wireReset();

try {
 if (window.Core && Core.background) Core.background.init('bg', { orbCount:2, orbRadius:[60,100], orbSpeed:0.15, hueRange:[250,40], mouseTracking:true });
 else if (typeof initBackground === 'function') initBackground('bg', { orbCount:2, orbRadius:[60,100], orbSpeed:0.15, hueRange:[250,40], mouseTracking:true });
} catch(e) {}
try { if (window.Core && Core.tooltip) Core.tooltip.init(); } catch(e) {}
try { if (window.Core && Core.tilt) Core.tilt.init('.container', { maxDeg:2 }); } catch(e) {}
try { if (window.Core && Core.on) Core.on('theme-change', function(){ renderAll(); }); } catch(e) {}

document.addEventListener('visibilitychange', function(){
 if (!document.hidden && window.SyncEngine && SyncEngine.isOnline && SyncEngine.isOnline()){
  try { SyncEngine.pull(NS).then(function(){ loadState(); renderAll(); }); } catch(e) {}
 }
});

var _resizeT = null;
window.addEventListener('resize', function(){
 clearTimeout(_resizeT);
 _resizeT = setTimeout(function(){ drawRadar(computeModel(), 1); }, 180);
});

if (window.SyncEngine && typeof SyncEngine.init === 'function'){
 var raced = false;
 var t = setTimeout(function(){ if (!raced){ raced = true; boot(); } }, 1600);
 try {
  SyncEngine.init({ worker:WORKER, namespaces:[NS, 'user'] })
   .then(function(){ if (!raced){ raced = true; clearTimeout(t); boot(); } });
 } catch(e){
  if (!raced){ raced = true; clearTimeout(t); boot(); }
 }
} else {
 boot();
}
</script>
</body>
</html>
